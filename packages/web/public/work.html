<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>作品详情 · versekit</title>
<link rel="stylesheet" href="/app.css">
</head>
<body data-page="works">
<div class="app">
  <nav class="nav" aria-label="主导航"><div class="brand"><i></i>versekit</div>
    <a class="nv" href="today.html" data-key="today">今天<b data-todo hidden></b></a>
    <a class="nv" href="works.html" data-key="works" aria-current="page">作品</a>
    <a class="nv" href="data.html" data-key="data">数据</a>
    <a class="nv" href="system.html" data-key="system">系统</a></nav>
  <main id="main">
    <div class="hd"><h1>作品详情</h1><span class="sub" id="sub">每支成片、每个平台稿、每个数字的来源都在这一页。</span></div>
    <section class="wip" aria-label="还没做">
      <h3 id="title">这一页还没做</h3>
      <p>作品详情要按成片列出每条平台稿，发过的显示和平时比的倍数，出问题的有红底说明和「再试一次」。
        数据来自 <code>vk work show &lt;作品 id&gt;</code>。</p>
      <div class="cmd">对应命令：<code>vk work show &lt;workId&gt;</code></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <a class="btn" href="/works">回作品 →</a>
        <a class="btn" href="/today">回今天 →</a>
      </div>
    </section>
  </main>
</div>
<script src="/api.js"></script>
<script src="/shell.js"></script>
<script>
(async function () {
  const sub = document.getElementById("sub");
  const title = document.getElementById("title");
  const id = new URLSearchParams(location.search).get("id");
  // 只显示这条作品的标题；页面本身等下一轮做（#149），这里不假装已经能看到详情。
  if (!id) return;
  try {
    await window.VK.ready();
    const data = await window.VK.work(id);
    title.textContent = `${data.work.title} · 详情还没做`;
    sub.textContent = `${data.work.cuts.length} 支成片 · ${data.work.cuts.reduce((n, c) => n + c.publishes.length, 0)} 条平台稿`;
  } catch (err) {
    sub.textContent = `读不到这个作品：${err.message}`;
  }
})();
</script>
</body>
</html>
