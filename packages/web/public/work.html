<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>作品 · versekit</title>
<link rel="stylesheet" href="/app.css">
<style>
.works{display:flex;flex-direction:column}
.work{border-bottom:1px solid var(--line-soft)}
.work:last-child{border-bottom:0}
.work-head{display:grid;grid-template-columns:minmax(0,1fr) 120px 90px;gap:10px;align-items:center;padding:12px 16px;cursor:pointer}
.work-head:hover{background:var(--paper)}
.work-title{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.work-meta{color:var(--faint);font-size:12px;margin-top:2px;font-family:var(--mono)}
.work-state{font-size:12px;color:var(--muted);text-align:right}
.work-body{padding:0 16px 14px}
.plats{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.plat{display:inline-flex;align-items:center;gap:7px;padding:6px 10px;border:1px solid var(--line);border-radius:7px;background:var(--paper);font-size:12px}
.plat b{font-weight:600}
.plat .st{color:var(--muted)}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;background:var(--line)}
.dot.ok{background:var(--green)}.dot.bad{background:var(--red)}.dot.warn{background:var(--amber)}
.gapbox{margin-top:10px;padding:10px 12px;border:1px dashed var(--line);border-radius:8px;color:var(--muted);font-size:12px;line-height:1.7}
</style>
</head>
<body data-page="works">
<a class="skip" href="#main">跳到主内容</a>

<div class="shell">
  <aside class="sidebar"></aside>

  <main id="main"><div class="page">
    <header class="pagehead">
      <div>
        <div class="crumb"><span>账号组 · <b id="group-label">—</b></span></div>
        <h1>作品</h1>
        <p class="sub" id="sub">一个作品发到几个平台，就带几条平台状态。</p>
      </div>
      <a class="btn primary" href="/publish">+ 发布内容</a>
    </header>

    <section class="panel" aria-label="作品列表">
      <div class="works" id="works"></div>
    </section>

    <footer class="pagefoot">
      <span>平台级状态逐平台显示；数字旁边会标采集时间与来源。</span>
      <a href="/runs">查看任务与日志 →</a>
    </footer>
  </div></main>
</div>

<script src="/api.js"></script>
<script src="/shell.js"></script>
<script>
(function(){
  const $ = (id) => document.getElementById(id);
  const STATE = {
    queued: "待发", auto_running: "发布中", draft_running: "生成草稿中", draft_pending: "待确认草稿",
    notify_pending: "待人工确认", published: "已发布", published_limited: "仅自己可见",
    failed: "失败", blocked: "受阻", canceled: "已取消",
  };
  const levelOf = (s) => s === "published" || s === "published_limited" ? "ok" : s === "failed" || s === "blocked" ? "bad" : "warn";
  const fmt = (ms) => { if(!ms) return "—"; const d = new Date(Number(ms)); const p=(n)=>String(n).padStart(2,"0"); return p(d.getMonth()+1)+"-"+p(d.getDate())+" "+p(d.getHours())+":"+p(d.getMinutes()); };

  function render(rows){
    const group = VK.current();
    if(!group) { location.replace("/groups.html"); return; }
    $("group-label").textContent = group.name;

    // 按作品聚合：一个 work 一行，平台状态逐条列出。
    const byWork = new Map();
    for(const r of rows){
      const key = r.asset_path + "|" + r.title;
      if(!byWork.has(key)) byWork.set(key, { title: r.title, asset: r.asset_path, rows: [] });
      byWork.get(key).rows.push(r);
    }
    const list = [...byWork.values()];
    $("sub").textContent = list.length ? (list.length + " 个作品 · " + rows.length + " 条平台发布") : "还没有作品。发一条试试。";

    const box = $("works");
    if(!list.length){
      box.innerHTML = '<p style="padding:18px 16px;color:var(--muted);font-size:13px">还没有作品。<a href="/publish">去发布第一条 →</a></p>';
      return;
    }
    box.innerHTML = list.map((w, i) => {
      const plats = w.rows.map(r => {
        const info = VK.platformMap()[r.platform] ?? { name: r.platform };
        return '<span class="plat"><span class="dot ' + levelOf(r.state) + '"></span><b>' + info.name + '</b>' +
          '<span class="st">' + (VK.isPhoneHandoff(r) ? "待在手机上发布" : (STATE[r.state] ?? r.state)) + '</span></span>';
      }).join("");
      const handoffs = w.rows.filter(r => VK.isPhoneHandoff(r)).map(r => VK.handoffMarkup(r)).join("");
      const earliest = Math.min(...w.rows.map(r => r.created_at ?? Date.now()));
      return '<div class="work" data-i="' + i + '">' +
        '<div class="work-head" role="button" tabindex="0">' +
          '<div><div class="work-title">' + w.title + '</div>' +
          '<div class="work-meta">' + fmt(earliest) + ' · ' + w.rows.length + ' 个平台</div></div>' +
          '<span class="work-state">' + plats.length + ' 个平台</span>' +
          '<span class="work-state">' + (w.rows.some(r => levelOf(r.state) === "bad") ? "有失败" : "正常") + '</span>' +
        '</div>' +
        '<div class="work-body"' + (handoffs ? '' : ' hidden') + '><div class="plats">' + plats + '</div>' + handoffs +
          '<div class="gapbox">采集缺口：' + (w.rows.every(r => r.state !== "published" && r.state !== "published_limited")
            ? "还没有成功发布，发布成功后才有指标可采"
            : "指标按采集任务回填；缺数据时这里会写明来源与时间") + '</div>' +
        '</div></div>';
    }).join("");

    VK.hydrateHandoff(box);
    box.querySelectorAll('.work-head').forEach(head => {
      const toggle = () => { head.nextElementSibling.hidden = !head.nextElementSibling.hidden; };
      head.addEventListener("click", toggle);
      head.addEventListener("keydown", (e) => { if(e.key === "Enter" || e.key === " "){ e.preventDefault(); toggle(); } });
    });
  }

  VK.ready()
    .then(() => VK.request("/api/publishes?limit=200"))
    .then((d) => render(d.rows ?? []))
    .catch(err => { $("sub").textContent = "读不到作品：" + err.message; });
})();
</script>
</body>
</html>
