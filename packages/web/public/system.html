<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>系统 · versekit</title>
<link rel="stylesheet" href="/app.css">
<style>
/* 系统页：账号组与账号。结构照 docs/design/system.html，只补设计稿里没有的「接入账号」「应用凭证」两行。 */
.app .sysrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}
.app .sysrow select{height:34px;border:1px solid var(--ctl);border-radius:7px;padding:0 9px;font:inherit;font-size:14px;background:var(--paper);color:var(--ink);min-width:0}
.app .sysrow input[type=text],.app .sysrow input[type=password]{width:220px}
.app .sysrow .say{flex:1 1 100%;font-size:13px;color:var(--ink2);line-height:1.6}
.app input[type=password]{height:34px;border:1px solid var(--ctl);border-radius:7px;padding:0 9px;font-size:14px;background:var(--paper);min-width:0;color:var(--ink);font-family:inherit}
.app .say.bad,.app .why.bad{color:var(--bad);font-weight:600}
.app td .why{display:block;font-size:12px;color:var(--ink2);margin-top:2px;max-width:46ch;white-space:normal;line-height:1.5}
.app td .why a{color:var(--ink)}
.app tr.credrow td{background:var(--mark-bg);border-bottom:1px solid var(--mark-line)}
.app tr.credrow .sysrow{margin-top:0}
.app .av{width:20px;height:20px;border-radius:50%;object-fit:cover;vertical-align:-5px;margin-right:6px;background:var(--side)}
.app .acct{white-space:nowrap}
.app .grpname{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.app .grpname input[type=text]{width:180px}
.app .tbtns{display:inline-flex;gap:10px;align-items:center;justify-content:flex-end}
/* 发布方案 / 发布机 / 平台规则 / 最近出的问题：结构照 docs/design/system.html */
.app .two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.app .kv{padding:14px 16px;display:grid;grid-template-columns:110px minmax(0,1fr);gap:6px 12px;font-size:14px;margin:0}
.app .kv dt{color:var(--ink2);font-size:13px}
.app .kv dd{margin:0}
.app .plan td:first-child{white-space:nowrap;font-weight:600}
.app .pfs{display:flex;gap:10px 14px;flex-wrap:wrap}
.app tr.planedit td{background:var(--mark-bg);border-bottom:1px solid var(--mark-line)}
.app .pickpf{display:flex;gap:6px 16px;flex-wrap:wrap;margin:2px 0 10px}
.app .pickpf label{display:inline-flex;gap:6px;align-items:center;min-height:32px;font-size:14px}
.app input[type=number]{height:34px;width:72px;border:1px solid var(--ctl);border-radius:7px;padding:0 9px;font-size:14px;background:var(--paper);color:var(--ink);font-family:inherit}
@media (max-width:860px){.app .two{grid-template-columns:minmax(0,1fr)}}
</style>
</head>
<body data-page="system">
<div class="app">
  <nav class="nav" aria-label="主导航"><div class="brand"><i></i>versekit</div>
    <a class="nv" href="today.html" data-key="today">今天<b data-todo hidden></b></a>
    <a class="nv" href="works.html" data-key="works">作品</a>
    <a class="nv" href="data.html" data-key="data">数据</a>
    <a class="nv" href="system.html" data-key="system" aria-current="page">系统</a></nav>
  <main id="main"><div class="loading">正在读账号组和账号…</div></main>
</div>
<script src="/api.js"></script>
<script src="/panel.js"></script>
<script src="/shell.js"></script>
<script>
(function () {
  const main = document.getElementById("main");
  const VK = window.VK;
  const panel = window.VKPanel({ editing: new Set(), ver: new Map() });
  const { esc, pfBadge, pfName, BLANK } = panel;
  const whenText = (ms) => panel.when(ms).text;
  const toast = (m) => window.VKShell?.toast(m);

  // 平台在「接入账号」里的叫法：tiktok-api 是官方接口，和网页登录的 tiktok 分开说。
  const LABEL = { xiaohongshu: "小红书", douyin: "抖音", bilibili: "B站", youtube: "YouTube", tiktok: "TikTok（网页登录）", "tiktok-api": "TikTok（官方接口）" };
  const labelOf = (p) => LABEL[p] ?? p;
  const SCAN = new Set(["xiaohongshu", "douyin", "bilibili"]); // 扫码；其余是登录
  const WEB_LOGIN = (p) => p !== "bilibili" && p !== "tiktok-api"; // 靠自己的浏览器资料保持登录的平台
  const QR_HINT = "扫码会登录手机 App 当前的号；要接另一个号，先在 App 里切换账号，或改用短信登录。";
  const NOTE = { xiaohongshu: "逐条单独确认", "tiktok-api": "走官方接口" };
  const TIKTOK_FAMILY = ["tiktok", "tiktok-api"];

  const ui = {
    accounts: [], platforms: [], today: null, groupsErr: null,
    login: {},            // accountId → { kind: "wait" | "fail", text, url }
    logoutAsk: null,      // 正在二次确认「退出登录」的账号 id
    renaming: null, newGroup: false, newGroupName: "", groupBusy: false, groupNote: "",
    addPlatform: "", addName: "", addBusy: false, addNote: "",
    cred: { key: "", secret: "", busy: false, note: "", bad: false },
    plan: null, machine: null, update: null, relay: null, problems: [], planEdit: null, planNote: "", planBusy: false, retrying: new Set(), sectionErr: null,
  };
  const polls = new Map();

  const stamp = (ms) => {
    if (!ms) return "还没检查过";
    const d = new Date(ms), now = new Date();
    const hm = `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
    const days = Math.round((new Date(now.getFullYear(), now.getMonth(), now.getDate()) - new Date(d.getFullYear(), d.getMonth(), d.getDate())) / 864e5);
    return `${days <= 0 ? "今天" : days === 1 ? "昨天" : `${days} 天前`} ${hm} 检查过`;
  };

  const platformInfo = (p) => ui.platforms.find((x) => x.platform === p) ?? null;
  const credsMissing = (a) => a.platform === "tiktok-api" && platformInfo("tiktok-api")?.credentials?.configured === false;
  const connected = (a) => Boolean(a.credential_ref && a.state === "ok");

  // ── 读数据 ─────────────────────────────────────────────────────────────
  async function load() {
    const group = VK.current();
    const [accounts, platforms, today] = await Promise.all([
      group ? VK.groupAccounts(group.id) : [],
      VK.request("/api/platforms").then((d) => d.platforms ?? []).catch(() => []),
      group ? VK.today().catch(() => null) : null,
    ]);
    ui.accounts = accounts;
    ui.platforms = platforms;
    ui.today = today;
    await loadSections(group);
    const taken = (p) => accounts.some((a) => a.platform === p || (TIKTOK_FAMILY.includes(p) && TIKTOK_FAMILY.includes(a.platform)));
    if (!ui.addPlatform || !platforms.some((p) => p.platform === ui.addPlatform) || taken(ui.addPlatform)) ui.addPlatform = (platforms.find((p) => !taken(p.platform)) ?? platforms[0])?.platform ?? "";
  }

  /** 发布方案、发布机、最近出的问题：都来自 /api（plan.show、machine.status、run.list + 今天的问题清单）。一块读不到不拖垮别的块。 */
  async function loadSections(group) {
    ui.sectionErr = null;
    if (!group) { ui.plan = null; ui.machine = null; ui.update = null; ui.relay = null; ui.problems = []; return; }
    const q = `group=${encodeURIComponent(group.id)}`;
    const [plan, machine, runs, update, relay] = await Promise.all([
      VK.request(`/api/plan?${q}`).catch((e) => { ui.sectionErr = e.message; return null; }),
      VK.request(`/api/machine?${q}`).catch(() => null),
      VK.request(`/api/runs?state=failed&limit=100&${q}`).catch(() => null),
      VK.request("/api/update").catch(() => null),
      VK.request("/api/relay").catch(() => null),
    ]);
    ui.plan = plan;
    ui.machine = machine;
    ui.update = update;
    ui.relay = relay;
    // 最近 7 天、失败的发布任务；只有这条平台稿现在还停在出问题的状态才能「再试一次」。
    const since = Date.now() - 7 * 864e5;
    const bad = new Map((ui.today?.problems ?? []).map((p) => [p.publishId, p]));
    ui.problems = (runs?.rows ?? [])
      .filter((r) => r.target_type === "publish" && r.created_at >= since && bad.has(r.target_id))
      .map((r) => ({ run: r, p: bad.get(r.target_id) }))
      .filter((x, i, all) => all.findIndex((y) => y.p.publishId === x.p.publishId) === i);
  }

  async function refresh() {
    await VK.bootstrap({ force: true });
    await load();
    draw();
    window.VKShell?.refreshHealth();
  }

  // ── 画页面 ─────────────────────────────────────────────────────────────
  function accountRow(a) {
    const st = VK.loginState(a);
    const lg = ui.login[a.id];
    const name = a.display_name || a.handle;
    const who = a.avatar_url && connected(a)
      ? `<img class="av" src="${esc(a.avatar_url)}" alt="" width="20" height="20" referrerpolicy="no-referrer">${esc(name)}`
      : esc(name);
    let status;
    if (lg?.kind === "wait") status = `<span class="st wait">${lg.waitLabel}</span>${lg.text ? `<span class="why">${lg.text}</span>` : ""}`;
    else if (lg?.kind === "fail") status = `<span class="st bad">没登上</span><span class="why bad">${esc(lg.text)}</span>`;
    else status = `<span class="st ${st.cls}">${st.label}</span> <span class="sub">${stamp(a.lastCheckedAt)}</span>${a.identityConflict ? `<span class="why bad">${esc(a.identityConflict)}</span>` : ""}`;
    const q = a.quota;
    const quota = q ? `${q.left} 条 <span class="sub">每天最多 ${q.cap} 条</span>` : '<span class="sub">不限</span>';
    const note = [NOTE[a.platform], a.mode === "manual" ? "仅手动跟踪" : ""].filter(Boolean).join("，");
    let act;
    if (lg?.kind === "wait") {
      act = a.platform === "tiktok-api" ? "" : `<span class="tbtns"><button class="link" data-cancel="${esc(a.id)}">取消</button><button class="btn pri" data-done="${esc(a.id)}">${SCAN.has(a.platform) ? "我扫好了" : "我登录好了"}</button></span>`;
    } else if (credsMissing(a)) act = '<span class="sub">先填下面的应用凭证</span>';
    else if (a.platform === "tiktok-api") act = `<button class="${connected(a) ? "link" : "btn pri"}" data-login="${esc(a.id)}">${connected(a) ? "重新连接" : "Connect TikTok"}</button>`;
    else act = `<button class="${st.key === "ok" ? "link" : "btn"}" data-login="${esc(a.id)}">重新登录</button>`;
    // 退出登录：关浏览器 + 删这个账号自己的浏览器资料，之后才能扫码/短信登录另一个号（vk account logout）。
    if (!credsMissing(a) && WEB_LOGIN(a.platform) && lg?.kind !== "wait") {
      act += ui.logoutAsk === a.id
        ? ` <span class="tbtns"><span class="sub">会删掉这个账号的登录资料</span><button class="btn" data-logoutyes="${esc(a.id)}">确认退出</button><button class="link" data-logoutno>算了</button></span>`
        : ` <button class="link" data-logout="${esc(a.id)}">退出登录</button>`;
    }
    const row = `<tr data-acc="${esc(a.id)}"><td><span class="pfn">${pfBadge(a.platform)}${esc(labelOf(a.platform))}</span></td><td class="acct">${who}</td><td>${status}</td><td>${quota}</td><td class="sub">${esc(note)}</td><td class="n">${act}</td></tr>`;
    if (!credsMissing(a)) return row;
    const c = ui.cred;
    return row + `<tr class="credrow"><td colspan="6"><form class="sysrow" data-credform onsubmit="return false"><b style="font-weight:600">TikTok 官方接口还没有应用凭证</b>` +
      `<input type="text" id="cred-key" placeholder="client key" aria-label="client key" autocomplete="off" value="${esc(c.key)}">` +
      `<input type="password" id="cred-secret" placeholder="client secret" aria-label="client secret" autocomplete="new-password" value="${esc(c.secret)}">` +
      `<button class="btn pri" data-credsave${c.busy ? " disabled" : ""}>保存</button>` +
      `<span class="say${c.bad ? " bad" : ""}" role="status">${esc(c.note) || "在 TikTok 开发者后台的应用里复制。保存在这台电脑的 config.json（权限 600），不会回显，也不进日志。"}</span></form></td></tr>`;
  }

  function groupRows(pending) {
    const accountsOf = (id) => (VK.snapshot()?.accounts ?? []).filter((a) => a.groupId === id);
    return VK.groups().map((g) => {
      const isCur = g.id === VK.current()?.id;
      const mine = ui.today ? ui.today.awaiting.length + ui.today.problems.length : 0;
      const n = isCur ? mine : Number(pending[g.id] ?? 0);
      const accs = accountsOf(g.id);
      const names = accs.length ? `${accs.length} 个 · <span class="sub">${accs.map((a) => esc(pfName(a.platform))).join("、")}</span>` : '<span class="sub">还没有账号</span>';
      const nameCell = ui.renaming === g.id
        ? `<div class="grpname"><input type="text" id="rename-input" value="${esc(g.name)}" aria-label="新名字" maxlength="60"><button class="btn pri" data-renamesave="${esc(g.id)}">保存</button><button class="link" data-renamecancel>取消</button></div>`
        : `<b style="font-weight:600">${esc(g.name)}</b>`;
      const act = isCur ? '<span class="sub">当前</span>' : `<a class="btn" href="/system" data-sw="${esc(g.id)}">切过去</a>`;
      return `<tr><td>${nameCell}</td><td>${names}</td><td>${n ? `<span class="st wait">${n} 件</span>` : '<span class="st">没有</span>'}</td>` +
        `<td class="n"><span class="tbtns">${ui.renaming === g.id ? "" : `<button class="link" data-rename="${esc(g.id)}">改名</button>`}${act}</span></td></tr>`;
    }).join("");
  }

  function addRow(group) {
    const taken = (p) => ui.accounts.some((a) => a.platform === p || (TIKTOK_FAMILY.includes(p) && TIKTOK_FAMILY.includes(a.platform)));
    const opts = ui.platforms.map((p) => `<option value="${esc(p.platform)}"${p.platform === ui.addPlatform && !taken(p.platform) ? " selected" : ""}${taken(p.platform) ? " disabled" : ""}>${esc(labelOf(p.platform))}${taken(p.platform) ? "（已接入）" : ""}</option>`).join("");
    const none = !ui.platforms.length;
    const allTaken = !none && ui.platforms.every((p) => taken(p.platform));
    const empty = none ? "没有已安装的平台" : "这个组的平台都接上了";
    return `<div class="sysrow" id="addrow"><select id="add-platform" aria-label="平台"${none || allTaken ? " disabled" : ""}>${none || allTaken ? `<option value="" selected>${empty}</option>` : opts}</select>` +
      `<input type="text" id="add-name" placeholder="账号名（平台上的名字）" aria-label="账号名" autocomplete="off" maxlength="200" value="${esc(ui.addName)}">` +
      `<button class="btn pri" data-add${ui.addBusy || none || allTaken || !group ? " disabled" : ""}>接入账号</button>` +
      `<span class="say${ui.addBad ? " bad" : ""}" role="status">${esc(ui.addNote)}</span></div>`;
  }


  // ── 发布方案 / 发布机 / 平台规则 / 最近出的问题 ───────────────────────────────
  const KIND_OPTS = [["*", "成片"], ["video", "视频"], ["image", "图片"]];
  const LANG_OPTS = [["*", "所有语言"], ["zh", "中文"], ["en", "English"]];
  const pfn = (platform, name) => `<span class="pfn">${pfBadge(platform)}${esc(name ?? labelOf(platform))}</span>`;

  function planRow(r, i) {
    const ed = ui.planEdit;
    const isEdit = ed && !ed.isNew && ed.i === i;
    const cells = `<td>${esc(r.label)}</td><td><div class="pfs">${r.platforms.map((p) => pfn(p.platform, p.name)).join("") || '<span class="sub">还没有接入平台</span>'}</div></td><td class="sub">${esc(r.rhythm)}</td><td class="n"><button class="btn" data-plan="${i}">改</button></td>`;
    return `<tr>${cells}</tr>` + (isEdit ? planEditor(r) : "");
  }

  function planEditor(r) {
    const ed = ui.planEdit;
    const opts = (list, cur, id, dis) => `<select id="${id}" aria-label="${id === "pe-kind" ? "成片类型" : "语言"}"${dis ? " disabled" : ""}>${list.map(([v, n]) => `<option value="${v}"${v === cur ? " selected" : ""}>${n}</option>`).join("")}</select>`;
    const picks = ui.plan.installedPlatforms.map((p) => `<label><input type="checkbox" data-pe-pf="${esc(p.platform)}"${ed.platforms.includes(p.platform) ? " checked" : ""}> ${esc(p.name)}</label>`).join("");
    const canRemove = !ed.isNew && ui.plan.rows.length > 1;
    return `<tr class="planedit"><td colspan="4"><div class="sysrow" style="margin-top:0">${ed.isNew ? `<b style="font-weight:600">加一行</b>${opts(KIND_OPTS, ed.kind, "pe-kind")}${opts(LANG_OPTS, ed.language, "pe-lang")}` : `<b style="font-weight:600">${esc(r.label)}</b>`}</div>` +
      `<div class="pickpf" role="group" aria-label="发到哪些平台">${picks}</div>` +
      `<div class="sysrow" style="margin-top:0"><label>节奏：入库后第 <input type="number" id="pe-days" min="0" max="60" value="${ed.delayDays}" aria-label="入库后第几天起排"> 天起排</label>` +
      `<button class="btn pri" data-plansave${ui.planBusy ? " disabled" : ""}>保存</button><button class="link" data-plancancel>取消</button>${canRemove ? '<button class="link" data-planremove>删掉这一行</button>' : ""}` +
      `<span class="say${ui.planNote ? " bad" : ""}" role="status">${esc(ui.planNote)}</span></div></td></tr>`;
  }

  function planBlock(group) {
    if (!group) return "";
    const head = `<h2 class="sec" id="plan">发布方案 · ${esc(group.name)} · 哪种成片发到哪些平台、按什么节奏</h2>`;
    if (!ui.plan) return `${head}<div class="note bad">读不到发布方案：${esc(ui.sectionErr ?? "未知错误")}</div>`;
    const rows = ui.plan.rows.map(planRow).join("");
    const adding = ui.planEdit?.isNew ? planEditor({ label: "" }) : "";
    return `${head}<div class="tblwrap"><table class="plan"><thead><tr><th>成片</th><th>发到</th><th>节奏</th><th class="n"></th></tr></thead><tbody>${rows}${adding}</tbody></table></div>` +
      `<div class="cmd">这是你自己的习惯，可以改；新作品入库时按它生成平台稿和建议时间，每条仍然要你确认，已经生成的平台稿不受影响。对应命令：<code>vk plan show</code>　<code>vk plan set --to &lt;平台&gt;</code>　${ui.planEdit?.isNew ? "" : '<button class="link" data-planadd>加一行</button>'}${ui.plan.isDefault ? "" : '<button class="link" data-planreset>恢复默认方案</button>'}</div>`;
  }

  const ago = (ms) => (ms < 90e3 ? "刚刚" : ms < 3600e3 ? `${Math.round(ms / 60e3)} 分钟前` : `${Math.round(ms / 3600e3)} 小时前`);

  function machineBlock() {
    const m = ui.machine;
    const body = !m
      ? '<dt>这台电脑</dt><dd><span class="st bad">读不到</span></dd>'
      : `<dt>这台电脑</dt><dd>${m.online ? '<span class="st done">在线</span>' : '<span class="st bad">不在线</span>'} <span class="sub">${m.heartbeatAgeMs == null ? "还没有收到心跳" : `${ago(m.heartbeatAgeMs)}有心跳`}${m.online ? "" : "；终端执行 vk serve"}</span></dd>` +
        `<dt>排着要发</dt><dd>${m.queued.count} 条已确认${m.queued.nextAt ? `，最近一条 ${esc(whenText(m.queued.nextAt))}` : ""}</dd>` +
        `<dt>正在发</dt><dd>${m.running.count ? `${m.running.count} 条` : "没有"}</dd>` +
        `<dt>等你确认</dt><dd>${m.awaiting.count} 条 <span class="sub">没确认的到时间也不会发</span></dd>`;
    return `<div><h2 class="sec">发布机</h2><div class="panel"><dl class="kv">${body}${relayRows()}${updateRows()}</dl></div><div class="cmd">对应命令：<code>vk machine</code>　<code>vk doctor --human</code>　<code>vk version</code>　<code>vk update --auto on|off</code>　<code>vk relay status</code></div></div>`;
  }

  /** 中转：连接状态、上次拉取、正在下载的投递和进度。没配中转就不画这一行，不占版面。 */
  function relayRows() {
    const r = ui.relay;
    if (!r || !r.configured) return "";
    const st = { ok: '<span class="st done">已连上</span>', error: '<span class="st bad">连不上</span>', never: '<span class="st">还没拉取过</span>' }[r.connection] ?? "";
    const last = r.lastPullAt ? `上次拉取 ${esc(ago(Date.now() - r.lastPullAt))}` : "还没有拉取过";
    const err = r.connection === "error" && r.lastError ? `<div class="sub">${esc(r.lastError.message)}</div>` : "";
    const dl = r.downloading.length
      ? r.downloading.map((d) => `<div>正在下载 ${esc(d.name)} <progress max="100" value="${esc(d.percent)}" aria-label="下载进度"></progress> <span class="sub">${esc(d.percent)}%</span></div>`).join("")
      : `<span class="sub">${r.pending ? `${esc(r.pending)} 个投递还没下完，下一轮接着下` : "没有在下载的"}</span>`;
    return `<dt>中转</dt><dd>${st} <span class="sub">${last}；每 ${esc(r.intervalMinutes)} 分钟拉一次；新作品入库后在「今天」等你确认</span>${err}</dd><dt>正在下载</dt><dd>${dl}</dd>`;
  }

  /** 版本、上次检查、自动更新开关；刚更新过的附上更新内容（最多 5 条提交标题）。读不到就不画，不拖垮发布机这一块。 */
  const RECENT_UPDATE_MS = 3 * 864e5;
  function updateRows() {
    const u = ui.update;
    if (!u) return "";
    const ver = `<code>${esc(u.display ?? `${u.version}+${u.short ?? "未知提交"}`)}</code>`;
    const at = u.installedAt ? `<span class="sub">安装于 ${esc(whenText(Date.parse(u.installedAt)))}</span>` : "";
    const checked = u.lastCheckAt
      ? `${esc(ago(Date.now() - u.lastCheckAt))} <span class="sub">${esc(u.lastCheck?.message ?? "")}</span>`
      : `<span class="sub">还没检查过${u.auto ? "（服务启动后很快会查一次）" : ""}</span>`;
    const lu = u.lastUpdate;
    const fresh = lu && Date.now() - lu.at < RECENT_UPDATE_MS
      ? `<dt>刚更新过</dt><dd>已更新到 ${esc(lu.display ?? lu.version)}（${esc(whenText(lu.at))}）${(lu.commits ?? []).length ? `<ul class="sub" style="margin:6px 0 0;padding-left:18px">${lu.commits.slice(0, 5).map((c) => `<li>${esc(c)}</li>`).join("")}</ul>` : ""}</dd>`
      : "";
    return `<dt>版本</dt><dd>${ver} ${at}</dd>` +
      `<dt>上次检查</dt><dd>${checked}</dd>` +
      `<dt>自动更新</dt><dd><span class="st ${u.auto ? "done" : "bad"}">${u.auto ? "开" : "关"}</span> <span class="sub">${u.auto ? `每 ${esc(u.intervalHours)} 小时检查，只在空闲时更新，失败自动退回` : "不会自动更新；想更新时运行 vk update"}</span> ` +
      `<button class="link" data-autoupd="${u.auto ? "off" : "on"}"${ui.updBusy ? " disabled" : ""}>${u.auto ? "关闭" : "打开"}</button></dd>${fresh}`;
  }

  /** 同一个数值的平台并成一行：「B站、小红书　每个账号每天最多 10 条」。 */
  function ruleLines(rules, field, flag, text) {
    const by = new Map();
    for (const r of rules) {
      const key = `${r[field]}|${r[flag]}`;
      by.set(key, [...(by.get(key) ?? []), r]);
    }
    const single = by.size === 1;
    return [...by.values()].map((g) => `<div>${single ? "" : `<span class="sub">${g.map((r) => esc(r.name)).join("、")}　</span>`}${text(g[0][field])}${g[0][flag] ? ' <span class="sub">默认值</span>' : ""}</div>`).join("");
  }

  function rulesBlock() {
    const rules = ui.plan?.rules ?? [];
    const rows = rules.length
      ? `<dt>每天最多</dt><dd>${ruleLines(rules, "dailyCap", "capIsDefault", (n) => `每个账号 ${n} 条`)}</dd><dt>间隔</dt><dd>${ruleLines(rules, "minGapMinutes", "gapIsDefault", (n) => `同一个账号两条之间至少隔 ${n} 分钟`)}</dd>`
      : "";
    return `<div><h2 class="sec">平台规则 · 对所有人一样，不能关</h2><div class="panel"><dl class="kv"><dt>确认</dt><dd>每一条都要人确认后才会发</dd><dt>小红书</dt><dd>每条单独确认，不能批量</dd>${rows}<dt>AI 标注</dt><dd>每个平台按它的要求标注</dd></dl></div>` +
      `<div class="cmd">你改的时间碰到规则时，会当场告诉你并给出最近的可用时间。数字改在 config.json 的 <code>plan.rules</code>，对应命令：<code>vk plan show</code></div></div>`;
  }

  const WHAT = { failed: "没发出去", blocked: "被拦下了", expired: "过了时间没确认" };

  function problemsBlock(group) {
    if (!group) return "";
    const uf = ui.update?.lastFailure;
    const updRow = uf && Date.now() - uf.at < 7 * 864e5
      ? `<tr><td><b>自动更新</b><span class="sub">${esc(whenText(uf.at))}</span></td><td></td><td><span class="st bad">没更新成功</span><div class="sub">${esc(uf.message)}</div></td><td class="n"></td></tr>`
      : "";
    const relayRowsHtml = (ui.relay?.failures ?? []).map((f) => `<tr><td><b>中转投递${f.title ? `「${esc(f.title)}」` : ""}</b><span class="sub">${esc(whenText(f.at))}</span></td><td></td><td><span class="st bad">没入库</span><div class="sub">${esc(f.message)}</div></td><td class="n"></td></tr>`).join("");
    const rows = updRow + relayRowsHtml + ui.problems.map(({ run, p }) => {
      const day = whenText(run.created_at);
      const why = p.error?.message ?? run.last_error ?? "";
      return `<tr><td><a class="wcell" href="/work#id=${esc(p.workId)}${p.cutId ? `&cut=${esc(p.cutId)}` : ""}"><img class="cv" src="${BLANK}" width="48" height="36" alt=""><span><b>${esc(p.workTitle)}</b><span class="sub">${esc(p.cutTitle ?? "")}${p.cutTitle ? " · " : ""}${esc(day)}</span></span></a></td>` +
        `<td>${pfn(p.platform, pfName(p.platform))}</td><td><span class="st bad">${esc(WHAT[p.state] ?? p.state)}</span><div class="sub">${esc(why)}</div></td>` +
        `<td class="n"><button class="btn pri" data-retry="${esc(p.publishId)}"${ui.retrying.has(p.publishId) ? " disabled" : ""}>再试一次</button></td></tr>`;
    }).join("");
    return `<h2 class="sec" id="problems">最近出的问题</h2>` +
      (rows ? `<div class="tblwrap"><table><tbody>${rows}</tbody></table></div>` : '<div class="panel empty">最近 7 天没有出过问题。</div>') +
      `<div class="cmd">对应命令：<code>vk runs --failed</code>　手机上的通知和确认都在飞书里。</div>`;
  }

  async function savePlanRow() {
    const ed = ui.planEdit;
    ui.planNote = "";
    if (!ed.platforms.length) { ui.planNote = "至少选一个平台"; return draw(); }
    const days = Number(ed.delayDays);
    if (!Number.isInteger(days) || days < 0 || days > 60) { ui.planNote = "天数要是 0 到 60 的整数"; return draw(); }
    ui.planBusy = true; draw();
    try {
      await post("/api/plan", { group: VK.current().id, kind: ed.kind, language: ed.language, platforms: ed.platforms, delayDays: days });
      ui.planEdit = null; ui.planBusy = false;
      toast("发布方案已保存，新作品按它生成平台稿");
      await refresh();
    } catch (err) {
      ui.planBusy = false; ui.planNote = err.message; draw();
    }
  }

  function draw() {
    const group = VK.current();
    const pending = {};
    for (const o of ui.today?.others ?? []) pending[o.group.id] = o.total;
    const needs = ui.accounts.filter((a) => VK.loginState(a).key !== "ok").length + (ui.today?.problems?.length ?? 0);
    const sub = !group ? "还没有账号组" : needs ? `有 ${needs} 件事要处理` : "一切正常";

    const groupsBlock = VK.groups().length
      ? `<div class="tblwrap"><table><thead><tr><th>账号组</th><th>账号</th><th>等你处理</th><th class="n"></th></tr></thead><tbody>${groupRows(pending)}</tbody></table></div>`
      : '<div class="panel empty">还没有账号组。账号组是一套平台账号，有自己的作品、待办、数据和发布方案；先建一个，再接入账号。</div>';
    const newGroup = ui.newGroup || !VK.groups().length
      ? `<div class="sysrow"><input type="text" id="ng-name" placeholder="账号组名字" aria-label="账号组名字" maxlength="60" value="${esc(ui.newGroupName)}"><button class="btn pri" data-ngsave${ui.groupBusy ? " disabled" : ""}>创建</button><button class="link" data-ngcancel>取消</button><span class="say bad" role="status">${esc(ui.groupNote)}</span></div>` : "";

    let accountsBlock = "";
    if (!group) {
      accountsBlock = '<div class="panel empty">先建一个账号组，账号才有地方放。</div>';
    } else {
      accountsBlock = ui.accounts.length
        ? `<div class="tblwrap"><table><thead><tr><th>平台</th><th>账号</th><th>登录</th><th>今天还能发</th><th>说明</th><th class="n"></th></tr></thead><tbody>${ui.accounts.map(accountRow).join("")}</tbody></table></div>`
        : '<div class="panel empty">这个账号组还没有账号。在下面选一个平台、填账号名，接入第一个。</div>';
    }

    main.innerHTML = `
  <div class="hd"><h1>系统</h1><span class="sub" id="sub">${sub}</span></div>
  <h2 class="sec" id="groups" style="margin-top:0">账号组 · 一个组是一套平台账号，有自己的作品、待办、数据和发布方案</h2>
  ${groupsBlock}
  ${newGroup}
  <div class="cmd">对应命令：<code>vk group list</code>　<code>vk group add &lt;名字&gt;</code>　<code>vk group use &lt;名字&gt;</code>　<code>vk group rename &lt;组&gt; &lt;新名字&gt;</code>　飞书卡片标题会带上账号组的名字。${ui.newGroup || !VK.groups().length ? "" : '<button class="link" data-newg>新建账号组</button>'}</div>
  <h2 class="sec" id="accounts">账号${group ? ` · ${esc(group.name)}` : ""}</h2>
  ${accountsBlock}
  ${group ? addRow(group) : ""}
  <div class="cmd">对应命令：<code>vk account list</code>　<code>vk account add &lt;平台&gt; --group &lt;组&gt; --name &lt;名字&gt;</code>　<code>vk account login &lt;账号 id&gt; --open</code>　<code>vk account credentials tiktok</code>　登录在这台电脑上完成，凭证只存在本机。</div>
  ${planBlock(group)}
  ${group ? `<div class="two">${machineBlock()}${rulesBlock()}</div>` : ""}
  ${problemsBlock(group)}`;
  }

  // ── 登录（就地完成，不跳旧页面）──────────────────────────────────────────
  const post = (path, body) => VK.request(path, { method: "POST", body });
  const acc = (id) => ui.accounts.find((a) => a.id === id);

  function stopPoll(id) {
    const t = polls.get(id);
    if (t) clearInterval(t);
    polls.delete(id);
  }
  const fail = (id, text) => { stopPoll(id); ui.login[id] = { kind: "fail", text }; draw(); };
  const waitLabelOf = (platform) => (SCAN.has(platform) ? "等你扫码" : "等你登录");

  async function succeed(id) {
    stopPoll(id);
    delete ui.login[id];
    toast("登录正常");
    await refresh();
  }

  /** account.check：适配器真实检查（B站 = biliup renew）。只有 ok 才算登上。 */
  async function confirm(id, { manual = false } = {}) {
    const a = acc(id);
    const label = a?.platform === "bilibili" ? "biliup" : "平台";
    try {
      const r = await post(`/api/accounts/${encodeURIComponent(id)}/check`, { accountId: id });
      if (r.state === "ok") return succeed(id), true;
      if (r.skipped) { if (manual) fail(id, "这个平台还没有自动检查，没法确认登录；可以在「今天」里发一条试试。"); return false; }
      const reason = { expiring: "已登录，但凭证快过期了，请重新登录一次", expired: manual ? "还没检测到登录：先在打开的窗口里完成登录" : `登录信息已保存，但${label}校验没通过`, banned: "账号在平台上被限制，需要先在平台侧处理" }[r.state] ?? `当前状态：${r.state}`;
      if (manual && r.state === "expired") { ui.login[id] = { ...ui.login[id], text: esc(reason) }; draw(); return false; }
      fail(id, `${reason}${r.detail ? `（${r.detail}）` : ""}。点「重新登录」再来一次。`);
    } catch (err) {
      fail(id, `检查失败：${err.message}。点「重新登录」再来一次。`);
    }
    return false;
  }

  let confirming = new Set();
  async function pollOnce(id) {
    try {
      const r = await post(`/api/accounts/${encodeURIComponent(id)}/login/status`, { accountId: id });
      if (r.state === "ok") {
        if (confirming.has(id)) return;
        confirming.add(id);
        try {
          // 拿到 cookie 不等于能用：统一再过一遍 account.check，通过才显示正常。
          if (acc(id)?.platform === "bilibili") await confirm(id); else await succeed(id);
        } finally { confirming.delete(id); }
        return;
      }
      if (r.state === "idle" || r.state === "failed") fail(id, r.note ?? "没有检测到登录完成：点「重新登录」再试。");
    } catch {
      /* 轮询里的瞬时错误不打断；超时由 startPoll 兜底 */
    }
  }

  function startPoll(id) {
    stopPoll(id);
    let ticks = 0; // 2 秒一次，最多认 5 分钟
    polls.set(id, setInterval(() => {
      if (++ticks > 150) return fail(id, "5 分钟内没有检测到登录完成：点「重新登录」再试。");
      pollOnce(id);
    }, 2000));
  }

  async function connectTikTok(id) {
    ui.login[id] = { kind: "wait", waitLabel: "等你登录", text: "正在准备授权链接…" };
    draw();
    try {
      let r = await post(`/api/accounts/${encodeURIComponent(id)}/connect`, { accountId: id });
      if (r.state === "waiting") {
        ui.login[id] = { kind: "wait", waitLabel: "等你登录", text: `在新打开的 TikTok 页面登录并同意授权；没弹出就 <a href="${esc(r.url)}" target="_blank" rel="noopener">点这里打开授权页</a>。` };
        draw();
        window.open(r.url, "_blank", "noopener");
        for (let i = 0; i < 30 && r.state === "waiting"; i++) {
          if (ui.login[id]?.kind !== "wait") return; // 被取消
          r = await post(`/api/accounts/${encodeURIComponent(id)}/connect`, { accountId: id, timeoutMs: 20000 });
        }
      }
      if (r.state !== "connected") throw new Error("等了很久还没有授权完成");
      await succeed(id);
    } catch (err) {
      fail(id, `没连上：${err.message}。点「重新连接」再来一次。`);
    }
  }

  async function startLogin(id) {
    const a = acc(id);
    if (!a) return;
    if (a.platform === "tiktok-api") return connectTikTok(id);
    if (!platformInfo(a.platform)) return fail(id, `没有安装 ${labelOf(a.platform)} 适配器（packages/adapter-${a.platform}），账号已登记但没法登录。`);
    ui.login[id] = { kind: "wait", waitLabel: waitLabelOf(a.platform), text: "正在打开登录窗口…" };
    draw();
    try {
      await post(`/api/accounts/${encodeURIComponent(id)}/login/open`, { accountId: id });
      ui.login[id] = { kind: "wait", waitLabel: waitLabelOf(a.platform), text: SCAN.has(a.platform) ? `在弹出的窗口里扫码并确认，这里会自动认出来。${a.platform === "xiaohongshu" ? QR_HINT : ""}` : "在弹出的窗口里完成登录，这里会自动认出来。" };
      draw();
      startPoll(id);
    } catch (err) {
      fail(id, `打不开登录窗口：${err.message}`);
    }
  }

  // ── 接入账号 / 账号组 / 应用凭证 ───────────────────────────────────────────
  async function addAccount() {
    const group = VK.current();
    const name = ui.addName.trim();
    const say = (t, bad = true) => { ui.addNote = t; ui.addBad = bad; draw(); };
    if (!ui.addPlatform) return say("先选一个平台");
    if (!name) return say("请填账号名：同一平台可以用它区分不同账号");
    if (name.toLocaleLowerCase() === String(group.name).trim().toLocaleLowerCase()) return say("别把账号组名当账号名：请填平台上的账号名");
    if (ui.accounts.some((a) => String(a.handle ?? a.display_name ?? "").replace(/^@/, "").toLocaleLowerCase() === name.replace(/^@/, "").toLocaleLowerCase())) return say(`这个组里已经有叫「${name}」的账号，两个平台同名会分不清，换一个名字。`);
    ui.addBusy = true; ui.addNote = ""; draw();
    try {
      const isTk = ui.addPlatform === "tiktok-api";
      const body = { platform: ui.addPlatform, name: isTk ? name.replace(/^@/, "") : name, group: group.id, ...(isTk ? { handle: name.startsWith("@") ? name : `@${name}` } : {}) };
      const r = await post("/api/accounts", body);
      ui.addName = ""; ui.addBusy = false; ui.addNote = ""; ui.addBad = false;
      await refresh();
      if (r.existed) return toast("这个账号已经在组里了");
      await startLogin(r.id);
    } catch (err) {
      ui.addBusy = false;
      say(`${err.message}（换号要先 vk account remove 旧账号）`);
    }
  }

  async function groupAction(fn, okMsg) {
    ui.groupBusy = true; ui.groupNote = ""; draw();
    try {
      await fn();
      ui.groupBusy = false;
      if (okMsg) toast(okMsg);
      return true;
    } catch (err) {
      ui.groupBusy = false; ui.groupNote = err.message; draw();
      return false;
    }
  }

  async function saveCreds() {
    const c = ui.cred;
    c.bad = false; c.note = "";
    if (!c.key.trim() || !c.secret.trim()) { c.bad = true; c.note = "client key 和 client secret 都要填"; return draw(); }
    c.busy = true; draw();
    try {
      await post("/api/platforms/tiktok-api/credentials", { platform: "tiktok-api", clientKey: c.key.trim(), clientSecret: c.secret.trim() });
      c.key = ""; c.secret = ""; c.busy = false; c.note = "";
      toast("应用凭证已保存，可以 Connect 了");
      await refresh();
    } catch (err) {
      c.busy = false; c.bad = true; c.note = `没保存：${err.message}`; draw();
    }
  }

  // ── 事件 ────────────────────────────────────────────────────────────────
  main.addEventListener("input", (e) => {
    const t = e.target;
    if (t.id === "add-name") ui.addName = t.value;
    else if (t.id === "ng-name") ui.newGroupName = t.value;
    else if (t.id === "cred-key") ui.cred.key = t.value;
    else if (t.id === "cred-secret") ui.cred.secret = t.value;
    else if (t.id === "pe-days" && ui.planEdit) ui.planEdit.delayDays = t.value;
  });
  main.addEventListener("change", (e) => {
    const t = e.target;
    if (t.id === "add-platform") ui.addPlatform = t.value;
    else if (t.id === "pe-kind" && ui.planEdit) ui.planEdit.kind = t.value;
    else if (t.id === "pe-lang" && ui.planEdit) ui.planEdit.language = t.value;
    else if (t.dataset?.pePf && ui.planEdit) {
      const set = new Set(ui.planEdit.platforms);
      if (t.checked) set.add(t.dataset.pePf); else set.delete(t.dataset.pePf);
      ui.planEdit.platforms = [...set];
    }
  });
  main.addEventListener("keydown", (e) => {
    if (e.key !== "Enter") return;
    if (e.target.id === "add-name") { e.preventDefault(); addAccount(); }
    else if (e.target.id === "ng-name") { e.preventDefault(); main.querySelector("[data-ngsave]")?.click(); }
    else if (e.target.id === "rename-input") { e.preventDefault(); main.querySelector("[data-renamesave]")?.click(); }
    else if (e.target.id === "cred-secret") { e.preventDefault(); saveCreds(); }
  });
  main.addEventListener("click", async (e) => {
    const b = e.target.closest("[data-sw],[data-login],[data-done],[data-cancel],[data-add],[data-credsave],[data-newg],[data-ngsave],[data-ngcancel],[data-rename],[data-renamesave],[data-renamecancel],[data-plan],[data-planadd],[data-plansave],[data-plancancel],[data-planremove],[data-planreset],[data-retry],[data-autoupd],[data-logout],[data-logoutyes],[data-logoutno]");
    if (!b) return;
    const d = b.dataset;
    if ("sw" in d) {
      e.preventDefault();
      try { await VK.useGroup(d.sw); location.reload(); } catch (err) { toast(`没切过去：${err.message}`); }
    } else if (d.logout) { ui.logoutAsk = d.logout; draw(); }
    else if ("logoutno" in d) { ui.logoutAsk = null; draw(); }
    else if (d.logoutyes) {
      const id = d.logoutyes;
      ui.logoutAsk = null; stopPoll(id); delete ui.login[id];
      try { await post(`/api/accounts/${encodeURIComponent(id)}/logout`, { accountId: id }); toast("已退出登录，现在可以重新登录另一个号"); }
      catch (err) { toast(`没退出成功：${err.message}`); }
      await refresh();
    } else if (d.login) startLogin(d.login);
    else if (d.done) { const id = d.done; ui.login[id] = { ...ui.login[id], text: "正在检查登录状态…" }; draw(); confirm(id, { manual: true }); }
    else if (d.cancel) { stopPoll(d.cancel); delete ui.login[d.cancel]; draw(); }
    else if ("add" in d) addAccount();
    else if ("credsave" in d) saveCreds();
    else if ("newg" in d) { ui.newGroup = true; draw(); document.getElementById("ng-name")?.focus(); }
    else if ("ngcancel" in d) { ui.newGroup = false; ui.groupNote = ""; ui.newGroupName = ""; draw(); }
    else if ("ngsave" in d) {
      const name = ui.newGroupName.trim();
      if (!name) { ui.groupNote = "请填账号组名称"; return draw(); }
      if (await groupAction(() => VK.addGroup(name), `已新建「${name}」并切到它`)) { location.reload(); }
    } else if (d.plan != null) {
      const r = ui.plan.rows[Number(d.plan)];
      ui.planNote = "";
      ui.planEdit = { i: Number(d.plan), kind: r.kind, language: r.language, platforms: r.platforms.map((p) => p.platform).filter((p) => ui.plan.installedPlatforms.some((x) => x.platform === p)), delayDays: r.delayDays };
      draw();
    } else if ("planadd" in d) {
      ui.planNote = "";
      ui.planEdit = { isNew: true, kind: "video", language: "*", platforms: ui.plan.groupPlatforms.map((p) => p.platform), delayDays: 0 };
      draw();
    } else if ("plancancel" in d) { ui.planEdit = null; ui.planNote = ""; draw(); }
    else if ("plansave" in d) savePlanRow();
    else if ("planremove" in d) {
      const ed = ui.planEdit;
      try { await post("/api/plan", { group: VK.current().id, kind: ed.kind, language: ed.language, remove: true }); ui.planEdit = null; toast("已删掉这一行"); await refresh(); }
      catch (err) { ui.planNote = err.message; draw(); }
    } else if ("planreset" in d) {
      try { await post("/api/plan/reset", { group: VK.current().id }); ui.planEdit = null; toast("已恢复默认方案"); await refresh(); }
      catch (err) { toast(`没恢复：${err.message}`); }
    } else if (d.autoupd) {
      ui.updBusy = true; draw();
      try { await post("/api/update", { auto: d.autoupd }); toast(d.autoupd === "on" ? "已打开后台自动更新" : "已关闭后台自动更新"); }
      catch (err) { toast(`没切过去：${err.message}`); }
      ui.updBusy = false;
      await refresh();
    } else if (d.retry) {
      ui.retrying.add(d.retry); draw();
      try { await post(`/api/publishes/${encodeURIComponent(d.retry)}/retry`, { publishId: d.retry }); toast("正在重试"); }
      catch (err) { toast(`没重试成功：${err.message}`); }
      ui.retrying.delete(d.retry);
      await refresh();
    } else if (d.rename) { ui.renaming = d.rename; ui.groupNote = ""; draw(); document.getElementById("rename-input")?.select(); }
    else if ("renamecancel" in d) { ui.renaming = null; draw(); }
    else if (d.renamesave) {
      const name = document.getElementById("rename-input")?.value.trim();
      if (!name) return toast("组名不能为空");
      if (await groupAction(() => VK.renameGroup(d.renamesave, name), "已改名")) { ui.renaming = null; await refresh(); }
    }
  });

  // ── 启动 ────────────────────────────────────────────────────────────────
  VK.ready()
    .then(load)
    .then(() => {
      draw();
      const params = new URLSearchParams(location.search);
      if (params.get("platform") && ui.platforms.some((p) => p.platform === params.get("platform"))) { ui.addPlatform = params.get("platform"); draw(); }
      const hash = location.hash.slice(1);
      if (hash === "add") { const row = document.getElementById("addrow"); row?.scrollIntoView({ block: "center" }); document.getElementById("add-name")?.focus(); }
      else if (hash === "groups") document.getElementById("groups")?.scrollIntoView();
      else if (hash === "problems" || hash === "plan") document.getElementById(hash)?.scrollIntoView();
    })
    .catch((err) => { main.innerHTML = `<div class="hd"><h1>系统</h1></div><div class="note bad">读不到数据：${esc(err.message)}（守护进程在跑吗？终端执行 vk serve）</div>`; });
})();
</script>
</body>
</html>
