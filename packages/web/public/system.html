<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>系统 · versekit</title>
<link rel="stylesheet" href="/app.css">
<style>
/* 系统页：账号 / 发布方案 / 设备 三个分段。结构照 docs/design/system.html（v3）。 */
.app .tabs{margin:0 0 6px}
.app .sysrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}
.app .sysrow select,.app .addrow select{height:34px;border:1px solid var(--ctl);border-radius:7px;padding:0 9px;font:inherit;font-size:14px;background:var(--paper);color:var(--ink);min-width:0}
.app .sysrow input[type=text],.app .sysrow input[type=password]{width:220px}
.app .sysrow .say{flex:1 1 100%;font-size:13px;color:var(--ink2);line-height:1.6}
.app input[type=password],.app input[type=tel]{height:34px;border:1px solid var(--ctl);border-radius:7px;padding:0 9px;font-size:14px;background:var(--paper);min-width:0;color:var(--ink);font-family:inherit}
.app .say.bad,.app .why.bad{color:var(--bad);font-weight:600}
.app td .why{display:block;font-size:12px;color:var(--ink2);margin-top:2px;max-width:46ch;white-space:normal;line-height:1.5}
.app .av{width:20px;height:20px;border-radius:50%;object-fit:cover;vertical-align:-5px;margin-right:6px;background:var(--side)}
.app .acct{white-space:nowrap}
.app .grpname,.app .rn{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.app .grpname input[type=text],.app .rn input{width:180px}
.app .acts{display:inline-flex;gap:14px;align-items:center;justify-content:flex-end;white-space:nowrap}
.app td b.nm{font-weight:600;display:block}
/* 行内展开：这一行需要多说一句或多做一步时，在它下面展开，不弹窗 */
.app tr.has-sub td{border-bottom:0}
.app tr.subrow td{padding-top:0}
.app .subin{display:flex;gap:10px 16px;align-items:center;flex-wrap:wrap;padding:12px;border:1px solid var(--line);border-radius:var(--r);background:var(--hover);font-size:13px;white-space:normal}
.app .subin p{margin:0;flex:1 1 320px;max-width:60em}
.app .subin .acts{margin-left:auto}
.app .subin.bad{background:var(--bad-bg);border-color:var(--bad-line)}
.app .subin.bad p{color:var(--bad)}
.app .subin.wait{background:var(--mark-bg);border-color:var(--mark-line)}
.app .subin input{flex:1 1 180px;max-width:260px}
.app .subin .how{flex:1 1 280px;display:grid;gap:4px;min-width:0}
.app .subin .how b{font-size:14px;font-weight:600}
.app .subin .how .alt{display:flex;gap:4px 16px;flex-wrap:wrap}
.app .sw{display:inline-flex;gap:6px;align-items:center;min-height:32px;cursor:pointer;color:var(--ink2)}
.app .sw input{width:auto}
.app .subin ul{margin:0;padding-left:18px}
.app .qr{width:132px;height:132px;flex:none;border:1px dashed var(--ctl);border-radius:var(--r);background:var(--paper);display:flex;align-items:center;justify-content:center;text-align:center;font-size:12px;color:var(--ink2);padding:0;overflow:hidden}
.app .qr img{width:100%;height:100%;object-fit:contain;display:block}
.app .qr.old{border-color:var(--bad-line);color:var(--bad)}
.app .addrow input[type=text]{width:100%;max-width:220px}
.app .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px}
.app .kv{padding:14px 16px;display:grid;grid-template-columns:110px minmax(0,1fr);gap:6px 12px;font-size:14px;margin:0}
.app .kv dt{color:var(--ink2);font-size:13px}
.app .kv dd{margin:0}
.app .cloud-panel{display:grid;gap:10px;padding:14px 16px}
.app .cloud-panel p{margin:0}
.app .cloud-panel .kv{padding:0;grid-template-columns:max-content minmax(0,1fr)}
.app .cloud-panel dd{overflow-wrap:anywhere}
.app .cloud-panel .acts{justify-content:flex-start}
.app .plan td:first-child{white-space:nowrap;font-weight:600}
.app .pfs{display:flex;gap:10px 14px;flex-wrap:wrap}
.app tr.planedit td{background:var(--mark-bg);border-bottom:1px solid var(--mark-line)}
.app .pickpf{display:flex;gap:6px 16px;flex-wrap:wrap;margin:2px 0 10px}
.app .pickpf label{display:inline-flex;gap:6px;align-items:center;min-height:32px;font-size:14px}
.app input[type=number]{height:34px;width:72px;border:1px solid var(--ctl);border-radius:7px;padding:0 9px;font-size:14px;background:var(--paper);color:var(--ink);font-family:inherit}
.app .dev td:nth-child(1),.app .dev td:nth-child(2){white-space:nowrap}
.app .dev td:nth-child(4){min-width:200px}
@media (max-width:860px){.app .subin .acts{margin-left:0}}
</style>
</head>
<body data-page="system">
<div class="app">
  <nav class="nav" aria-label="主导航"><div class="brand"><i></i>versekit</div>
    <a class="nv" href="today.html" data-key="today">今天<b data-todo hidden></b></a>
    <a class="nv" href="works.html" data-key="works">作品</a>
    <a class="nv" href="data.html" data-key="data">数据</a>
    <a class="nv" href="system.html" data-key="system" aria-current="page">系统</a></nav>
  <main id="main"><div class="loading">正在读账号组和账号…</div></main>
</div>
<script src="/api.js"></script>
<script src="/panel.js"></script>
<script src="/shell.js"></script>
<script>
(function () {
  const main = document.getElementById("main");
  const VK = window.VK;
  const panel = window.VKPanel({ editing: new Set(), ver: new Map() });
  const { esc, pfBadge, pfName, cover } = panel;
  const whenText = (ms) => panel.when(ms).text;
  const toast = (m) => window.VKShell?.toast(m);

  // 平台在「接入账号」里的叫法：tiktok-api 是官方接口，和网页登录的 tiktok 分开说。
  const LABEL = { xiaohongshu: "小红书", shipinhao: "视频号", douyin: "抖音", bilibili: "B站", youtube: "YouTube", tiktok: "TikTok（网页登录）", "tiktok-api": "TikTok（官方接口）" };
  const labelOf = (p) => LABEL[p] ?? p;
  // 走官方接口的账号：先填应用凭证，再在新标签页授权；不靠发布机的浏览器资料（TikTok 官方接口、YouTube）。
  const OFFICIAL = { "tiktok-api": { name: "TikTok", idName: "client key", where: "TikTok 开发者后台里这个应用的凭证" }, youtube: { name: "YouTube", idName: "client id", where: "你自己在 Google Cloud 控制台里建的 OAuth 客户端的凭证" } };
  const WEB_LOGIN = (p) => !OFFICIAL[p]; // 有「退出登录」的平台：浏览器资料（含 B站的凭据文件）都能清；官方接口平台用「换号」清授权令牌
  // 发布机能在后台替你取二维码、发短信验证码的平台；其余平台只有「在发布机上打开登录窗口」。
  const HEADLESS = new Set(["xiaohongshu"]);   // 能取二维码也能发短信
  const QR_ONLY = new Set(["shipinhao"]);      // 只能取二维码（视频号：用开通视频号的微信扫）
  const QR_OK = (p) => HEADLESS.has(p) || QR_ONLY.has(p);
  // 登录要撑多久要记下来、不挂保活的平台：状态行说「要重新扫码」，登录时长接在「检查过」后面。
  const TRACKED = new Set(["shipinhao"]);
  const QR_HINT = "扫码登录的是手机 App 当前的号；要接另一个号，先在 App 里切换账号，或者改用短信验证码。";
  const qrHint = (p) => (QR_ONLY.has(p) ? "用开通视频号的微信扫，并在手机上点确认；扫码登录的是微信当前的号。" : QR_HINT);
  const NOTE = { xiaohongshu: "逐条单独确认", "tiktok-api": "走官方接口", youtube: "走官方接口" };
  const TIKTOK_FAMILY = ["tiktok", "tiktok-api"];
  const TABS = [["accounts", "账号"], ["plan", "发布方案"], ["devices", "设备"], ["notify", "通知"]];
  const OFFLINE_SAY = "发布机不在线，登录要它在线";
  const HASH0 = new URLSearchParams(location.hash.slice(1));
  const POLL_MS = Math.max(100, Number(HASH0.get("pollms")) || 2000); // 轮询间隔；验收脚本可以用 #pollms= 调快

  const HASH = Object.fromEntries(new URLSearchParams(location.hash.slice(1)));
  const LEGACY_TAB = { plan: "plan", groups: "accounts", add: "accounts", problems: "accounts" };
  const ui = {
    tab: TABS.some(([k]) => k === HASH.tab) ? HASH.tab : (LEGACY_TAB[location.hash.slice(1)] ?? "accounts"),
    accounts: [], platforms: [], platformsErr: null, covers: new Map(), today: null, groupsErr: null,
    // accountId → { step: qr | scanned | qrold | sms1 | sms2 | win | auth | fail, qr, text, masked }
    login: {},
    logoutAsk: null,      // 正在二次确认「退出登录」的账号 id
    switchAsk: null,      // 正在二次确认「换号」的账号 id
    switched: {},         // 换号后正在登录的账号：{ [id]: true }；登录成功后行内显示「已换成 <新号>」
    switchedTo: {},       // 换号登录成功后的提示：{ [id]: "已换成 …" }
    credOpen: null,       // 展开「填应用凭证」的账号 id
    credsMissingIds: new Set(), // 后端明确说「没有应用凭证」的账号 id（平台清单可能晚一拍，别让状态盖回去）
    renaming: null, newGroup: false, newGroupName: "", groupBusy: false, groupNote: "",
    addPlatform: "", addName: "", addBusy: false, addNote: "",
    renamingAcc: null, renameAccName: "", renameAccBusy: false, renameAccNote: "",
    cred: { key: "", secret: "", busy: false, note: "", bad: false },
    checktime: null,      // { time, value, busy, note }：视频号每天检查登录的钟点
    cloud: null, cloudError: null, cloudAction: null, cloudNote: "", cloudRecent: null,
    egress: null, ipStep: null, ipBusy: false, // 出口位置：/api/egress；ipStep = null | stay（继续用新位置，行内再确认）
    plan: null, machine: null, update: null, relay: null, problems: [], planEdit: null, planNote: "", planBusy: false, retrying: new Set(), sectionErr: null,
    notesOpen: false, upd: null, updNote: "", updBusy: false,
    relayForm: null,      // { url, token, busy, note }：接入中转
    relayAsk: false,      // 正在二次确认「断开中转」
    fs: null, fsErr: null, fsDrop: false, fsBusy: false, fsNote: "", fsTried: false, fsPaused: false, // 飞书通知：/api/channels/feishu/status
  };
  const polls = new Map();

  const stamp = (ms) => {
    if (!ms) return "还没检查过";
    const d = new Date(ms), now = new Date();
    const hm = `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
    const days = Math.round((new Date(now.getFullYear(), now.getMonth(), now.getDate()) - new Date(d.getFullYear(), d.getMonth(), d.getDate())) / 864e5);
    return `${days <= 0 ? "今天" : days === 1 ? "昨天" : `${days} 天前`} ${hm} 检查过`;
  };

  const platformInfo = (p) => ui.platforms.find((x) => x.platform === p) ?? null;
  const credsMissing = (a) => Boolean(OFFICIAL[a.platform]) && (ui.credsMissingIds.has(a.id) || platformInfo(a.platform)?.credentials?.configured === false);
  // 官方接口账号的应用凭证状态没读到（平台清单整份读失败、清单里没有这个平台、或没带凭证状态）：
  // 这时不能猜「已配置」去显示 Connect——点了只会走到「没有应用凭证」的死路。
  const credsUnknown = (a) => Boolean(OFFICIAL[a.platform]) && !credsMissing(a) && !platformInfo(a.platform)?.credentials;
  const connected = (a) => Boolean(a.credential_ref && a.state === "ok");
  const machineName = () => ui.machine?.name || "发布机";
  const publisherOffline = () => Boolean(ui.machine) && !ui.machine.online;

  // ── 读数据 ─────────────────────────────────────────────────────────────
  async function load() {
    const group = VK.current();
    const [accounts, platforms, today] = await Promise.all([
      group ? VK.groupAccounts(group.id) : [],
      // 读失败不能当成空列表：空列表会让官方接口账号被当成「已配置」而显示 Connect，点了就是死路（静默失败是 P0）。
      VK.request("/api/platforms").then((d) => ({ list: d.platforms ?? [], error: null })).catch((err) => ({ list: [], error: err })),
      group ? VK.today().catch(() => null) : null,
    ]);
    ui.accounts = accounts;
    ui.platforms = platforms.list;
    ui.platformsErr = platforms.error ? (platforms.error.message || "未知错误") : null;
    ui.today = today;
    // 「最近出的问题」里的作品封面：按作品对上 coverVersionId，读不到就是占位。
    ui.covers = await VK.works().then((d) => new Map((d.works ?? []).map((w) => [w.id, w.coverVersionId]))).catch(() => new Map());
    await loadSections(group);
    const taken = (p) => accounts.some((a) => a.platform === p || (TIKTOK_FAMILY.includes(p) && TIKTOK_FAMILY.includes(a.platform)));
    if (!ui.addPlatform || !ui.platforms.some((p) => p.platform === ui.addPlatform) || taken(ui.addPlatform)) ui.addPlatform = (ui.platforms.find((p) => !taken(p.platform)) ?? ui.platforms[0])?.platform ?? "";
  }

  /** 发布方案、发布机、更新、中转、最近出的问题：都来自 /api。一块读不到不拖垮别的块。 */
  async function loadSections(group) {
    ui.sectionErr = null;
    if (!group) { await loadFeishu(); ui.egress = null; ui.plan = null; ui.machine = null; ui.update = null; ui.relay = null; ui.problems = []; ui.checktime = null; return; }
    const q = `group=${encodeURIComponent(group.id)}`;
    const [plan, machine, runs, update, relay, ct, egress] = await Promise.all([
      VK.request(`/api/plan?${q}`).catch((e) => { ui.sectionErr = e.message; return null; }),
      VK.request(`/api/machine?${q}`).catch(() => null),
      VK.request(`/api/runs?state=failed&limit=100&${q}`).catch(() => null),
      VK.request("/api/update").catch(() => null),
      VK.request("/api/relay").catch(() => null),
      VK.request("/api/login-check/time").catch(() => null),
      VK.request(`/api/egress?${q}`).catch(() => null),
    ]);
    ui.egress = egress;
    await loadFeishu();
    if (ct) ui.checktime = { ...(ui.checktime ?? {}), time: ct.time, value: ui.checktime?.dirty ? ui.checktime.value : ct.time, busy: false, note: ui.checktime?.note ?? "" };
    ui.plan = plan;
    ui.machine = machine;
    ui.update = update;
    ui.relay = relay;
    // 「最近出的问题」= 现在还停在出问题状态的平台稿（与今天页同源）；有失败的发布任务就带上它的原因，没有也要列出来。
    // 页头「有 N 件事要处理」的 N 和这里列的条数用同一份数据算（ACC-v3-fid-12）。
    const lastRun = new Map();
    for (const r of runs?.rows ?? []) {
      if (r.target_type === "publish" && (!lastRun.has(r.target_id) || r.created_at > lastRun.get(r.target_id).created_at)) lastRun.set(r.target_id, r);
    }
    ui.problems = (ui.today?.problems ?? []).map((p) => ({ run: lastRun.get(p.publishId) ?? null, p }));
  }

  async function loadFeishu() {
    try { ui.fs = await VK.request("/api/channels/feishu/status"); ui.fsErr = null; }
    catch (err) { ui.fs = null; ui.fsErr = err.message || "读不到"; }
  }

  async function refresh() {
    await VK.bootstrap({ force: true });
    await load();
    draw();
    window.VKShell?.refreshHealth();
  }

  // ── 画页面：账号 ─────────────────────────────────────────────────────────
  const pfn = (platform, name) => `<span class="pfn">${pfBadge(platform)}${esc(name ?? labelOf(platform))}</span>`;
  const B = (attrs, text, cls = "btn", extra = "") => `<button class="${cls}" ${attrs}${extra}>${text}</button>`;
  const subRow = (cols, html, cls = "") => `<tr class="subrow"><td colspan="${cols}"><div class="subin${cls ? ` ${cls}` : ""}">${html}</div></td></tr>`;

  function cloudContent() {
    const s = ui.cloud;
    const busy = ui.cloudAction ? ' aria-disabled="true"' : "";
    const platformAction = ui.credOpen || Object.values(ui.login).some(({ step }) => ["sms1", "sms2", "win"].includes(step));
    const action = (key, label, cls) => B(`data-cloud-action="${key}"`, label, platformAction && cls === "btn pri" ? "btn" : cls, busy);
    const unreadable = ui.cloudError?.code === "cloud_credential_unreadable";
    const note = ui.cloudNote || (unreadable ? ui.cloudError.message : ui.cloudError && "读不到 Hifabu 账号状态，稍后会再试。") || s?.message;
    const alert = note ? `<p class="note bad" role="alert">${esc(note)}</p>` : "";
    const actions = (html) => `<div class="acts">${html}</div>`;
    if (!s) {
      if (unreadable) return alert + actions(action("logout", ui.cloudAction ? "正在退出…" : "退出这台", "link"));
      return alert || `<p class="sub">正在核对 Hifabu 账号…</p>`;
    }
    if (s.state === "waiting") {
      return `<div class="subin wait"><p>已经在浏览器里打开了<a class="link" href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">登录页</a>。核对码 <strong class="mono">${esc(s.code)}</strong>，和网页上的一样就点「允许」。</p></div>` +
        alert + actions(action("logout", ui.cloudAction ? "正在取消…" : "取消", "link"));
    }
    if (!s.loggedIn) {
      return `<p>没登录。</p><p class="sub">在这台电脑上做片、发布都不需要登录。登录后，这台电脑可以接收你另一台电脑送来的成片。</p>` +
        alert + actions(action("login", ui.cloudAction ? "正在打开登录页…" : "登录 Hifabu", "btn pri"));
    }
    const email = `<dt>Hifabu 账号</dt><dd>${esc(s.email)}</dd>`;
    const exit = actions(action("logout", ui.cloudAction ? "正在退出…" : "退出这台", "link"));
    const exitNote = `<p class="sub">退出这台会停止接收新成片，平台登录和已经收到的作品会保留。</p>`;
    if (s.reachable === false) {
      const checked = s.lastCheckedAt
        ? `上次核对成功于 ${esc(new Date(s.lastCheckedAt).toLocaleString("zh-CN", { dateStyle: "medium", timeStyle: "short" }))}。`
        : "还没有核对成功的记录。";
      return `<dl class="kv">${email}<dt>传片</dt><dd><span class="st bad">连不上</span></dd></dl>` +
        `<div class="subin bad"><p>连不上 hifabu.com，${checked}已经排好的发布照常进行。新送来的成片会在网络恢复后继续接收，无需重新登录。</p></div>` +
        alert + exit + exitNote;
    }
    const role = s.role === "maker" ? "制作机" : "发布机";
    const name = ui.machine?.name;
    const machine = name && name !== "发布机" ? `${esc(name)} <span class="st">${role}</span>` : role;
    const recent = ui.cloudRecent;
    const receive = recent ? ` <span class="sub">上次收到：${esc(recent.title)}，${esc(whenText(recent.at))}</span>` : "";
    const transfer = s.relayEnabled
      ? `<span class="st done">已开通</span>${receive}`
      : `<span class="st">没开通</span> <span class="sub">要从另一台电脑送成片过来，到 hifabu.com 申请开通。</span>`;
    return `<dl class="kv">${email}<dt>这台机器</dt><dd>${machine}</dd><dt>传片</dt><dd>${transfer}</dd></dl>` +
      alert + exit + (s.relayEnabled ? exitNote : "");
  }

  function cloudBlock() {
    return `<section aria-labelledby="cloud-heading"><h2 class="sec" id="cloud-heading" tabindex="-1">Hifabu 账号</h2>` +
      `<div id="cloud-panel" class="panel cloud-panel" aria-live="polite">${cloudContent()}</div></section>`;
  }

  function drawCloud() {
    const box = document.getElementById("cloud-panel");
    if (!box) return;
    const moveFocus = box.contains(document.activeElement);
    box.innerHTML = cloudContent();
    if (moveFocus) (box.querySelector("button") ?? document.getElementById("cloud-heading")).focus();
  }

  let cloudTimer;
  let cloudRevision = 0;

  function scheduleCloudTick() {
    clearTimeout(cloudTimer);
    cloudTimer = setTimeout(cloudTick, ui.cloud?.state === "waiting" ? Math.max(500, POLL_MS) : 30_000);
  }

  async function cloudTick() {
    const revision = cloudRevision;
    const before = cloudContent();
    try {
      const status = await VK.request("/api/cloud/status");
      const relay = status.relayEnabled && status.reachable && status.role === "executor"
        ? await VK.request("/api/relay").catch(() => null) : null;
      if (revision !== cloudRevision) return;
      ui.cloudError = null;
      if (ui.cloud?.state !== status.state) ui.cloudNote = "";
      ui.cloud = status;
      ui.cloudRecent = relay?.recent?.find((r) => r.state === "ingested" && r.title) ?? null;
    } catch (err) {
      if (revision !== cloudRevision) return;
      ui.cloudError = err;
    }
    if (before !== cloudContent()) drawCloud();
    scheduleCloudTick();
  }

  async function changeCloud(action) {
    if (ui.cloudAction) return;
    clearTimeout(cloudTimer);
    cloudRevision++;
    ui.cloudAction = action;
    ui.cloudNote = "";
    drawCloud();
    try {
      const path = action === "login" ? "/api/cloud/login" : "/api/cloud/logout";
      ui.cloud = await post(path, {});
      ui.cloudRecent = null;
      ui.cloudError = null;
    } catch (err) {
      ui.cloudNote = err.code === "cloud_unavailable" ? "连不上 hifabu.com，请检查网络后重试。" : err.message;
    } finally {
      ui.cloudAction = null;
      drawCloud();
      scheduleCloudTick();
    }
  }

  /** 这一行的登录状态词和颜色：正常 / 要重新登录 / 登录到了别的号 / 等你扫码 / 二维码过期了 / 缺应用凭证。 */
  function statusCell(a, st, lg) {
    // 缺应用凭证比「账号上次没登上」更靠前：凭证没填时 Connect 一定失败，状态词要指向能做的事。
    if (credsMissing(a)) return '<span class="st wait">缺应用凭证</span>';
    // 平台信息读不到时不猜状态：既不说正常，也不给一个点了必然失败的 Connect。
    if (credsUnknown(a)) return '<span class="st wait">读不到平台信息</span>';
    if (lg) {
      const w = {
        qr: ["wait", "等你扫码"], scanned: ["wait", "已扫码，在手机上点确认"], qrold: ["bad", "二维码过期了"],
        sms1: ["wait", "等你登录"], sms2: ["wait", "等你填验证码"], win: ["wait", "等你登录"], auth: ["wait", "等你登录"], fail: ["bad", "没登上"],
      }[lg.step] ?? ["wait", "等你登录"];
      return `<span class="st ${w[0]}">${w[1]}</span>`;
    }
    if (a.identityConflict) return '<span class="st bad">登录到了别的号</span>';
    if (TRACKED.has(a.platform) && st.key === "relogin") return `<span class="st bad">${esc(labelOf(a.platform))}要重新扫码</span> <span class="sub">${stamp(a.lastCheckedAt)}${a.loginClock ? ` · ${esc(a.loginClock.label)}` : ""}</span>`;
    // 登录时长接在「检查过」后面：这次登录已多久、最近几次平均撑多久；记录不够时写「还在记录」。
    return `<span class="st ${st.cls}">${st.label}</span> <span class="sub">${stamp(a.lastCheckedAt)}${a.loginClock ? ` · ${esc(a.loginClock.label)}` : ""}</span>`;
  }

  function accountActions(a, st, lg) {
    if (a.identityConflict) return "";
    // 缺凭证（或正开着填写表单）优先于任何登录进行态/失败态：这一行能做的只有填凭证。
    if (credsMissing(a) || ui.credOpen === a.id) return B(`data-credopen="${esc(a.id)}"`, "填应用凭证");
    if (credsUnknown(a)) return "";
    if (lg) return "";
    if (!platformInfo(a.platform)) return ""; // 平台清单读不到：不给点了必然失败的登录入口
    const off = publisherOffline();
    const dis = off ? ` disabled title="${OFFLINE_SAY}"` : "";
    let html;
    if (OFFICIAL[a.platform]) html = B(`data-login="${esc(a.id)}"`, connected(a) ? "重新授权" : `Connect ${OFFICIAL[a.platform].name}`, connected(a) ? "link" : "btn", dis);
    else if (st.key === "ok") html = (WEB_LOGIN(a.platform) ? B(`data-logout="${esc(a.id)}"`, "退出登录", "link") : "") + B(`data-login="${esc(a.id)}"`, "重新登录", "link", dis);
    else html = (WEB_LOGIN(a.platform) && st.key !== "down" ? B(`data-logout="${esc(a.id)}"`, "退出登录", "link") : "") + B(`data-login="${esc(a.id)}"`, st.key === "down" ? "登录" : "重新登录", "btn", dis);
    html = B(`data-switch="${esc(a.id)}"`, "换号", "link", dis) + html;
    return `<span class="acts">${html}</span>${off ? `<div class="sub">${OFFLINE_SAY}</div>` : ""}`;
  }

  function loginSub(a, lg) {
    const id = esc(a.id), pf = labelOf(a.platform), m = esc(machineName());
    const cancel = B(`data-cancel="${id}"`, "取消", "link");
    const sms = HEADLESS.has(a.platform) ? B(`data-loginmode="sms" data-id="${id}"`, "改用短信验证码", "link") : "";
    const qr = QR_OK(a.platform) ? B(`data-loginmode="qr" data-id="${id}"`, "改用扫码", "link") : "";
    const win = B(`data-loginmode="win" data-id="${id}"`, "在发布机上打开登录窗口", "link");
    const alt = (...xs) => `<span class="alt">${xs.filter(Boolean).join("")}${cancel}</span>`;
    const box = (inner, cls = "") => `<div class="qr${cls ? ` ${cls}` : ""}">${inner}</div>`;
    switch (lg.step) {
      case "qr":
        return subRow(6, `${box(lg.qr ? `<img src="${esc(lg.qr)}" alt="登录二维码">` : esc(lg.text || "正在取二维码…"))}<div class="how"><b>用${esc(pf)} App 扫这个码</b><span class="sub">二维码是发布机「${m}」取回来的，几分钟内有效。登录数据只存在那台电脑上，这个服务拿不到。${esc(qrHint(a.platform))}${ui.switched[a.id] ? " 换号：先在 App 里切到要接的号再扫。" : ""}${lg.note ? ` ${esc(lg.note)}` : ""}</span>${alt(sms, win)}</div>`);
      case "scanned":
        return subRow(6, `${box("已扫码")}<div class="how"><b>在手机上点「确认登录」</b><span class="sub">点完这里会自己变成正常，不用回来按什么。</span>${alt()}</div>`);
      case "qrold":
        return subRow(6, `${box("二维码<br>过期了", "old")}<div class="how"><b>二维码过期了</b><span class="sub">超过几分钟没有扫。</span><span class="alt">${B(`data-loginmode="qr" data-id="${id}"`, "换一个")}${sms}${cancel}</span></div>`);
      case "sms1":
        return subRow(6, `<div class="how"><b>用短信验证码登录${esc(pf)}</b><span class="sub">手机号只用来登录这一次，不会存下来。</span>${lg.text ? `<span class="say bad" role="status">${esc(lg.text)}</span>` : ""}${alt(qr, win)}</div><input type="tel" id="sms-phone" inputmode="numeric" placeholder="手机号" aria-label="手机号" autocomplete="off" maxlength="11">${B(`data-smssend="${id}"`, "发验证码", "btn pri", lg.busy ? " disabled" : "")}`);
      case "sms2":
        return subRow(6, `<div class="how"><b>填收到的验证码</b><span class="sub">已发到 ${esc(lg.masked)}。</span>${lg.text ? `<span class="${lg.bad ? "say bad" : "sub"}" role="status">${esc(lg.text)}</span>` : ""}${alt(B(`data-smsresend="${id}"`, "重发", "link"))}</div><input type="text" id="sms-code" inputmode="numeric" placeholder="验证码" aria-label="验证码" autocomplete="one-time-code" maxlength="8">${B(`data-smsgo="${id}"`, "登录", "btn pri", lg.busy ? " disabled" : "")}`);
      case "win":
        return subRow(6, `<div class="how"><b>到「${m}」前面，在打开的窗口里登录${esc(pf)}</b><span class="sub">${esc(lg.text || "登录窗口已经在那台电脑上打开。登录完回到这里点一下。")}</span>${alt(qr)}</div>${B(`data-done="${id}"`, "我登录好了", "btn pri")}`);
      case "auth":
        return subRow(6, `<div class="how"><b>在新打开的标签页里同意授权</b><span class="sub">${esc(pf)} 的授权页已经在新标签页打开。同意之后这里会自己变成正常。${lg.url ? ` 没弹出就 <a href="${esc(lg.url)}" target="_blank" rel="noopener">点这里打开授权页</a>。` : ""}</span>${alt()}</div>`);
      case "fail":
        return subRow(6, `<p>${esc(lg.text)}</p><span class="acts">${cancel}</span>`, "bad");
      default:
        return "";
    }
  }

  function accountRow(a) {
    const st = VK.loginState(a);
    const lg = ui.login[a.id];
    const name = a.display_name || a.handle;
    const shown = a.avatar_url && connected(a)
      ? `<img class="av" src="${esc(a.avatar_url)}" alt="" width="20" height="20" referrerpolicy="no-referrer">${esc(name)}`
      : esc(name);
    const who = ui.renamingAcc === a.id
      ? `<div class="grpname"><input type="text" id="acc-rename-input" value="${esc(ui.renameAccName)}" aria-label="账号的新名字" autocomplete="off" maxlength="40"><button class="btn" data-accrenamesave="${esc(a.id)}"${ui.renameAccBusy ? " disabled" : ""}>保存</button><button class="link" data-accrenamecancel>取消</button></div>${ui.renameAccNote ? `<span class="say bad" role="status">${esc(ui.renameAccNote)}</span>` : ""}`
      : `${shown} <button class="link" data-accrename="${esc(a.id)}" aria-label="给 ${esc(name)} 改名">改名</button>`;
    const q = a.quota;
    const sendable = !lg && !credsMissing(a) && !credsUnknown(a) && !a.identityConflict && st.key === "ok";
    const quota = !q ? '<span class="sub">不限</span>' : sendable ? `${q.left} 条 <span class="sub">每天最多 ${q.cap} 条</span>` : '<span class="sub">现在发不了</span>';
    const switchedNote = ui.switchedTo[a.id] ? ` <span class="sub" role="status">${esc(ui.switchedTo[a.id])}</span>` : "";
    const note = [NOTE[a.platform], a.mode === "manual" ? "仅手动跟踪" : ""].filter(Boolean).join("，");

    let sub = "";
    if (ui.switchAsk === a.id) {
      sub = subRow(6, `<p>会清掉这个号在发布机「${esc(machineName())}」上的登录数据（浏览器资料、平台凭据文件、官方接口授权令牌）；排着的内容留在这个账号位置上，换好后按新号发。</p><span class="acts">${B("data-switchno", "取消", "link")}${B(`data-switchyes="${esc(a.id)}"`, "换号并登录")}</span>`);
    } else if (ui.logoutAsk === a.id) {
      sub = subRow(6, `<p>退出后会清掉这个账号在发布机「${esc(machineName())}」上的登录数据，要重新登录才能发；排着要发的这个账号的内容，退出后不会发。</p><span class="acts">${B("data-logoutno", "取消", "link")}${B(`data-logoutyes="${esc(a.id)}"`, "退出登录")}</span>`);
    // 缺凭证时，就算上一次 Connect 已经失败（lg.step = fail），也直接给填写的表单，不留红框死路。
    } else if ((credsMissing(a) || ui.credOpen === a.id) && (ui.credOpen === a.id || lg?.step === "fail")) {
      const c = ui.cred;
      const of = OFFICIAL[a.platform];
      sub = subRow(6, `<p>填${esc(of.where)}。它保存在发布机上，不会回显，也不进日志。</p>` +
        `<input type="text" id="cred-key" placeholder="${of.idName}" aria-label="${of.idName}" autocomplete="off" value="${esc(c.key)}">` +
        `<input type="password" id="cred-secret" placeholder="client secret" aria-label="client secret" autocomplete="new-password" value="${esc(c.secret)}">` +
        `<span class="acts">${B("data-credcancel", "取消", "link")}${B("data-credsave", "保存", "btn pri", c.busy ? " disabled" : "")}</span>` +
        (c.note ? `<span class="${c.bad ? "say bad" : "sub"}" role="status" style="flex:1 1 100%">${esc(c.note)}</span>` : ""), "wait");
    } else if (lg && !credsUnknown(a)) sub = loginSub(a, lg);
    else if (a.identityConflict) {
      sub = subRow(6, `<p>${esc(a.identityConflict)}</p><span class="acts">${B(`data-logoutyes="${esc(a.id)}"`, "退出登录，换一个号")}</span>`, "bad");
    }
    const row = `<tr${sub ? ' class="has-sub"' : ""} data-acc="${esc(a.id)}"><td>${pfn(a.platform)}</td><td class="acct">${who}${switchedNote}</td><td>${statusCell(a, st, lg)}</td><td>${quota}</td><td class="sub">${esc(note)}</td><td class="n">${accountActions(a, st, lg)}</td></tr>`;
    return row + sub;
  }

  function nameCell(g) {
    return ui.renaming === g.id
      ? `<div class="grpname"><input type="text" id="rename-input" value="${esc(g.name)}" aria-label="新名字" maxlength="60"><button class="btn" data-renamesave="${esc(g.id)}">保存</button><button class="link" data-renamecancel>取消</button></div>`
      : `<b class="nm">${esc(g.name)}</b>`;
  }

  function groupRows(pending) {
    const accountsOf = (id) => (VK.snapshot()?.accounts ?? []).filter((a) => a.groupId === id);
    return VK.groups().map((g) => {
      const isCur = g.id === VK.current()?.id;
      const mine = ui.today ? ui.today.awaiting.length + ui.today.problems.length : 0;
      const n = isCur ? mine : Number(pending[g.id] ?? 0);
      const accs = accountsOf(g.id);
      const names = accs.length ? `${accs.length} 个 <span class="sub">· ${accs.map((a) => esc(pfName(a.platform))).join("、")}</span>` : '<span class="sub">还没有账号</span>';
      const act = isCur ? '<span class="sub">当前</span>' : `<a class="btn" href="/system" data-sw="${esc(g.id)}">切过去</a>`;
      return `<tr><td>${nameCell(g)}</td><td>${names}</td><td>${n ? `<span class="st wait">${n} 件</span>` : '<span class="st">没有</span>'}</td>` +
        `<td class="n"><span class="acts">${ui.renaming === g.id ? "" : `<button class="link" data-rename="${esc(g.id)}">改名</button>`}${act}</span></td></tr>`;
    }).join("");
  }

  /** 新建账号组：放在表格最后一行，点开就地填名字。 */
  function newGroupRow() {
    if (ui.newGroup || !VK.groups().length) {
      return `<tr class="addrow"><td><input type="text" id="ng-name" placeholder="新账号组的名字" aria-label="新账号组的名字" maxlength="60" value="${esc(ui.newGroupName)}"></td><td colspan="2" class="sub">${ui.groupNote ? `<span class="say bad" role="status">${esc(ui.groupNote)}</span>` : "建好后切过去，再接入这一套平台账号。飞书卡片标题会带上账号组的名字。"}</td>` +
        `<td class="n"><span class="acts">${VK.groups().length ? B("data-ngcancel", "取消", "link") : ""}${B("data-ngsave", "建好", "btn", ui.groupBusy ? " disabled" : "")}</span></td></tr>`;
    }
    return '<tr><td colspan="4"><button class="link" data-newg>新建账号组</button></td></tr>';
  }

  /** 接入账号：表格的最后一行。 */
  function addRow(group) {
    const taken = (p) => ui.accounts.some((a) => a.platform === p || (TIKTOK_FAMILY.includes(p) && TIKTOK_FAMILY.includes(a.platform)));
    const none = !ui.platforms.length;
    const allTaken = !none && ui.platforms.every((p) => taken(p.platform));
    // 「读失败」和「真的一个平台都没装」不是一回事：前者要说出来，不能显示成后者（静默失败是 P0）。
    if (ui.platformsErr) return '<tr><td colspan="6" class="sub">读不到平台信息，先刷新页面再接入账号。</td></tr>';
    if (none) return '<tr><td colspan="6" class="sub">没有已安装的平台。</td></tr>';
    if (allTaken) return '<tr><td colspan="6" class="sub">这个组能接的平台都接上了。一个组里每个平台接一个号；要接第二个号，新建一个账号组。</td></tr>';
    const opts = ui.platforms.map((p) => `<option value="${esc(p.platform)}"${p.platform === ui.addPlatform && !taken(p.platform) ? " selected" : ""}${taken(p.platform) ? " disabled" : ""}>${esc(labelOf(p.platform))}${taken(p.platform) ? "（已接入）" : ""}</option>`).join("");
    return `<tr class="addrow" id="addrow"><td><select id="add-platform" aria-label="要接入的平台">${opts}</select></td>` +
      `<td><input type="text" id="add-name" placeholder="账号名（你自己认得出就行，不影响平台）" aria-label="账号名" autocomplete="off" maxlength="40" value="${esc(ui.addName)}"></td>` +
      `<td colspan="3" class="sub"><span class="say${ui.addBad ? " bad" : ""}" role="status">${ui.addNote ? esc(ui.addNote) : `接入后当场登录，归到「${esc(group.name)}」。`}</span></td>` +
      `<td class="n">${B("data-add", "接入账号", "btn", ui.addBusy || !group ? " disabled" : "")}</td></tr>`;
  }

  /** 平台清单读不到时，账号表上方说清楚：不能把「读失败」显示成「都正常」或「没装平台」。 */
  function platformsNote() {
    const unknown = [...new Set(ui.accounts.filter((a) => OFFICIAL[a.platform] && !credsMissing(a) && !platformInfo(a.platform)?.credentials).map((a) => a.platform))];
    if (!ui.platformsErr && !unknown.length) return "";
    const why = ui.platformsErr
      ? `读平台清单失败：${esc(ui.platformsErr)}`
      : `平台清单里没有 ${unknown.map((p) => esc(labelOf(p))).join("、")} 的应用凭证状态`;
    return `<div class="note bad" role="status" id="platforms-err">读不到平台信息：${why}。这几行的登录操作先不显示；刷新页面再试。</div>`;
  }

  /** 视频号每天检查登录的钟点：现有的设置行样式（sysrow）。只有接了视频号账号才出现。 */
  function checktimeRow() {
    const ct = ui.checktime;
    if (!ct || !ui.accounts.some((a) => TRACKED.has(a.platform))) return "";
    return `<div class="sysrow"><label>视频号每天 <input type="time" id="ct-time" value="${esc(ct.value ?? ct.time)}" aria-label="视频号每天检查登录的时间"> 查一次登录</label>` +
      `<button class="btn" data-ctsave${ct.busy || (ct.value ?? ct.time) === ct.time ? " disabled" : ""}>保存</button>` +
      `<span class="say${ct.bad ? " bad" : ""}" role="status">${esc(ct.note)}</span></div>` +
      `<div class="cmd">视频号的登录撑不了多久，所以只在发布机启动时、每天这个钟点、你确认视频号平台稿时、计划发布前 2 小时查一次；不会定时打开页面「续命」。登录已经过期时不再反复查，等你重新扫码。</div>`;
  }

  function tabAccounts(group, pending) {
    const groupsTable = `<div class="tblwrap"><table><thead><tr><th>账号组</th><th>账号</th><th>等你处理</th><th class="n"></th></tr></thead><tbody>${groupRows(pending)}${newGroupRow()}</tbody></table></div>`;
    if (!group) {
      return `<h2 class="sec">账号组 · 一个组是一套平台账号，有自己的作品、待办、数据和发布方案</h2>${groupsTable}<div class="panel empty" style="margin-top:12px">先建一个账号组，账号才有地方放。</div>`;
    }
    const where = publisherOffline() ? `<span class="st bad" style="margin-left:10px">${OFFLINE_SAY}</span>` : `在发布机「${esc(machineName())}」上登录和发布`;
    const accountsTable = `<div class="tblwrap"><table><thead><tr><th>平台</th><th>账号</th><th>登录</th><th>今天还能发</th><th>说明</th><th class="n"></th></tr></thead><tbody>${ui.accounts.map(accountRow).join("")}${addRow(group)}</tbody></table></div>`;
    return `<h2 class="sec">账号组 · 一个组是一套平台账号，有自己的作品、待办、数据和发布方案</h2>${groupsTable}` +
      `<h2 class="sec" id="accounts">账号 · ${esc(group.name)} · ${where}</h2>${platformsNote()}${accountsTable}${checktimeRow()}` +
      `<div class="cmd">平台的登录数据只存在你自己的发布机上，这个服务拿不到。手机上的通知和确认都在飞书里。</div>`;
  }

  // ── 画页面：发布方案与平台规则 ───────────────────────────────────────────
  const KIND_OPTS = [["*", "成片"], ["video", "视频"], ["image", "图片"]];
  const LANG_OPTS = [["*", "所有语言"], ["zh", "中文"], ["en", "English"]];

  function planRow(r, i) {
    const ed = ui.planEdit;
    const isEdit = ed && !ed.isNew && ed.i === i;
    const cells = `<td>${esc(r.label)}</td><td><div class="pfs">${r.platforms.map((p) => pfn(p.platform, p.name)).join("") || '<span class="sub">还没有接入平台</span>'}</div></td><td class="sub">${esc(r.rhythm)}</td><td class="n"><button class="btn" data-plan="${i}">改</button></td>`;
    return `<tr>${cells}</tr>` + (isEdit ? planEditor(r) : "");
  }

  function planEditor(r) {
    const ed = ui.planEdit;
    const opts = (list, cur, id, dis) => `<select id="${id}" aria-label="${id === "pe-kind" ? "成片类型" : "语言"}"${dis ? " disabled" : ""}>${list.map(([v, n]) => `<option value="${v}"${v === cur ? " selected" : ""}>${n}</option>`).join("")}</select>`;
    const picks = ui.plan.installedPlatforms.map((p) => `<label><input type="checkbox" data-pe-pf="${esc(p.platform)}"${ed.platforms.includes(p.platform) ? " checked" : ""}> ${esc(p.name)}</label>`).join("");
    const canRemove = !ed.isNew && ui.plan.rows.length > 1;
    return `<tr class="planedit"><td colspan="4"><div class="sysrow" style="margin-top:0">${ed.isNew ? `<b style="font-weight:600">加一行</b>${opts(KIND_OPTS, ed.kind, "pe-kind")}${opts(LANG_OPTS, ed.language, "pe-lang")}` : `<b style="font-weight:600">${esc(r.label)}</b>`}</div>` +
      `<div class="pickpf" role="group" aria-label="发到哪些平台">${picks}</div>` +
      `<div class="sysrow" style="margin-top:0"><label>节奏：入库后第 <input type="number" id="pe-days" min="0" max="60" value="${ed.delayDays}" aria-label="入库后第几天起排"> 天起排</label>` +
      `<button class="btn" data-plansave${ui.planBusy ? " disabled" : ""}>保存</button><button class="link" data-plancancel>取消</button>${canRemove ? '<button class="link" data-planremove>删掉这一行</button>' : ""}` +
      `<span class="say${ui.planNote ? " bad" : ""}" role="status">${esc(ui.planNote)}</span></div></td></tr>`;
  }

  function planBlock(group) {
    const head = `<h2 class="sec" id="plan">发布方案 · ${esc(group.name)} · 哪种成片发到哪些平台、按什么节奏</h2>`;
    if (!ui.plan) return `${head}<div class="note bad">读不到发布方案：${esc(ui.sectionErr ?? "未知错误")}</div>`;
    const rows = ui.plan.rows.map(planRow).join("");
    const adding = ui.planEdit?.isNew ? planEditor({ label: "" }) : "";
    return `${head}<div class="tblwrap"><table class="plan"><thead><tr><th>成片</th><th>发到</th><th>节奏</th><th class="n"></th></tr></thead><tbody>${rows}${adding}</tbody></table></div>` +
      `<div class="cmd">这是你自己的习惯，可以改；新作品入库时按它生成平台稿和建议时间，每条仍然要你确认，已经生成的平台稿不受影响。${ui.planEdit?.isNew ? "" : '<button class="link" data-planadd>加一行</button>'}${ui.plan.isDefault ? "" : '<button class="link" data-planreset>恢复默认方案</button>'}</div>`;
  }

  /** 同一个数值的平台并成一行：「B站、小红书　每个账号每天最多 10 条」。 */
  function ruleLines(rules, field, flag, text) {
    const by = new Map();
    for (const r of rules) {
      const key = `${r[field]}|${r[flag]}`;
      by.set(key, [...(by.get(key) ?? []), r]);
    }
    const single = by.size === 1;
    return [...by.values()].map((g) => `<div>${single ? "" : `<span class="sub">${g.map((r) => esc(r.name)).join("、")}　</span>`}${text(g[0][field])}${g[0][flag] ? ' <span class="sub">默认值</span>' : ""}</div>`).join("");
  }

  function rulesBlock() {
    const rules = ui.plan?.rules ?? [];
    const rows = rules.length
      ? `<dt>每天最多</dt><dd>${ruleLines(rules, "dailyCap", "capIsDefault", (n) => `每个账号 ${n} 条`)}</dd><dt>间隔</dt><dd>${ruleLines(rules, "minGapMinutes", "gapIsDefault", (n) => `同一个账号两条之间至少隔 ${n} 分钟`)}</dd>`
      : "";
    return `<h2 class="sec">平台规则 · 对所有人一样，不能关</h2><div class="panel"><dl class="kv"><dt>确认</dt><dd>每一条都要人确认后才会发</dd><dt>小红书</dt><dd>每条单独确认，不能批量</dd>${rows}<dt>AI 标注</dt><dd>每个平台按它的要求标注</dd></dl></div>` +
      `<div class="cmd">你改的时间碰到规则时，会当场告诉你并给出最近的可用时间。</div>`;
  }

  function tabPlan(group) {
    return group ? planBlock(group) + rulesBlock() : '<div class="panel empty">先建一个账号组，再设发布方案。</div>';
  }

  // ── 画页面：设备（发布机、中转、版本与更新）─────────────────────────────────
  const ago = (ms) => (ms < 90e3 ? "刚刚" : ms < 3600e3 ? `${Math.round(ms / 60e3)} 分钟前` : `${Math.round(ms / 3600e3)} 小时前`);
  const RECENT_UPDATE_MS = 3 * 864e5;

  /** 中转：连接状态、上次拉取、正在下载的投递和进度。没配中转就不画。 */
  function relayRows() {
    const r = ui.relay;
    if (!r || !r.configured) return "";
    const st = { ok: '<span class="st done">中转已连上</span>', error: '<span class="st bad">中转连不上</span>', never: '<span class="st">中转还没拉取过</span>' }[r.connection] ?? "";
    const last = r.lastPullAt ? `上次拉取 ${esc(ago(Date.now() - r.lastPullAt))}` : "还没有拉取过";
    const err = r.connection === "error" && r.lastError ? `<div class="sub">${esc(r.lastError.message)}</div>` : "";
    const dl = r.downloading.length
      ? r.downloading.map((d) => `<div>正在下载 ${esc(d.name)} <progress max="100" value="${esc(d.percent)}" aria-label="下载进度"></progress> <span class="sub">${esc(d.percent)}%</span></div>`).join("")
      : r.pending ? `<div class="sub">${esc(r.pending)} 个投递还没下完，下一轮接着下</div>` : "";
    return `<div style="margin-top:8px">${st}<div class="sub">${last}；每 ${esc(r.intervalMinutes)} 分钟拉一次；新作品入库后在「今天」等你确认</div>${err}${dl}</div>`;
  }

  function versionCell() {
    const u = ui.update;
    if (!u) return '<span class="sub">读不到版本</span>';
    const ver = `<span class="mono">${esc(u.display ?? `${u.version}+${u.short ?? "未知提交"}`)}</span>`;
    if (ui.upd) return `${ver}<div class="sub">服务会短暂重启，几十秒后回来</div>`;
    const behind = u.lastCheck && !u.lastCheck.up_to_date;
    const latest = u.lastCheck?.up_to_date;
    const lu = u.lastUpdate;
    const hasNotes = lu && Date.now() - lu.at < RECENT_UPDATE_MS && (lu.commits ?? []).length;
    const state = behind ? `<span class="sub">${esc(u.lastCheck.message || "有新版本")}</span>`
      : latest ? `<span class="sub">已是最新</span>${hasNotes ? ` <button class="link" data-notes aria-expanded="${ui.notesOpen}">${ui.notesOpen ? "收起" : "看更新了什么"}</button>` : ""}`
      : '<span class="sub">还没检查过</span>';
    const checked = u.lastCheckAt ? `<div class="sub">上次检查 ${esc(ago(Date.now() - u.lastCheckAt))}</div>` : "";
    const auto = `<div class="sub">自动更新${u.auto ? "开着" : "关着"} <button class="link" data-autoupd="${u.auto ? "off" : "on"}"${ui.updBusy ? " disabled" : ""}>${u.auto ? "关掉" : "打开"}</button>${u.auto ? `　每 ${esc(u.intervalHours)} 小时检查，只在空闲时更新，失败自动退回` : ""}</div>`;
    return `${ver} ${state}${checked}${auto}`;
  }

  // ── 出口位置：平台看到的你在哪（ACC-v3-egress-01/04/06）─────────────────────
  const egressPaused = () => ui.egress?.paused ?? [];
  const pfLabel = (a) => labelOf(a.platform);
  const placeOf = (side) => side ? `${side.countryName ?? side.country}${side.city ? " " + side.city : ""}` : "";

  /** 「出口位置」这一格：每条线路一行（两条一样只写一行）；机房线路黄点「可能是代理」；位置变了黄点。 */
  function egressCell(online) {
    const e = ui.egress;
    if (!e) return '<span class="sub">读不到出口位置</span>';
    const moved = egressPaused().length > 0;
    const shown = e.split ? e.lines : e.lines.filter((l) => !l.error).slice(0, 1).concat(e.lines.filter((l) => l.error));
    const rows = shown.map((l) => {
      if (l.error) return `<div class="sub">${e.split ? esc(l.label) + "：" : ""}${esc(l.error)}</div>`;
      const net = l.datacenter === true ? `<span class="st wait">机房线路，可能是代理</span>` : l.datacenter === false ? '<span class="sub">家庭或办公室线路</span>' : '<span class="sub">线路类型查不到</span>';
      return `<div>${e.split ? `<span class="sub">${esc(l.label)}：</span>` : ""}${esc(l.place)} ${l.ip ? `<span class="mono">${esc(l.ip)}</span>` : ""} ${net}</div>`;
    }).join("");
    const stale = e.probedAt && !online ? `<div class="sub">发布机不在线，这是 ${esc(ago(Date.now() - e.probedAt))}查到的</div>` : "";
    return `${moved ? '<span class="st wait">出口位置变了</span>' : ""}${rows || '<span class="sub">还没探测过</span>'}${stale}${e.notes.map((n) => `<div class="sub">${esc(n)}</div>`).join("")}${geoButton(e)}`;
  }

  /** 位置库「现在重新下载」：下载中不显示按钮（进度写在上面的说明里），页面每 2 秒刷新一次直到下完。 */
  function geoButton(e) {
    if (e.geoDb?.downloading) return "";
    return `<div>${B('data-ipx="geodb"', "现在重新下载位置库", "link", ui.ipBusy ? " disabled" : "")}</div>`;
  }
  let geoTimer = null;
  function syncGeoPoll() {
    const want = !!ui.egress?.geoDb?.downloading;
    if (want && !geoTimer) geoTimer = setInterval(async () => { try { await load(); draw(); } catch {} }, Math.max(500, POLL_MS));
    if (!want && geoTimer) { clearInterval(geoTimer); geoTimer = null; }
  }

  /** 位置变了：写清平时在哪、现在在哪、哪几个平台先暂停；两条路——继续用新位置（行内再确认）/ 我去关掉代理。 */
  function ipRow() {
    const paused = egressPaused();
    if (!paused.length) return "";
    const first = paused[0];
    const names = [...new Set(paused.map(pfLabel))].join("、");
    const from = placeOf(first.baseline), to = placeOf(first.now);
    const busy = ui.ipBusy ? " disabled" : "";
    if (ui.ipStep === "stay") {
      return subRow(6, `<p><b>以后把${esc(to)}当作这 ${paused.length} 个账号平时的位置，并恢复发布。</b>如果${esc(machineName())}其实开着代理，平台会看到这些账号突然换了国家，有被处罚的风险。确定是你自己换了地方再点。</p><span class="acts">${B('data-ipx="back"', "取消", "link")}${B('data-ipx="stay-ok"', "就用新位置，恢复发布", "btn", busy)}</span>`, " wait");
    }
    if (paused.every((a) => a.waiting)) {
      return subRow(6, `<p><span class="st wait">等发布机复查</span>　关掉代理后，发布机 1 分钟内会自己再查一次；位置回到${esc(from)}就自动恢复发布，不用再回来点。</p><span class="acts">${B('data-ipx="recheck"', "现在再查一次", "btn", busy)}</span>`, " wait");
    }
    return subRow(6, `<p><b>平时在${esc(from)}，现在是${esc(to)}。</b>平台看到的位置突然变了，容易被当成异常登录。${esc(names)}先暂停发布，已确认的不会丢。多半是${esc(machineName())}开了代理。</p><span class="acts">${B('data-ipx="stay"', "继续用新位置")}${B('data-ipx="fix"', "我去关掉代理")}</span>`, " wait");
  }

  async function ipAction(x) {
    if (x === "back") { ui.ipStep = null; return draw(); }
    if (x === "stay") { ui.ipStep = "stay"; return draw(); }
    ui.ipBusy = true; draw();
    try {
      if (x === "stay-ok") {
        await post("/api/egress/accept", { group: VK.current()?.id, confirm: true });
        toast("好，以后把新位置当作平时的位置，已恢复发布");
      } else if (x === "fix") {
        await post("/api/egress/wait", { group: VK.current()?.id });
        toast("好，关掉代理后发布机会自己复查");
      } else if (x === "geodb") {
        const r = await post("/api/egress/geodb", { group: VK.current()?.id });
        toast(r.started ? "开始下载位置库了，进度在「出口位置」里" : "位置库已经在下载了，不用重复点");
      } else if (x === "recheck") {
        await post("/api/egress/recheck", { group: VK.current()?.id });
        toast(ui.egress?.pausedCount ? "还没回到平时的位置，继续暂停" : "位置回到平时的国家了，已恢复发布");
      }
      ui.ipStep = null;
    } catch (err) { toast(`没成功：${err.message}`); }
    ui.ipBusy = false;
    await refresh();
  }

  function deviceRow() {
    const m = ui.machine;
    const u = ui.update;
    const online = m?.online;
    const status = ui.upd ? '<span class="st">正在更新…</span>'
      : !m ? '<span class="st bad">读不到</span>'
      : online ? `<span class="st done">在线</span><div class="sub">${esc(ago(m.heartbeatAgeMs ?? 0))}还连着</div>`
      : `<span class="st bad">不在线</span><div class="sub">${m.heartbeatAgeMs == null ? "还没有收到心跳" : `${esc(ago(m.heartbeatAgeMs))}有心跳`}</div>`;
    const accountsN = (VK.snapshot()?.accounts ?? []).length;
    const behind = u?.lastCheck && !u.lastCheck.up_to_date;
    let act = "";
    if (!ui.upd && u) {
      const dis = !online ? ` disabled title="${esc(machineName())}不在线，上线后才能更新"` : "";
      act = `<span class="acts">${B("data-updnow", "现在更新", behind ? "btn" : "link", dis)}</span>${!online ? `<div class="sub">${esc(machineName())}不在线，上线后才能更新</div>` : ""}`;
    }
    const lu = ui.update?.lastUpdate;
    const notes = ui.notesOpen && lu?.commits?.length
      ? subRow(6, `<div class="how"><b>${esc(lu.display ?? lu.version)} · ${esc(whenText(lu.at))} 更新</b><ul>${lu.commits.slice(0, 5).map((c) => `<li>${esc(c)}</li>`).join("")}</ul></div>`)
      : "";
    const updMsg = ui.upd ? subRow(6, `<p role="status">正在更新到最新版本，更新时${esc(machineName())}的服务会短暂重启；失败会自动回到现在的版本。</p>`, "wait")
      : ui.updNote ? subRow(6, `<p role="status">${esc(ui.updNote)}</p><span class="acts">${B("data-updnoteok", "知道了", "link")}</span>`, "bad") : "";
    const sub = ipRow() || updMsg || notes;
    return `<tr${sub ? ' class="has-sub"' : ""}><td><b class="nm">${esc(machineName())}</b><span class="sub">发布机</span></td>` +
      `<td>${status}${relayRows()}</td><td>${egressCell(online)}</td><td>${accountsN ? `${accountsN} 个` : '<span class="sub">没有</span>'}</td><td>${versionCell()}</td><td class="n">${act}</td></tr>${sub}`;
  }

  /** 接入 / 断开中转：放在设备表的最后一行。 */
  function relayAction() {
    const r = ui.relay;
    if (ui.relayAsk) return subRow(6, `<p>断开后${esc(machineName())}不再拉取制作机送来的作品，已经入库的作品不受影响。</p><span class="acts">${B("data-relayno", "取消", "link")}${B("data-relayoff", "断开")}</span>`);
    if (r?.configured) return `<tr><td colspan="6"><button class="link" data-relayask>断开中转</button> <span class="sub">制作机送来的作品经中转交给${esc(machineName())}</span></td></tr>`;
    const f = ui.relayForm;
    if (!f) return `<tr><td colspan="6"><button class="link" data-relayadd>接入中转</button> <span class="sub">让别的电脑上做好的作品送到${esc(machineName())}</span></td></tr>`;
    return subRow(6, `<div class="how"><b>接入中转</b><span class="sub">填中转的地址和它给你的拉取令牌。令牌只保存在发布机上，不会回显。</span>${f.note ? `<span class="say bad" role="status">${esc(f.note)}</span>` : ""}</div>` +
      `<input type="text" id="relay-url" placeholder="中转地址" aria-label="中转地址" autocomplete="off" value="${esc(f.url)}">` +
      `<input type="password" id="relay-token" placeholder="拉取令牌" aria-label="拉取令牌" autocomplete="new-password" value="${esc(f.token)}">` +
      `<span class="acts">${B("data-relaycancel", "取消", "link")}${B("data-relaysave", "接入", "btn pri", f.busy ? " disabled" : "")}</span>`);
  }

  function tabDevices() {
    return `<h2 class="sec">发布机 · 你的平台账号在${esc(machineName())}上登录和发布，登录数据只存在它上面</h2>` +
      `<div class="tblwrap"><table class="dev"><thead><tr><th>电脑</th><th>状态</th><th>出口位置 · 平台看到的你在哪</th><th>账号</th><th>版本</th><th class="n"></th></tr></thead><tbody>${deviceRow()}${relayAction()}</tbody></table></div>` +
      `<div class="cmd">出口位置每 10 分钟查一次。它和账号平时的位置不在同一个国家时，会先暂停那个账号的发布并告诉你。${ui.egress ? esc(ui.egress.source) : ""}${ui.egress?.geoDb?.cityDate ? ` 位置库的日期：${esc(new Date(ui.egress.geoDb.cityDate).toLocaleDateString())}。` : ""}</div>` +
      `<div class="cmd">自动更新只在空闲时进行，失败会自动退回原版本，并出现在「最近出的问题」里。</div>`;
  }

  // ── 最近出的问题（在分段上面）──────────────────────────────────────────────
  const WHAT = { failed: "没发出去", blocked: "被拦下了", expired: "过了时间没确认" };

  /** 最近出的问题里的更新失败：7 天内的那一条（页头计数和列表共用这一个判断）。 */
  const updFailure = () => {
    const uf = ui.update?.lastFailure;
    return uf && Date.now() - uf.at < 7 * 864e5 ? uf : null;
  };

  function problemsBlock(group) {
    if (!group) return "";
    const uf = updFailure();
    const updRow = uf
      ? `<tr><td><b class="nm">自动更新</b><span class="sub">${esc(whenText(uf.at))}</span></td><td></td><td><span class="st bad">没更新成功，已回到原版本</span><div class="sub">${esc(uf.message)}</div></td><td class="n"></td></tr>`
      : "";
    const relayRowsHtml = (ui.relay?.failures ?? []).map((f) => `<tr><td><b class="nm">中转投递${f.title ? `「${esc(f.title)}」` : ""}</b><span class="sub">${esc(whenText(f.at))}</span></td><td></td><td><span class="st bad">没入库</span><div class="sub">${esc(f.message)}</div></td><td class="n"></td></tr>`).join("");
    const rows = updRow + relayRowsHtml + ui.problems.map(({ run, p }) => {
      const day = whenText(run?.created_at ?? p.scheduledAt ?? Date.now());
      const why = p.error?.message ?? run?.last_error ?? "";
      return `<tr><td><a class="wcell" href="/work#id=${esc(p.workId)}${p.cutId ? `&cut=${esc(p.cutId)}` : ""}">${cover(ui.covers.get(p.workId), 48, 36)}<span><b>${esc(p.workTitle)}</b><span class="sub">${esc(p.cutTitle ?? "")}${p.cutTitle ? " · " : ""}${esc(day)}</span></span></a></td>` +
        `<td>${pfn(p.platform, pfName(p.platform))}</td><td><span class="st bad">${esc(WHAT[p.state] ?? p.state)}</span><div class="sub">${esc(why)}</div></td>` +
        `<td class="n"><button class="btn" data-retry="${esc(p.publishId)}"${ui.retrying.has(p.publishId) ? " disabled" : ""}>再试一次</button></td></tr>`;
    }).join("");
    // 没出过问题就不占版面（照设计稿）：这一块只在有事时出现。
    if (!rows) return "";
    return `<h2 class="sec" id="problems" style="margin-top:0">最近出的问题</h2>` +
      `<div class="tblwrap"><table><tbody>${rows}</tbody></table></div>`;
  }

  async function savePlanRow() {
    const ed = ui.planEdit;
    ui.planNote = "";
    if (!ed.platforms.length) { ui.planNote = "至少选一个平台"; return draw(); }
    const days = Number(ed.delayDays);
    if (!Number.isInteger(days) || days < 0 || days > 60) { ui.planNote = "天数要是 0 到 60 的整数"; return draw(); }
    ui.planBusy = true; draw();
    try {
      await post("/api/plan", { group: VK.current().id, kind: ed.kind, language: ed.language, platforms: ed.platforms, delayDays: days });
      ui.planEdit = null; ui.planBusy = false;
      toast("发布方案已保存，新作品按它生成平台稿");
      await refresh();
    } catch (err) {
      ui.planBusy = false; ui.planNote = err.message; draw();
    }
  }

  function draw() {
    syncGeoPoll();
    const group = VK.current();
    const pending = {};
    for (const o of ui.today?.others ?? []) pending[o.group.id] = o.total;
    const needs = ui.accounts.filter((a) => VK.loginState(a).key !== "ok" || a.identityConflict).length + ui.problems.length + (updFailure() ? 1 : 0) + (ui.relay?.failures ?? []).length + fsTodo();
    const sub = !group ? "还没有账号组" : needs ? `有 ${needs} 件事要处理` : "一切正常";
    const behind = ui.update?.lastCheck && !ui.update.lastCheck.up_to_date;
    const devN = (publisherOffline() ? 1 : 0) + (behind ? 1 : 0) + (egressPaused().length ? 1 : 0);
    const counts = { accounts: group ? ui.accounts.filter((a) => VK.loginState(a).key !== "ok" || a.identityConflict).length : 0, plan: 0, devices: devN, notify: fsTodo() };
    const tabs = `<div class="seg tabs" role="group" aria-label="系统的哪一部分">${TABS.map(([k, n]) => `<button data-tab="${k}" aria-pressed="${k === ui.tab}">${n}${counts[k] ? ` ${counts[k]}` : ""}</button>`).join("")}</div>`;
    const body = { accounts: () => cloudBlock() + tabAccounts(group, pending), plan: () => tabPlan(group), devices: tabDevices, notify: tabNotify }[ui.tab]();
    // 重画前记住正在打字的输入框，重画后放回去，不丢字。
    const act = document.activeElement;
    const keep = act && main.contains(act) && act.id ? { id: act.id, s: act.selectionStart, e: act.selectionEnd } : null;
    main.innerHTML = `
  <div class="hd"><h1>系统</h1><span class="sub" id="sub">${sub}</span></div>
  ${problemsBlock(group)}
  <div style="margin-top:22px">${tabs}</div>
  ${body}`;
    syncFsPoll();
    if (keep) {
      const el = document.getElementById(keep.id);
      if (el) { el.focus(); try { el.setSelectionRange(keep.s, keep.e); } catch { /* 有的输入框没有光标 */ } }
    }
  }


  // ── 通知：飞书（单机版只接所有者一人）──────────────────────────────────────
  // 状态来自 channel.status 的 state：missing 发布机上没有飞书组件 / none 没接 / qr 等你扫码 / sub 差一步 / ok 接好了 / bad 卡片发不出去 / off 不用飞书。
  const fsState = () => ui.fs?.state ?? null;
  const fsTodo = () => (["sub", "bad"].includes(fsState()) ? 1 : 0);
  const fsWhen = (ms) => (ms ? whenText(ms) : "还没发过");

  function fsQr(img, text) {
    return `<div class="qr">${img ? `<img src="${esc(img)}" alt="飞书二维码">` : esc(text)}</div>`;
  }

  function tabNotify() {
    const head = `<h2 class="sec">飞书 · 要你确认的发到手机上，在卡片上就能确认</h2>`;
    const f = ui.fs;
    if (!f) return head + `<div class="panel empty">${ui.fsErr ? `读不到飞书的状态：${esc(ui.fsErr)}。后台服务可能没在运行。` : "先建一个账号组。"}</div>`;
    // 在扫码那一步点了「取消」：页面先回到「还没接」，不再自己往下走，直到再点「接飞书」。
    const s = ui.fsPaused && f.state === "qr" && !f.create?.running ? "none" : f.state;
    const link = `<div class="cmd"><a class="link" href="feishu.html">看飞书卡片长什么样</a></div>`;
    const busy = ui.fsBusy ? " disabled" : "";
    // 扫码建机器人那一步失败后回到「还没接」：把原因留在页面上（二维码已收起，只剩「接飞书」重新来）。
    const noteText = ui.fsNote || (s === "none" && f.create?.error ? `没接成：${f.create.error}` : "");
    const note = noteText ? `<div class="note bad" role="alert" style="margin-bottom:12px">${esc(noteText)}</div>` : "";
    if (s === "missing") {
      return head + note + `<div class="tblwrap"><table><tbody><tr><td><span class="st bad">发布机上还没有飞书组件</span>` +
        `<div class="sub">接飞书要靠发布机上的飞书组件，它是装发布机时一起装的；这台发布机上没找到，所以现在接不了。补装办法：在发布机上重新运行安装页上的那一行安装命令（可以反复运行，数据、账号、登录都保留），装好后回到这里刷新。要你确认的先在网页的「今天」里做，不会漏。</div></td>` +
        `<td class="n"><span class="acts">${B('data-fs="off"', "不用飞书", "link")}${B("disabled", "接飞书", "btn pri", ' title="这台发布机上没有飞书组件，接不了"')}</span></td></tr></tbody></table></div>` + link;
    }
    if (s === "none" || s === "off") {
      // 机器人早先建好了、但还没认出你是谁（老版本要扫两次码，第二次授权不了）：重新扫一次就好，不用先删旧的。
      const half = s === "none" && f.configured && !f.bound;
      const text = s === "off" ? "要你确认的只出现在网页的「今天」里。没有人确认，一条都不会发。"
        : half ? "飞书里的机器人已经建好，但还不知道卡片该发给谁。点「重新接」扫一次码就接好了，不用先删旧的机器人。"
        : "接上以后，有要你确认的、出了问题的，会发到你的飞书里。不接也可以，那就只在网页上确认。";
      return head + note + `<div class="tblwrap"><table><tbody><tr><td><span class="st ${s === "off" ? "" : "wait"}">${s === "off" ? "不用飞书" : half ? "差一次扫码" : "还没接"}</span>` +
        `<div class="sub">${text}</div></td>` +
        `<td class="n"><span class="acts">${s === "off" ? "" : B('data-fs="off"', "不用飞书", "link", busy)}${B('data-fs="connect"', half ? "重新接" : "接飞书", s === "off" ? "btn" : "btn pri", busy)}</span></td></tr></tbody></table></div>` + link;
    }
    if (s === "qr") {
      // 只有一个二维码：扫完就建好机器人并认出你，后面自己往下走。
      const err = f.create?.error;
      return head + note + (err ? `<div class="subin bad" style="margin-bottom:12px"><p><span class="st bad">没接成</span>　${esc(String(err).replace(/[。.]+$/, ""))}。</p><span class="acts">${B('data-fs="connect"', "重新来", "btn")}</span></div>` : "") +
        (err ? "" : `<div class="subin">${fsQr(f.create?.qr, "正在取二维码…")}<div class="how"><b>用飞书 App 扫这个码</b><span class="sub">会在你的飞书里建一个只属于你的机器人「versekit」，卡片由它发给你。别人看不到你的卡片，你也看不到别人的。扫完这里会自己往下走。</span>` +
        `<span class="alt">${f.create?.url ? `<a class="link" href="${esc(f.create.url)}" target="_blank" rel="noopener">扫不了？点这里打开</a>` : ""}${B('data-fs="cancel"', "取消", "link")}</span></div></div>`) + link;
    }
    if (s === "sub") {
      const u = f.subscription?.url;
      const checking = !f.subscription;
      return head + note + `<div class="subin wait"><p><span class="st wait">差一步</span>　<b>让卡片上的按钮能点。</b>机器人建好了，卡片也能收到，但飞书默认不把「点了按钮」告诉我们。${checking ? "正在确认…" : "点下面的按钮到飞书里开通，开通后这里会自己变成「接好了」，不用回来按什么。"}</p>` +
        `<span class="acts">${B('data-fs="drop-ok"', "先不接了", "link")}${u ? `<a class="btn pri" href="${esc(u)}" target="_blank" rel="noopener">去飞书里开通</a>` : B("disabled", "去飞书里开通", "btn pri", ' title="还在确认，几秒后会出现"')}</span></div>` + link;
    }
    // ok / bad
    const bad = s === "bad";
    const kinds = f.kinds ?? {};
    const row = (k, name, what) => `<tr><td><b class="nm">${name}</b><div class="sub">${what}</div></td><td class="n"><label class="sw"><input type="checkbox" data-fson="${k}" ${kinds[k] ? "checked" : ""}> ${kinds[k] ? "发" : "不发"}</label></td></tr>`;
    const dropAsk = ui.fsDrop ? subRow(2, `<p>断开后不再往飞书发卡片，要你确认的只出现在网页的「今天」里。飞书里的机器人不会被删，你可以自己在飞书里删掉。</p><span class="acts">${B('data-fs="keep"', "取消", "link")}${B('data-fs="drop-ok"', "断开")}</span>`) : "";
    return head + note +
      (bad ? `<div class="subin bad" style="margin-bottom:12px"><p><span class="st bad">卡片发不出去</span>　${esc(whenText(f.failure.at))} 那张没送到：${esc(f.failure.reason)}。要你确认的现在只出现在网页的「今天」里。</p><span class="acts">${B('data-fs="connect"', "重新接", "btn", busy)}</span></div>` : "") +
      `<div class="tblwrap"><table><tbody><tr><td><b class="nm">${bad ? '<span class="st bad">发不出去</span>' : '<span class="st done">接好了</span>'}</b><div class="sub">发给你自己的飞书 · 机器人「versekit」${bad ? "" : ` · 上一张卡片：${esc(fsWhen(f.lastOkAt))}`}</div></td>` +
      `<td class="n"><span class="acts">${ui.fsDrop ? "" : `${B('data-fs="drop"', "断开", "link")}${bad ? "" : B('data-fs="test"', "发一张测试卡片", "btn", busy)}`}</span></td></tr>${dropAsk}</tbody></table></div>` +
      `<h2 class="sec">往飞书发什么</h2><div class="tblwrap"><table><tbody>` +
      row("confirm", "要你确认的", "新作品入库、建议的时间快到了还没确认。卡片上可以直接确认、改时间、这条不发。") +
      row("issue", "出了问题的", "没发出去、账号要重新登录、发布机不在线、出口位置变了。") +
      row("daily", "每天的结果", "每天早上一张：昨天发了什么、哪条比平时好、哪条差。") +
      `</tbody></table></div><div class="cmd">关掉「要你确认的」以后，确认只能在网页上做。<a class="link" href="feishu.html">看飞书卡片长什么样</a></div>`;
  }

  async function fsCall(path, body = {}) {
    return post(`/api/channels/feishu/${path}`, body);
  }

  /** 「接飞书」：只点一下、只扫一次码，后面的步骤（建应用 → 配对 → 探订阅 → 测试卡片）自己往下走。 */
  async function fsConnect() {
    ui.fsBusy = true; ui.fsNote = ""; ui.fsTried = false; ui.fsPaused = false; draw();
    try {
      if (ui.fs?.skipped) await fsCall("unskip");
      await fsCall("app/create"); // 只扫一次码；已建应用未配对、卡片发不出去后的「重新接」也是它，不要求先删旧应用
    } catch (err) { ui.fsNote = `没接成：${err.message}`; }
    ui.fsBusy = false;
    await loadFeishu(); draw();
  }

  /** 轮询：扫码、开通按钮都在飞书那边完成，这里每 2 秒读一次状态，到了就自己往下走，没有「我弄好了」。 */
  let fsTimer = null;
  async function fsTick() {
    const before = ui.fs?.state;
    const prev = JSON.stringify(ui.fs);
    await loadFeishu();
    const f = ui.fs;
    if (before && before !== "ok" && ui.fs?.state === "ok") toast("飞书接好了，测试卡片已经发出，去飞书里看一眼");
    if (JSON.stringify(ui.fs) !== prev || ui.fsNote) draw();
  }
  function syncFsPoll() {
    const want = ["qr", "sub"].includes(ui.fs?.state) && ui.tab === "notify";
    if (want && !fsTimer) fsTimer = setInterval(fsTick, Math.max(500, POLL_MS));
    if (!want && fsTimer) { clearInterval(fsTimer); fsTimer = null; }
  }

  // ── 登录（就地完成，不跳旧页面）──────────────────────────────────────────
  const post = (path, body) => VK.request(path, { method: "POST", body });
  const acc = (id) => ui.accounts.find((a) => a.id === id);
  const accPath = (id, what) => `/api/accounts/${encodeURIComponent(id)}/${what}`;

  function stopPoll(id) {
    const t = polls.get(id);
    if (t) clearInterval(t);
    polls.delete(id);
  }
  const fail = (id, text) => { stopPoll(id); ui.login[id] = { step: "fail", text }; draw(); };

  async function succeed(id) {
    stopPoll(id);
    delete ui.login[id];
    const swapped = ui.switched[id];
    delete ui.switched[id];
    toast("登录正常");
    await refresh();
    if (swapped) {
      const a = acc(id);
      ui.switchedTo[id] = `已换成 ${a?.display_name || a?.handle || "新号"}`;
      toast(ui.switchedTo[id]);
      draw();
    }
  }

  /** account.check：适配器真实检查（B站走自己的续期检查）。只有 ok 才算登上。 */
  async function confirm(id, { manual = false } = {}) {
    const a = acc(id);
    const label = a?.platform === "bilibili" ? "B站" : "平台";
    try {
      const r = await post(accPath(id, "check"), { accountId: id });
      if (r.state === "ok") return succeed(id), true;
      if (r.skipped) { if (manual) fail(id, "这个平台还没有自动检查，没法确认登录；可以在「今天」里发一条试试。"); return false; }
      const reason = { expiring: "已登录，但凭证快过期了，请重新登录一次", expired: manual ? "还没检测到登录：先在打开的窗口里完成登录" : `登录信息已保存，但${label}校验没通过`, banned: "账号在平台上被限制，需要先在平台侧处理" }[r.state] ?? "登录状态不对";
      if (manual && r.state === "expired") { ui.login[id] = { ...ui.login[id], text: reason }; draw(); return false; }
      fail(id, `${reason}${r.detail ? `（${r.detail}）` : ""}。点「重新登录」再来一次。`);
    } catch (err) {
      fail(id, `检查失败：${err.message}。点「重新登录」再来一次。`);
    }
    return false;
  }

  let confirming = new Set();
  /** 扫码和窗口登录共用的轮询：状态自己从「等你扫码」走到「已扫码」再到正常，不需要人点按钮。 */
  async function pollOnce(id) {
    try {
      const r = await post(accPath(id, "login/status"), { accountId: id });
      const cur = ui.login[id];
      if (!cur) return;
      if (r.state === "ok") {
        if (confirming.has(id)) return;
        confirming.add(id);
        try {
          // 拿到 cookie 不等于能用：B站再过一遍检查，通过才显示正常。
          if (acc(id)?.platform === "bilibili" || TRACKED.has(acc(id)?.platform)) await confirm(id); else await succeed(id);
        } finally { confirming.delete(id); }
        return;
      }
      if (cur.step === "qr" || cur.step === "scanned" || cur.step === "qrold") {
        if (r.state === "scanned") { if (cur.step !== "scanned") { ui.login[id] = { step: "scanned" }; draw(); } return; }
        if (r.state === "expired") { stopPoll(id); ui.login[id] = { step: "qrold" }; draw(); return; }
        if (r.state === "waiting") {
          const qr = r.qr ?? cur.qr;
          if (qr !== cur.qr || cur.step !== "qr" || r.refreshed) { ui.login[id] = { step: "qr", qr, note: r.refreshed ? "二维码过期了，已自动换成新的，请重新扫码。" : "" }; draw(); }
          return;
        }
        if (r.state === "failed" || r.state === "idle") return fail(id, r.note ?? "没有检测到登录完成：点「重新登录」再试。");
        return;
      }
      if (r.state === "idle" || r.state === "failed") fail(id, r.note ?? "没有检测到登录完成：点「重新登录」再试。");
    } catch {
      /* 轮询里的瞬时错误不打断；超时由 startPoll 兜底 */
    }
  }

  function startPoll(id) {
    stopPoll(id);
    let ticks = 0; // 默认 2 秒一次，最多认 10 分钟
    const maxTicks = Math.round(600e3 / POLL_MS);
    polls.set(id, setInterval(() => {
      if (++ticks > maxTicks) return fail(id, "10 分钟内没有检测到登录完成：点「重新登录」再试。");
      pollOnce(id);
    }, POLL_MS));
  }

  async function connectOfficial(id) {
    ui.login[id] = { step: "auth", url: null };
    draw();
    try {
      let r = await post(accPath(id, "connect"), { accountId: id });
      if (r.state === "waiting") {
        ui.login[id] = { step: "auth", url: r.url };
        draw();
        window.open(r.url, "_blank", "noopener");
        for (let i = 0; i < 30 && r.state === "waiting"; i++) {
          if (ui.login[id]?.step !== "auth") return; // 被取消
          r = await post(accPath(id, "connect"), { accountId: id, timeoutMs: 20000 });
        }
      }
      if (r.state !== "connected") throw new Error("等了很久还没有授权完成");
      await succeed(id);
    } catch (err) {
      // 后端说「没有应用凭证」不是授权失败，是还没填：直接摆出填写表单，不再给一个点不动的死路。
      if (/应用凭证/.test(String(err.message))) {
        ui.credsMissingIds.add(id);
        delete ui.login[id];
        ui.credOpen = id;
        ui.cred.note = "";
        await refresh().catch(() => draw());
        toast("先填应用凭证，再 Connect");
        return;
      }
      // 只留后端给的原因；不在文案里教人点一个页面上并不存在的按钮。
      fail(id, `没连上：${err.message}`);
    }
  }

  /** 扫码：二维码由发布机取回，显示在账号那一行下面。 */
  async function startQr(id) {
    stopPoll(id);
    ui.login[id] = { step: "qr", qr: null, text: "正在取二维码…" };
    draw();
    try {
      const r = await post(accPath(id, "login/qr"), { accountId: id });
      if (r.state === "failed") return fail(id, r.note ?? "取不到二维码：可以改用短信验证码，或在发布机上打开登录窗口。");
      ui.login[id] = { step: "qr", qr: r.qr ?? null, text: r.qr ? "" : (r.note ?? "正在确认登录…") };
      draw();
      startPoll(id);
    } catch (err) {
      fail(id, `取不到二维码：${err.message}`);
    }
  }

  /** 在发布机上打开登录窗口：第三种方式，只有这种方式要人回来点一下。 */
  async function startWindow(id) {
    const a = acc(id);
    stopPoll(id);
    ui.login[id] = { step: "win", text: "正在打开登录窗口…" };
    draw();
    try {
      await post(accPath(id, "login/open"), { accountId: id });
      ui.login[id] = { step: "win", text: `登录窗口已经在发布机「${machineName()}」上打开。${a?.platform === "xiaohongshu" ? QR_HINT : "登录完这里会自动认出来；认不出来就点右边的按钮。"}` };
      draw();
      startPoll(id);
    } catch (err) {
      fail(id, `打不开登录窗口：${err.message}`);
    }
  }

  async function startLogin(id, method) {
    const a = acc(id);
    if (!a) return;
    if (publisherOffline()) return toast(OFFLINE_SAY);
    // 新接入的账号也会走到这里：缺凭证时先让人填，而不是打开发起不了的授权页再报「没连上」。
    if (credsMissing(a)) {
      ui.credOpen = id;
      delete ui.login[id];
      ui.cred.note = "";
      draw();
      document.getElementById("cred-key")?.focus();
      return;
    }
    // 平台信息没读到：不猜、也不发起一次必然会失败的授权。
    if (credsUnknown(a)) return toast("读不到平台信息，刷新页面再试");
    if (OFFICIAL[a.platform]) return connectOfficial(id);
    if (!platformInfo(a.platform)) return fail(id, `${machineName()}上没有装 ${labelOf(a.platform)} 的组件，账号已登记但没法登录。`);
    const how = method ?? (QR_OK(a.platform) ? "qr" : "win");
    if (how === "qr") return startQr(id);
    if (how === "sms") { stopPoll(id); ui.login[id] = { step: "sms1" }; draw(); document.getElementById("sms-phone")?.focus(); return; }
    return startWindow(id);
  }

  /** 短信：手机号和验证码只经过这个页面的输入框，转给发布机；不存、不进地址栏、不写进页面状态。 */
  async function smsSend(id, resend = false) {
    const lg = ui.login[id];
    if (resend) {
      try { await post(accPath(id, "login/resend"), { accountId: id }); ui.login[id] = { ...lg, text: "新验证码已发送，用最新一条。", bad: false }; }
      catch (err) { ui.login[id] = { ...lg, text: err.message, bad: true }; }
      return draw();
    }
    const phone = (document.getElementById("sms-phone")?.value ?? "").trim();
    if (!/^\d{11}$/.test(phone)) { ui.login[id] = { ...lg, text: "手机号要填 11 位数字" }; return draw(); }
    ui.login[id] = { ...lg, busy: true, text: "" }; draw();
    try {
      await post(accPath(id, "login/start"), { accountId: id, phone });
      ui.login[id] = { step: "sms2", masked: `${phone.slice(0, 3)}****${phone.slice(-4)}` };
    } catch (err) {
      ui.login[id] = { step: "sms1", text: err.message };
    }
    draw();
    document.getElementById(ui.login[id]?.step === "sms2" ? "sms-code" : "sms-phone")?.focus();
  }

  async function smsVerify(id) {
    const lg = ui.login[id];
    const code = (document.getElementById("sms-code")?.value ?? "").trim();
    if (!/^\d{4,8}$/.test(code)) { ui.login[id] = { ...lg, text: "验证码是 4–8 位数字", bad: true }; return draw(); }
    ui.login[id] = { ...lg, busy: true, text: "正在登录…", bad: false }; draw();
    try {
      await post(accPath(id, "login/verify"), { accountId: id, code });
      await succeed(id);
    } catch (err) {
      ui.login[id] = { ...lg, busy: false, text: err.message, bad: true };
      draw();
    }
  }

  // ── 接入账号 / 账号组 / 应用凭证 ───────────────────────────────────────────
  async function addAccount() {
    const group = VK.current();
    const name = ui.addName.trim();
    const say = (t, bad = true) => { ui.addNote = t; ui.addBad = bad; draw(); };
    if (!ui.addPlatform) return say("先选一个平台");
    // 名字规则（非空、≤40 字）只在 core 一处；这里不再另加「不许和组名同名 / 不许同名」之类的限制。
    ui.addBusy = true; ui.addNote = ""; draw();
    try {
      const isOfficial = Boolean(OFFICIAL[ui.addPlatform]);
      const body = { platform: ui.addPlatform, name: isOfficial ? name.replace(/^@/, "") : name, group: group.id, ...(isOfficial ? { handle: name.startsWith("@") ? name : `@${name}` } : {}) };
      const r = await post("/api/accounts", body);
      ui.addName = ""; ui.addBusy = false; ui.addNote = ""; ui.addBad = false;
      await refresh();
      if (r.existed) return toast("这个账号已经在组里了");
      await startLogin(r.id);
    } catch (err) {
      ui.addBusy = false;
      say(/占用|已经在账号组/.test(err.message) ? `${err.message}（换号要先退出登录，再把旧账号移走）` : err.message);
    }
  }

  async function groupAction(fn, okMsg) {
    ui.groupBusy = true; ui.groupNote = ""; draw();
    try {
      await fn();
      ui.groupBusy = false;
      if (okMsg) toast(okMsg);
      return true;
    } catch (err) {
      ui.groupBusy = false; ui.groupNote = err.message; draw();
      return false;
    }
  }

  async function saveCreds() {
    const c = ui.cred;
    c.bad = false; c.note = "";
    if (!c.key.trim() || !c.secret.trim()) { c.bad = true; c.note = `${OFFICIAL[acc(ui.credOpen)?.platform]?.idName ?? "client key"} 和 client secret 都要填`; return draw(); }
    c.busy = true; draw();
    try {
      const savedId = ui.credOpen;
      const platform = acc(savedId)?.platform ?? "tiktok-api";
      const path = { "tiktok-api": "/api/platforms/tiktok-api/credentials", youtube: "/api/platforms/youtube/credentials" }[platform];
      await post(path, { platform, clientKey: c.key.trim(), clientSecret: c.secret.trim() });
      ui.credsMissingIds.delete(savedId);
      c.key = ""; c.secret = ""; c.busy = false; c.note = ""; ui.credOpen = null;
      toast("应用凭证已保存，可以 Connect 了");
      await refresh();
    } catch (err) {
      c.busy = false; c.bad = true; c.note = `没保存：${err.message}`; draw();
    }
  }

  // ── 现在更新 / 自动更新 ──────────────────────────────────────────────────
  /** 点了之后这一行显示「正在更新…」；服务会重启，所以轮询时读不到是正常的，回来后看版本变没变。 */
  async function updateNow() {
    const u = ui.update;
    ui.updNote = "";
    ui.upd = { from: u?.commit ?? u?.display ?? null, since: Date.now() };
    draw();
    try {
      await post("/api/update", {});
    } catch (err) {
      ui.upd = null; ui.updNote = err.message; return draw();
    }
    let ticks = 0, reads = 0;
    const timer = setInterval(async () => {
      ticks++;
      let s = null;
      try { s = await VK.request("/api/update"); reads++; } catch { /* 服务正在重启 */ }
      const done = (fn) => { clearInterval(timer); ui.upd = null; fn?.(); refresh(); };
      if (s) {
        const changed = (s.commit ?? s.display) !== ui.upd?.from;
        if (changed) return done(() => toast(`已更新到 ${s.display}`));
        if (s.lastFailure && s.lastFailure.at >= (ui.upd?.since ?? 0)) return done(() => toast("没更新成功，已回到原来的版本；原因在「最近出的问题」里"));
        if (!s.inProgress && reads >= 4) return done(() => { ui.updNote = "没有更新：已经是最新版本，或者现在不能更新。"; });
      }
      if (ticks > Math.round(270e3 / (POLL_MS * 1.5))) done(() => { ui.updNote = "更新还没完成，过一会儿回来看版本有没有变。"; });
    }, POLL_MS * 1.5);
  }

  // ── 事件 ────────────────────────────────────────────────────────────────
  main.addEventListener("input", (e) => {
    const t = e.target;
    if (t.id === "add-name") ui.addName = t.value;
    else if (t.id === "acc-rename-input") ui.renameAccName = t.value;
    else if (t.id === "ng-name") ui.newGroupName = t.value;
    else if (t.id === "cred-key") ui.cred.key = t.value;
    else if (t.id === "cred-secret") ui.cred.secret = t.value;
    else if (t.id === "relay-url" && ui.relayForm) ui.relayForm.url = t.value;
    else if (t.id === "relay-token" && ui.relayForm) ui.relayForm.token = t.value;
    else if (t.id === "pe-days" && ui.planEdit) ui.planEdit.delayDays = t.value;
    else if (t.id === "ct-time" && ui.checktime) { ui.checktime.value = t.value; ui.checktime.dirty = true; ui.checktime.note = ""; const save = main.querySelector("[data-ctsave]"); if (save) save.disabled = !t.value || t.value === ui.checktime.time; }
  });
  main.addEventListener("change", (e) => {
    const t = e.target;
    if (t.id === "add-platform") ui.addPlatform = t.value;
    else if (t.id === "pe-kind" && ui.planEdit) ui.planEdit.kind = t.value;
    else if (t.id === "pe-lang" && ui.planEdit) ui.planEdit.language = t.value;
    else if (t.dataset?.fson) {
      const kind = t.dataset.fson;
      t.disabled = true;
      fsCall("settings", { [kind]: t.checked })
        .then(() => toast(t.checked ? "已打开" : kind === "confirm" ? "已关闭：要你确认的只在网页的「今天」里做" : "已关闭"))
        .catch((err) => { ui.fsNote = `没改成：${err.message}`; })
        .finally(() => refresh());
    }
    else if (t.dataset?.pePf && ui.planEdit) {
      const set = new Set(ui.planEdit.platforms);
      if (t.checked) set.add(t.dataset.pePf); else set.delete(t.dataset.pePf);
      ui.planEdit.platforms = [...set];
    }
  });
  main.addEventListener("keydown", (e) => {
    if (e.key !== "Enter") return;
    // 输入法组字时回车是「上屏」，不是提交（拼音打英文按回车会把字母连同空格存成名字）。
    if (e.isComposing || e.keyCode === 229) return;
    const id = e.target.id;
    if (id === "add-name") { e.preventDefault(); addAccount(); }
    else if (id === "acc-rename-input") { e.preventDefault(); main.querySelector("[data-accrenamesave]")?.click(); }
    else if (id === "ng-name") { e.preventDefault(); main.querySelector("[data-ngsave]")?.click(); }
    else if (id === "rename-input") { e.preventDefault(); main.querySelector("[data-renamesave]")?.click(); }
    else if (id === "cred-secret") { e.preventDefault(); saveCreds(); }
    else if (id === "sms-phone") { e.preventDefault(); main.querySelector("[data-smssend]")?.click(); }
    else if (id === "sms-code") { e.preventDefault(); main.querySelector("[data-smsgo]")?.click(); }
    else if (id === "relay-token") { e.preventDefault(); main.querySelector("[data-relaysave]")?.click(); }
  });
  const CLICKABLE = "[data-tab],[data-sw],[data-login],[data-loginmode],[data-smssend],[data-smsresend],[data-smsgo],[data-done],[data-cancel],[data-add],[data-credopen],[data-credcancel],[data-credsave],[data-newg],[data-ngsave],[data-ngcancel],[data-accrename],[data-accrenamesave],[data-accrenamecancel],[data-rename],[data-renamesave],[data-renamecancel],[data-plan],[data-planadd],[data-plansave],[data-plancancel],[data-planremove],[data-planreset],[data-retry],[data-autoupd],[data-updnow],[data-updnoteok],[data-notes],[data-relayadd],[data-relaycancel],[data-relaysave],[data-relayask],[data-relayno],[data-relayoff],[data-logout],[data-logoutyes],[data-logoutno],[data-switch],[data-switchyes],[data-switchno],[data-ctsave],[data-ipx],[data-fs],[data-cloud-action]";
  main.addEventListener("click", async (e) => {
    const b = e.target.closest(CLICKABLE);
    if (!b) return;
    const d = b.dataset;
    if (d.tab) {
      ui.tab = d.tab;
      history.replaceState(null, "", `#tab=${ui.tab}`);
      draw();
    } else if (d.cloudAction) {
      await changeCloud(d.cloudAction);
    } else if ("sw" in d) {
      e.preventDefault();
      try { await VK.useGroup(d.sw); location.reload(); } catch (err) { toast(`没切过去：${err.message}`); }
    } else if (d.switch) { ui.switchAsk = d.switch; ui.logoutAsk = null; draw(); }
    else if ("switchno" in d) { ui.switchAsk = null; draw(); }
    else if (d.switchyes) {
      const id = d.switchyes;
      ui.switchAsk = null; stopPoll(id); delete ui.login[id]; delete ui.switchedTo[id];
      try {
        await post(accPath(id, "switch"), { accountId: id });
        ui.switched[id] = true;
        toast("已清掉旧号的登录数据，现在登录要接的号");
        await refresh();
        await startLogin(id);
      } catch (err) { toast(`没换成：${err.message}`); await refresh(); }
    } else if (d.logout) { ui.logoutAsk = d.logout; ui.switchAsk = null; draw(); }
    else if ("logoutno" in d) { ui.logoutAsk = null; draw(); }
    else if (d.logoutyes) {
      const id = d.logoutyes;
      ui.logoutAsk = null; stopPoll(id); delete ui.login[id]; delete ui.switched[id]; delete ui.switchedTo[id];
      try { await post(accPath(id, "logout"), { accountId: id }); toast("已退出登录，现在可以重新登录另一个号"); }
      catch (err) { toast(`没退出成功：${err.message}`); }
      await refresh();
    } else if ("ctsave" in d) {
      const ct = ui.checktime;
      ct.busy = true; ct.note = ""; ct.bad = false; draw();
      try { const r = await post("/api/login-check/time", { time: ct.value }); ui.checktime = { time: r.time, value: r.time, busy: false, note: r.note, bad: false }; toast(r.note); }
      catch (err) { ct.busy = false; ct.bad = true; ct.note = err.message; }
      draw();
    } else if (d.login) startLogin(d.login);
    else if (d.loginmode) startLogin(d.id, d.loginmode);
    else if (d.smssend) smsSend(d.smssend);
    else if (d.smsresend) smsSend(d.smsresend, true);
    else if (d.smsgo) smsVerify(d.smsgo);
    else if (d.done) { const id = d.done; ui.login[id] = { ...ui.login[id], text: "正在检查登录状态…" }; draw(); confirm(id, { manual: true }); }
    else if (d.cancel) {
      const id = d.cancel;
      stopPoll(id); delete ui.login[id]; draw();
      post(accPath(id, "login/cancel"), { accountId: id }).catch(() => {});
    }
    else if ("add" in d) addAccount();
    else if (d.credopen) { ui.credOpen = d.credopen; ui.cred.note = ""; draw(); document.getElementById("cred-key")?.focus(); }
    else if ("credcancel" in d) { ui.credOpen = null; draw(); }
    else if ("credsave" in d) saveCreds();
    else if ("newg" in d) { ui.newGroup = true; draw(); document.getElementById("ng-name")?.focus(); }
    else if ("ngcancel" in d) { ui.newGroup = false; ui.groupNote = ""; ui.newGroupName = ""; draw(); }
    else if ("ngsave" in d) {
      const name = ui.newGroupName.trim();
      if (!name) { ui.groupNote = "请填账号组名称"; return draw(); }
      if (await groupAction(() => VK.addGroup(name), `已新建「${name}」并切到它`)) { location.reload(); }
    } else if (d.plan != null) {
      const r = ui.plan.rows[Number(d.plan)];
      ui.planNote = "";
      ui.planEdit = { i: Number(d.plan), kind: r.kind, language: r.language, platforms: r.platforms.map((p) => p.platform).filter((p) => ui.plan.installedPlatforms.some((x) => x.platform === p)), delayDays: r.delayDays };
      draw();
    } else if ("planadd" in d) {
      ui.planNote = "";
      ui.planEdit = { isNew: true, kind: "video", language: "*", platforms: ui.plan.groupPlatforms.map((p) => p.platform), delayDays: 0 };
      draw();
    } else if ("plancancel" in d) { ui.planEdit = null; ui.planNote = ""; draw(); }
    else if ("plansave" in d) savePlanRow();
    else if ("planremove" in d) {
      const ed = ui.planEdit;
      try { await post("/api/plan", { group: VK.current().id, kind: ed.kind, language: ed.language, remove: true }); ui.planEdit = null; toast("已删掉这一行"); await refresh(); }
      catch (err) { ui.planNote = err.message; draw(); }
    } else if ("planreset" in d) {
      try { await post("/api/plan/reset", { group: VK.current().id }); ui.planEdit = null; toast("已恢复默认方案"); await refresh(); }
      catch (err) { toast(`没恢复：${err.message}`); }
    } else if (d.autoupd) {
      ui.updBusy = true; draw();
      try { await post("/api/update", { auto: d.autoupd }); toast(d.autoupd === "on" ? "已打开后台自动更新" : "已关闭后台自动更新"); }
      catch (err) { toast(`没切过去：${err.message}`); }
      ui.updBusy = false;
      await refresh();
    } else if ("updnow" in d) updateNow();
    else if ("updnoteok" in d) { ui.updNote = ""; draw(); }
    else if ("notes" in d) { ui.notesOpen = !ui.notesOpen; draw(); }
    else if ("relayadd" in d) { ui.relayForm = { url: "", token: "", busy: false, note: "" }; draw(); document.getElementById("relay-url")?.focus(); }
    else if ("relaycancel" in d) { ui.relayForm = null; draw(); }
    else if ("relaysave" in d) {
      const f = ui.relayForm;
      if (!f.url.trim() || !f.token.trim()) { f.note = "地址和令牌都要填"; return draw(); }
      f.busy = true; f.note = ""; draw();
      try {
        const r = await post("/api/relay/connect", { url: f.url.trim(), token: f.token.trim() });
        ui.relayForm = null;
        toast(r.warning ? "已保存，但暂时没连上中转，网络通了会自动连" : "已接入中转，作品送来后在「今天」等你确认");
        await refresh();
      } catch (err) { f.busy = false; f.note = err.message; draw(); }
    }
    else if (d.ipx) await ipAction(d.ipx);
    else if (d.fs) await fsAction(d.fs);
    else if ("relayask" in d) { ui.relayAsk = true; draw(); }
    else if ("relayno" in d) { ui.relayAsk = false; draw(); }
    else if ("relayoff" in d) {
      ui.relayAsk = false;
      try { await post("/api/relay/disconnect", {}); toast("已断开中转，已经入库的作品不受影响"); }
      catch (err) { toast(`没断开：${err.message}`); }
      await refresh();
    } else if (d.retry) {
      ui.retrying.add(d.retry); draw();
      try { await post(`/api/publishes/${encodeURIComponent(d.retry)}/retry`, { publishId: d.retry }); toast("正在重试"); }
      catch (err) { toast(`没重试成功：${err.message}`); }
      ui.retrying.delete(d.retry);
      await refresh();
    } else if (d.accrename) {
      const a = acc(d.accrename);
      ui.renamingAcc = d.accrename; ui.renameAccName = a?.display_name || a?.handle || ""; ui.renameAccNote = "";
      draw(); document.getElementById("acc-rename-input")?.select();
    } else if ("accrenamecancel" in d) { ui.renamingAcc = null; ui.renameAccNote = ""; draw(); }
    else if (d.accrenamesave) {
      const id = d.accrenamesave;
      ui.renameAccBusy = true; ui.renameAccNote = ""; draw();
      try {
        await post(accPath(id, "rename"), { accountId: id, name: ui.renameAccName });
        ui.renamingAcc = null; ui.renameAccBusy = false;
        toast("已改名（只改 VerseKit 里的名字，不影响平台）");
        await refresh();
      } catch (err) {
        ui.renameAccBusy = false; ui.renameAccNote = err.message; draw();
        document.getElementById("acc-rename-input")?.focus();
      }
    } else if (d.rename) { ui.renaming = d.rename; ui.groupNote = ""; draw(); document.getElementById("rename-input")?.select(); }
    else if ("renamecancel" in d) { ui.renaming = null; draw(); }
    else if (d.renamesave) {
      const name = document.getElementById("rename-input")?.value.trim();
      if (!name) return toast("组名不能为空");
      if (await groupAction(() => VK.renameGroup(d.renamesave, name), "已改名")) { ui.renaming = null; await refresh(); }
    }
  });

  async function fsAction(act) {
    ui.fsNote = "";
    if (act === "connect") return fsConnect();
    if (act === "drop") { ui.fsDrop = true; return draw(); }
    if (act === "keep") { ui.fsDrop = false; return draw(); }
    ui.fsBusy = true; draw();
    try {
      if (act === "off") { await fsCall("skip"); toast("好的，不用飞书；要你确认的只在网页上"); }
      else if (act === "cancel") { ui.fsPaused = true; await fsCall("app/create/cancel"); }
      else if (act === "drop-ok") { ui.fsDrop = false; await fsCall("unbind"); toast("已断开，不再往飞书发卡片"); }
      else if (act === "test") { await fsCall("test"); toast("测试卡片已发出，去飞书里看一眼"); }
    } catch (err) { ui.fsNote = `没做成：${err.message}`; }
    ui.fsBusy = false;
    await refresh();
  }

  // ── 启动 ────────────────────────────────────────────────────────────────
  VK.ready()
    .then(load)
    .then(() => {
      draw();
      void cloudTick();
      const params = new URLSearchParams(location.search);
      if (params.get("platform") && ui.platforms.some((p) => p.platform === params.get("platform"))) { ui.addPlatform = params.get("platform"); draw(); }
      const hash = location.hash.slice(1);
      if (hash === "add") { document.getElementById("addrow")?.scrollIntoView({ block: "center" }); document.getElementById("add-name")?.focus(); }
      else if (hash === "problems") document.getElementById("problems")?.scrollIntoView();
    })
    .catch((err) => { main.innerHTML = `<div class="hd"><h1>系统</h1></div><div class="note bad">读不到数据：${esc(err.message)}。后台服务可能没在运行。</div>`; });
})();
</script>
</body>
</html>
