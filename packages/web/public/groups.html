<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>选择账号组 · versekit</title>
<link rel="stylesheet" href="/app.css">
<style>
/* 入口页：没有外壳导航，只有一个任务——选一个工作区，或新建一个。 */
.entry{min-height:100svh;display:flex;align-items:center;justify-content:center;padding:40px 20px}
.entry-card{width:100%;max-width:560px}
.entry-head{margin-bottom:6px;font-size:12px;color:var(--faint);letter-spacing:.08em}
.entry h1{font-size:28px}
.entry .sub{margin-top:8px}
.group-list{display:flex;flex-direction:column;gap:10px;margin-top:22px}
.group-btn{display:flex;align-items:center;gap:14px;width:100%;min-height:72px;padding:14px 16px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);font-family:var(--sans);text-align:left;cursor:pointer}
.group-btn:hover{border-color:var(--navy)}
.group-btn:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.group-btn[aria-current="true"]{border-color:var(--navy);box-shadow:inset 3px 0 0 var(--navy)}
.group-mark{display:grid;place-items:center;width:40px;height:40px;flex:none;border-radius:8px;background:var(--navy);color:#fff;font-size:14px;font-weight:650}
.group-main{flex:1;min-width:0}
.group-name{display:block;font-size:14px;font-weight:650;letter-spacing:-.01em}
.group-meta{display:block;margin-top:3px;color:var(--muted);font-size:12px}
.group-go{flex:none;color:var(--muted);font-size:12px}
.new-group{margin-top:22px;padding-top:18px;border-top:1px solid var(--line-soft)}
.new-group .field-label{margin-bottom:6px;display:block}
.inline-form{display:flex;gap:10px}
.inline-form .input{flex:1}
.entry-note{margin-top:18px}
.empty-groups{padding:16px;border:1px dashed var(--line);border-radius:8px;color:var(--muted);font-size:13px}
</style>
</head>
<body data-page="groups">
<main class="entry">
  <div class="entry-card">
    <p class="entry-head">VERSEKIT / 本地控制台</p>
    <h1>选择账号组</h1>
    <p class="sub">一个账号组就是一套独立的账号、发布与数据。进入后可在左侧随时切换。</p>

    <div class="group-list" id="groups" aria-live="polite">
      <div class="empty-groups">正在读取账号组…</div>
    </div>

    <div class="new-group">
      <label class="field-label" for="new-name">新建账号组</label>
      <form class="inline-form" id="new-form">
        <input class="input" id="new-name" placeholder="例如：剪辑日记、出海实测" autocomplete="off" maxlength="64">
        <button class="btn primary" type="submit" id="new-submit">创建并进入</button>
      </form>
      <p class="hint" id="new-error" style="margin-top:8px" role="alert" hidden></p>
    </div>

    <p class="entry-note hint">账号组只影响“看哪些数据、发到哪些账号”，不会把凭证传到别处；凭证仍只在这台电脑。</p>
  </div>
</main>
<script src="/api.js"></script>
<script src="/shell.js"></script>
<script>
(function(){
  const box = document.getElementById('groups');
  const form = document.getElementById('new-form');
  const input = document.getElementById('new-name');
  const submit = document.getElementById('new-submit');
  const err = document.getElementById('new-error');

  function showError(message){
    err.hidden = false;
    err.textContent = message;
  }
  function clearError(){
    err.hidden = true;
    err.textContent = '';
  }

  // 组摘要只读 bootstrap 快照里的 numbers；不在浏览器里重新算口径。
  function summary(g){
    const slots = (g.account_count ?? 0) + ' / 5 个平台已接入';
    const works = g.counts?.works ?? 0;
    const publishes = g.counts?.publishes ?? 0;
    const failing = g.freshness?.failing ?? 0;
    const stale = g.freshness?.stale ?? 0;
    const parts = [slots, works + ' 个作品', publishes + ' 条平台发布'];
    if (failing) parts.push(failing + ' 个账号登录异常');
    else if (stale) parts.push(stale + ' 个账号超过 1 小时未采集');
    else if ((g.account_count ?? 0) > 0) parts.push('登录正常');
    else parts.push('还没有账号');
    return parts.join(' · ');
  }

  function mark(name){
    return String(name || '?').trim().slice(0, 2) || '?';
  }

  async function enter(group, button){
    clearError();
    const label = button.querySelector('.group-go');
    const before = label ? label.textContent : '';
    if (label) label.textContent = '正在进入…';
    button.disabled = true;
    try {
      await VK.useGroup(group.id);
      location.assign('/');
    } catch (ex) {
      button.disabled = false;
      if (label) label.textContent = before;
      showError('进不去这个账号组：' + ex.message);
      button.focus();
    }
  }

  function render(){
    const groups = VK.groups();
    const current = VK.current();
    box.innerHTML = '';

    if (!groups.length) {
      const empty = document.createElement('div');
      empty.className = 'empty-groups';
      empty.textContent = '还没有账号组。先在下面新建一个，再开始接入账号。';
      box.appendChild(empty);
      return;
    }

    groups.forEach(function(g){
      const btn = document.createElement('button');
      btn.className = 'group-btn';
      btn.type = 'button';
      btn.setAttribute('aria-current', current && current.id === g.id ? 'true' : 'false');
      btn.innerHTML =
        '<span class="group-mark"></span>' +
        '<span class="group-main"><span class="group-name"></span><span class="group-meta"></span></span>' +
        '<span class="group-go"></span>';
      btn.querySelector('.group-mark').textContent = mark(g.name);
      btn.querySelector('.group-name').textContent = g.name;
      btn.querySelector('.group-meta').textContent = summary(g);
      btn.querySelector('.group-go').textContent = current && current.id === g.id ? '当前 · 进入 →' : '进入 →';
      btn.addEventListener('click', function(){ enter(g, btn); });
      box.appendChild(btn);
    });
  }

  form.addEventListener('submit', async function(e){
    e.preventDefault();
    clearError();
    const name = input.value.trim();
    if (!name) {
      showError('请填写账号组名称');
      input.focus();
      return;
    }
    submit.disabled = true;
    submit.textContent = '正在创建…';
    try {
      // group.add 在服务端「创建并进入」：建完即成为当前组，空组也能直接进去（ACC-groups-02）。
      await VK.addGroup(name);
      location.assign('/');
    } catch (ex) {
      showError('建组失败：' + ex.message);
      input.focus();
    } finally {
      submit.disabled = false;
      submit.textContent = '创建并进入';
    }
  });

  VK.bootstrap()
    .then(function(){
      render();
      input.focus();
    })
    .catch(function(ex){
      box.innerHTML = '';
      const failed = document.createElement('div');
      failed.className = 'empty-groups';
      failed.textContent = '读不到账号组：' + ex.message + '（守护进程在跑吗？终端执行 vk serve）';
      box.appendChild(failed);
    });
})();
</script>
</body>
</html>
