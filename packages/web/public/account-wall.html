<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>账号 · versekit</title>
<link rel="stylesheet" href="/app.css">
<style>
/* 单组账号页：五个平台槽位；接入的显示状态，未接入的显示缺口与添加入口 */
.slots{display:flex;flex-direction:column;margin-top:14px;overflow:hidden;border:1px solid var(--line);border-radius:8px;background:var(--paper)}
.slot{display:grid;grid-template-columns:minmax(170px,1.05fr) minmax(112px,.62fr) minmax(196px,1.15fr) minmax(150px,.9fr) auto;gap:14px;align-items:center;padding:13px 16px;border-bottom:1px solid var(--line-soft)}
.slot:last-child{border-bottom:0}
.slot.connected{cursor:pointer}
.slot.connected:hover{background:var(--paper-subtle)}
/* 「详情」切到哪一行必须一眼可见：整行着色 + 左侧粗色条 + 账号名变深，
   不能只靠详情面板里一行小字。 */
.slot.selected{background:#eef4fb;box-shadow:inset 3px 0 0 var(--navy)}
.slot.selected .slot-name{color:var(--navy)}
.slot.selected .slot-sub{color:var(--navy)}
.slot-who{display:flex;align-items:center;gap:10px;min-width:0}
.plogo{width:22px;height:22px;flex:none;border-radius:4px}
.slot-name{display:block;font-size:14px;font-weight:650;line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot-sub{display:block;margin-top:2px;color:var(--muted);font-size:12px;line-height:1.4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot-col{min-width:0}
.slot-k{display:none;color:var(--faint);font-size:12px}
.slot-v{font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums;color:var(--ink);line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot-m{margin-top:2px;color:var(--muted);font-size:12px;line-height:1.4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot .pubm{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.slot-act{display:flex;justify-content:flex-end;gap:8px}
.slot.empty .slot-act{justify-content:flex-end}
.gap-text{color:var(--faint);font-size:13px}
.nav .nav-pending{display:flex;align-items:center;min-height:42px;padding:0 12px;border-radius:6px;color:var(--nav-muted);font-size:14px;opacity:.6;cursor:default}

.detail{margin-top:14px;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:16px 18px 17px}
.detail-head{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;padding-bottom:12px;border-bottom:1px solid var(--line-soft);flex-wrap:wrap}
.detail-location{color:var(--faint);font-size:12px}
.detail-title{margin-top:2px;font-size:18px;font-weight:650;letter-spacing:-.015em}
.detail-issue{margin-top:4px;color:var(--muted);font-size:13px}
.detail-issue.bad{color:var(--red)}.detail-issue.warn{color:var(--amber)}
.detail-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.detail-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px;padding-top:12px}
.fact-label{margin-bottom:5px;color:var(--faint);font-size:12px}
.fact-value{font-size:13px;font-weight:500}
.fact-value.mono{font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums}
.fact-meta{margin-top:3px;color:var(--muted);font-size:12px;line-height:1.45}
.detail-note{margin-top:12px}
.toast{position:fixed;right:20px;bottom:20px;z-index:20;max-width:min(420px,calc(100vw - 40px));padding:10px 14px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink);font-size:13px;line-height:1.5}
.toast.bad{border-color:var(--red-line);background:var(--red-bg);color:var(--red);cursor:pointer}

@media (max-width:1100px){
  .slot{grid-template-columns:minmax(150px,1fr) minmax(110px,.7fr) minmax(140px,.9fr) auto}
  .col-collect{display:none}
}
/* 当前账号组是这一页的作用域，必须比标题更显眼：
   下拉直接切组，旁边就是「改名」；表单就地展开，不跳页、不打断手上的事。 */
.title-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.group-hero{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
/* 账号组是这一页的作用域：做成带边框的标签，比标题更抢眼，点开就能切。 */
.group-select{font:600 16px/1.2 var(--sans);color:var(--navy);background:#eef4fb;border:1px solid #cfe0f2;border-radius:999px;padding:7px 30px 7px 14px;cursor:pointer;max-width:min(420px,60vw);appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--navy) 50%),linear-gradient(135deg,var(--navy) 50%,transparent 50%);background-position:calc(100% - 15px) 16px,calc(100% - 10px) 16px;background-size:5px 5px,5px 5px;background-repeat:no-repeat}
.group-select:hover,.group-select:focus{background-color:#e3edfa;border-color:var(--navy)}
.group-rename{min-height:32px;padding:0 10px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--muted);font-size:12px;cursor:pointer}
.group-rename:hover{border-color:var(--navy);color:var(--navy)}
.group-rename-form{margin:6px 0 8px;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--paper);max-width:520px}
.rename-row{display:flex;gap:8px;align-items:center;margin-top:6px}
.rename-row .input{flex:1;min-width:0}
@media (max-width:900px){
  .slot{grid-template-columns:minmax(0,1fr) auto;gap:8px 12px;padding:14px}
  .slot-col{grid-column:1/-1}
  .slot-k{display:block;margin-bottom:1px}
  .slot-act{grid-row:1;grid-column:2;align-self:start}
  .slot-act .btn{min-height:40px}
  .gap{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%}
  .gap .btn{min-height:40px}
  .detail-grid{grid-template-columns:1fr;gap:12px}
  .fact{padding-bottom:10px;border-bottom:1px solid var(--line-soft)}.fact:last-child{border-bottom:0;padding-bottom:0}
  .detail-actions{width:100%}.detail-actions .btn{flex:1;min-height:40px}
  .nav .nav-pending{min-height:40px;padding:0}
}
</style>
</head>

<script>
(function(){
  const $ = (id) => document.getElementById(id);
  const esc = (value) => String(value ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const two = (n) => String(n).padStart(2, "0");
  /* 状态文案只认 /api/accounts 的 state 字段，页面不再按采集新鲜度或到期时间自己推断。
   * 这正是一致性口径（ACC-account-04）：接口 state=ok 时页面只能显示「正常」。 */
  const STATE_LEVEL = { expiring: "warn", expired: "bad", banned: "bad" };
  const STATE_TEXT = { ok: "正常", manual: "仅手动", expiring: "即将过期", expired: "已失效", banned: "已封禁" };
  const PUBLISH_STATES = {
    queued: "排队中", auto_running: "发布中", draft_running: "生成草稿中", draft_pending: "待确认草稿",
    notify_pending: "待人工确认", published: "已发布", published_limited: "仅自己可见", failed: "失败", blocked: "受阻", canceled: "已取消"
  };
  const COLLECT_SOURCES = { intercept: "创作中心", api: "官方 API", csv: "CSV 导入", web: "网页" };
  const COLLECT_STATUSES = { ok: "成功", success: "成功", failed: "失败", error: "失败", empty: "没有数据" };

  let selected = null;
  let toastTimer = null;
  /* 每个账号一次登录确认：重复点「重新登录」时旧轮询自动作废，不会两个循环抢着写反馈。
   * 值只存在页面内存里；刷新页面后登录窗口还在，重新点一次即可。 */
  const verifyTokens = new Map();

  function formatTime(ts){
    if(!ts) return "";
    const d = new Date(Number(ts));
    return two(d.getMonth() + 1) + "-" + two(d.getDate()) + " " + two(d.getHours()) + ":" + two(d.getMinutes());
  }

  function timeAgo(ts){
    if(!ts) return "";
    const diff = Math.max(0, Date.now() - Number(ts));
    if(diff < 60e3) return "刚刚";
    const minutes = Math.round(diff / 60e3);
    if(minutes < 60) return minutes + " 分钟前";
    const hours = Math.round(minutes / 60);
    if(hours < 24) return hours + " 小时前";
    return Math.round(hours / 24) + " 天前";
  }

  // 详情标题要能区分「同组两个平台都叫同一个名字」：平台名 + 账号名，缺一不可。
  // handle 可能为空（历史数据），退回 display_name / id，绝不显示空白标题。
  function accountName(account){
    return String(account?.handle ?? "").trim() || String(account?.display_name ?? "").trim() || String(account?.id ?? "");
  }

  function accountTitle(account, column){
    return (column?.label ?? account?.platform ?? "账号") + " · " + accountName(account);
  }

  function inViewport(element){
    if(!element || element.hidden) return true;
    const rect = element.getBoundingClientRect();
    return rect.top >= 0 && rect.bottom <= window.innerHeight;
  }

  // 点了「详情」/主动作后，结果必须在人眼前。已经可见就不打扰，避免每次轮询都抖一下。
  function reveal(element, block){
    if(!element || element.hidden || inViewport(element)) return;
    element.scrollIntoView({ block: block || "nearest", behavior: "smooth" });
  }

  // 登录异常只看账号状态：采集新鲜度是另一条口径，不能混成一个"坏"。
  function levelOf(account){
    return account ? (STATE_LEVEL[account.state] ?? "") : "";
  }

  function statusText(account){
    if(!account) return "";
    return STATE_TEXT[account.state] ?? String(account.state);
  }

  // 槽位上的状态是 state 的唯一投影：warn / bad 用徽标，ok 用绿点，其余（如 manual）用灰标。
  function statusHtml(account){
    const level = levelOf(account);
    const text = esc(statusText(account));
    if(level) return '<span class="badge ' + level + '">' + text + "</span>";
    if(account.state === "ok") return '<span class="status-ok"><i></i>' + text + "</span>";
    return '<span class="badge mute">' + text + "</span>";
  }

  function statusSub(account, level){
    if(level === "bad") return "发布与采集已暂停";
    if(level === "warn") return "建议提前续期";
    return account.is_manual || account.state === "manual" ? "仅手动发布" : "运行中";
  }

  function issueOf(account){
    const level = levelOf(account);
    const text = statusText(account);
    if(level === "bad"){
      const last = account.lastCollectedAt ? " · 最近成功采集 " + formatTime(account.lastCollectedAt) : "";
      return text + " · 发布与采集暂停" + last;
    }
    if(level === "warn"){
      if(Number.isInteger(account.expires_at)){
        const hours = Math.round((Number(account.expires_at) - Date.now()) / 3600e3);
        if(hours > 0) return text + " · 登录 " + hours + " 小时后过期 · 到期将自动暂停发布与采集";
      }
      return text + " · 到期将自动暂停发布与采集";
    }
    return text + (account.is_manual || account.state === "manual" ? " · 仅手动发布" : " · 发布与采集运行中");
  }

  function publishCell(account){
    const publish = account.lastPublish;
    if(!publish) return { value: "还没有发布", meta: "可以从发布台发出第一条作品" };
    return {
      value: formatTime(publish.at),
      meta: "《" + (publish.title ?? "未命名") + "》 · " + (PUBLISH_STATES[publish.state] ?? publish.state)
    };
  }

  function collectCell(account){
    const collection = account.collection;
    if(!collection) return { value: "还没有采集", meta: "发布成功后才有指标可采" };
    return {
      value: timeAgo(collection.at),
      meta: (COLLECT_SOURCES[collection.source] ?? collection.source ?? "来源未知") + " · " + (COLLECT_STATUSES[collection.status] ?? collection.status)
    };
  }

  // 主动作必须指向这个具体账号：失效/将过期→重新登录；正常→切换自动/仅手动。
  function primaryOf(account){
    const level = levelOf(account);
    if(level){
      const platform = VK.platformOf(account)?.platform;
      const bilibili = platform === "bilibili";
      return {
        label: "重新登录",
        primary: true,
        // B站不再把「去终端跑 biliup」当等价命令：登录窗口就是页面开的，命令只留在 add.html 的
        // 高级折叠项里。这里的 cmd 仅在详情面板显示，B站直接隐藏整格。
        cmd: bilibili ? "页面扫码登录（无需终端）" : "vk account reauth " + account.id,
        run: () => VK.reauthAccount(account.id),
        feedback: (result) => bilibili || platform === "xiaohongshu"
          ? "登录窗口已打开：完成登录后页面会自动确认；没确认成功不会显示「已完成」。"
          : (result?.next ?? "登录窗口已打开，按提示完成。")
      };
    }
    const mode = account.is_manual ? "auto" : "manual";
    return {
      label: account.is_manual ? "恢复自动发布" : "改为仅手动",
      primary: false,
      cmd: "vk account mode " + account.id + " " + mode,
      run: () => VK.setAccountMode(account.id, mode),
      feedback: () => account.is_manual ? "已恢复自动发布" : "已改为仅手动：自动发布会跳过这个账号"
    };
  }

  function toast(message, bad){
    const el = $("toast");
    el.textContent = message;
    el.className = "toast" + (bad ? " bad" : "");
    el.hidden = false;
    // 失败/需要人动手的说明不能 4 秒就消失：留在原地，点一下才关。
    el.title = bad ? "点击关闭" : "";
    el.onclick = () => { el.hidden = true; clearTimeout(toastTimer); };
    clearTimeout(toastTimer);
    toastTimer = null;
    if(!bad) toastTimer = setTimeout(() => { el.hidden = true; }, 4200);
  }

  function feedback(element, message, bad){
    const changed = element.hidden || element.textContent !== (message ?? "");
    element.hidden = !message;
    element.textContent = message ?? "";
    element.className = "notice detail-note" + (bad ? " bad" : "");
    // 反馈在详情面板底部，面板可能已经在首屏之外；内容真正变化时滚到人眼前。
    // 用 center 而不是 nearest：nearest 会把元素正好停在视口底边，子像素下仍有一截被裁掉
    // （实测距底 0.5px，人看到的是「反馈被切了」）。center 在页面底部会自然夹到最大滚动位置，
    // 整条反馈稳定落在视口内。同一条扫码提示每 2 秒重写一次时不重复滚动，避免把人拽来拽去。
    if(message && changed) reveal(element, "center");
  }

  function busy(button, pending, label){
    button.disabled = pending;
    if(label) button.textContent = pending ? "正在处理…" : label;
  }

  const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

  /* 重新登录：接口只负责打开登录窗口，成功与否必须由 login.status + check 确认。
   * 小红书和 B站都走同一条路（与 add.html 一致，不新增命令），只有 check 说 ok 才刷新成「正常」。
   * 没确认成功时页面绝不写「重新登录完成」，失败原因和重试入口都留在详情面板里。
   *
   * 小红书注意：点 account.reauth 只会打开登录页，不会在服务端登记登录会话，所以
   * login.status 在登录完成前先回 idle 是正常的——继续等，不能把「还没开始」当成「失败」。
   * B站的 idle 则明确是「登录窗口没打开」，直接给出重试提示。 */
  async function verifyLogin(accountId){
    const account = VK.account(accountId);
    const platform = VK.platformOf(account)?.platform ?? account?.platform;
    const label = VK.platformOf(account)?.label ?? platform;
    const deadline = Date.now() + 300e3;
    // 重复点「重新登录」时只认最后一次：旧循环下一拍看到 token 变了就退出，不会两个循环抢写反馈。
    const token = (verifyTokens.get(accountId) ?? 0) + 1;
    verifyTokens.set(accountId, token);
    const live = () => verifyTokens.get(accountId) === token;
    // 人可能切去看另一个账号；旧账号的进度不能写到别人的详情面板里。
    const say = (message, bad) => { if(selected === accountId) feedback($("d-feedback"), message, bad); };
    let lastNote = "";
    say("登录窗口已打开：请在" + label + "窗口里完成登录；页面会自动确认，没确认成功不会显示「已完成」。", false);
    while(Date.now() < deadline){
      let status;
      try{
        status = await VK.request("/api/accounts/" + encodeURIComponent(accountId) + "/login/status", {
          method: "POST",
          body: { accountId },
        });
      }catch(err){
        if(!live()) return false;
        say("读取登录状态失败：" + err.message + "。可点「重新登录」再试。", true);
        toast("读取登录状态失败：" + err.message, true);
        return false;
      }
      if(!live()) return false;

      if(status.state === "ok"){
        say("已拿到登录信息，正在确认登录状态…", false);
        try{
          const check = await VK.request("/api/accounts/" + encodeURIComponent(accountId) + "/check", {
            method: "POST",
            body: { accountId },
          });
          if(check.state === "ok"){
            verifyTokens.delete(accountId);
            // 先刷新快照再渲染：徽标、主动作都必须和库里的 account.state 一致。
            await VK.ready({ force: true });
            render();
            say("重新登录完成：登录状态已确认「正常」，页面已更新。", false);
            toast("重新登录完成：账号已恢复正常");
            return true;
          }
          say("登录没完成：" + (check.detail ?? check.state) + "。可点「重新登录」再试。", true);
          toast("登录未完成：" + (check.detail ?? check.state), true);
          return false;
        }catch(err){
          if(!live()) return false;
          say("登录信息已保存，但确认失败：" + err.message + "。可点「重新登录」再试。", true);
          toast("登录未完成：" + err.message, true);
          return false;
        }
      }

      if(status.state === "failed" || (status.state === "idle" && platform === "bilibili")){
        say(status.note ?? "没有检测到登录完成。点「重新登录」再试。", true);
        toast("登录未完成", true);
        return false;
      }

      /* pending 与小红书登录完成前的 idle：继续每 2 秒确认一次，直到成功或明确失败。
       * 小红书的 idle 不是失败——account.reauth 打开的窗口不登记服务端内存登录会话，
       * 所以登录完成前 login/status 先回 idle 是正常的。这里写自己的说明，不照抄服务端
       * 那句会让人再去点一次「打开登录窗口」的 note。 */
      const note = status.state === "pending"
        ? (status.note ?? "等你在浏览器里完成登录…")
        : "等你在浏览器窗口里完成登录…（成功后这里会自动变成「正常」）";
      if(note !== lastNote){
        lastNote = note;
        say(note, false);
      }
      await wait(2000);
    }
    if(!live()) return false;
    say("5 分钟内没有检测到登录完成；登录窗口可能已关闭。点「重新登录」再试。", true);
    toast("登录未完成：还没检测到登录结果", true);
    return false;
  }

  async function runPrimary(accountId){
    const account = VK.account(accountId);
    if(!account) return;
    const action = primaryOf(account);
    const platform = VK.platformOf(account)?.platform;
    // 小红书/B站的登录在页面窗口里完成：点完必须自己轮询确认，不能只弹一句「自动更新」。
    const autoConfirm = action.label === "重新登录" && (platform === "bilibili" || platform === "xiaohongshu");
    const button = $("d-action");
    busy(button, true, action.label);
    try{
      const result = await action.run();
      if(autoConfirm){
        // 窗口已打开、正在等登录：按钮给人明确的等待态，而不是长时间停在「正在处理…」。
        const current = $("d-action");
        if(current && selected === accountId){ current.textContent = "等待登录…"; current.disabled = true; }
        await verifyLogin(accountId);
        return;
      }
      render();
      feedback($("d-feedback"), action.feedback(result), false);
      // 「打开登录窗口」不等于「登录完成」：没有 check 确认就绝不报成功。
      // 只有小红书/B站能自己确认；其余平台的 reauth 只打开页面，必须让人刷新后自查。
      toast(action.label === "重新登录" ? "登录窗口已打开；完成登录后刷新本页查看状态" : action.label + "完成");
    }catch(err){
      feedback($("d-feedback"), action.label + "失败：" + err.message, true);
      toast(action.label + "失败：" + err.message, true);
    }finally{
      // render() 会重建详情内容；按钮可能已经换成新对象，这里按 id 再取一次。
      // 人如果在等登录时切到别的账号，按钮已经属于新账号，不能再按旧账号的主动作改写。
      if(selected === accountId){
        const current = $("d-action");
        if(current) busy(current, false, primaryOf(VK.account(accountId) ?? account).label);
      }
    }
  }

  function select(accountId, scroll){
    const account = VK.account(accountId);
    if(!account){
      $("detail").hidden = true;
      return;
    }
    selected = accountId;
    document.querySelectorAll(".slot.connected").forEach((row) => {
      const active = row.dataset.account === accountId;
      row.classList.toggle("selected", active);
      row.setAttribute("aria-current", active ? "true" : "false");
    });

    const column = VK.platformOf(account);
    const level = levelOf(account);
    const action = primaryOf(account);
    const detail = $("detail");
    detail.hidden = false;
    $("d-location").textContent = (VK.current()?.name ?? "当前账号组") + " · " + (column?.label ?? account.platform);
    // 标题必须带平台名：两个平台同名时，只有「小红书 · X」和「B站 · X」能让人看出切到了谁。
    $("d-title").textContent = accountTitle(account, column);
    detail.setAttribute("aria-label", "账号详情：" + accountTitle(account, column));
    const issue = $("d-issue");
    issue.textContent = issueOf(account);
    issue.className = "detail-issue" + (level ? " " + level : "");

    const publish = publishCell(account);
    const collect = collectCell(account);
    $("d-publish").textContent = publish.value;
    $("d-publish-meta").textContent = publish.meta;
    $("d-collect").textContent = collect.value;
    $("d-collect-meta").textContent = collect.meta;
    $("d-cmd").textContent = action.cmd;
    // B站登录在页面里完成，把「等价命令」整格收起来：它不是必经步骤，也不该在面板底部
    // 伪装成下一步。手动命令只保留在 add.html 的高级折叠项里。
    $("d-cmd-fact").hidden = VK.platformOf(account)?.platform === "bilibili";

    const primary = $("d-action");
    primary.textContent = action.label;
    primary.disabled = false;
    primary.className = "btn" + (action.primary ? " primary" : "");
    primary.onclick = () => runPrimary(accountId);

    const work = $("d-work");
    work.hidden = !account.lastPublish;
    work.href = "/#works";

    feedback($("d-feedback"), "", false);

    if(scroll) reveal(detail, "start");
  }

  /* 槽位是平台列，不是账号行：同一平台只落一个账号。
   * 历史数据里可能同时存在规范名（xiaohongshu）与别名（xhs）两行，此时必须固定挑一个，
   * 否则 find() 会按数据库排序随手命中一行，页面文案就会和 /api/accounts 对不上。 */
  function platformColumns(){
    const seen = new Set();
    return VK.platforms().filter((column) => {
      if(seen.has(column.platform)) return false;
      seen.add(column.platform);
      return true;
    });
  }

  function slotAccount(column, accounts){
    const matches = accounts.filter((a) => VK.platformOf(a)?.platform === column.platform);
    if(!matches.length) return null;
    return matches.slice().sort((a, b) => {
      // 规范平台名优先（别名行是历史重复数据）；再看最近体检时间；最后按 id 稳定排序。
      const exact = (account) => (String(account.platform) === column.platform ? 1 : 0);
      if(exact(a) !== exact(b)) return exact(b) - exact(a);
      const checked = (Number(b.last_checked_at) || 0) - (Number(a.last_checked_at) || 0);
      if(checked) return checked;
      return String(a.id).localeCompare(String(b.id));
    })[0];
  }

  function slotsOf(accounts){
    return platformColumns().map((column) => ({ column, account: slotAccount(column, accounts) }));
  }

  function renderSlots(slots, ambiguousNames, groupName){
    const element = $("slots");
    element.innerHTML = "";
    if(!slots.length){
      const failed = document.createElement("p");
      failed.className = "notice bad";
      failed.textContent = "读不到平台槽位：/api/bootstrap 没有返回矩阵列（守护进程在跑吗？终端执行 vk serve）";
      element.appendChild(failed);
      return;
    }

    slots.forEach(({ column, account }) => {
      if(account){
        const level = levelOf(account);
        const name = accountName(account);
        // 同名账号（包括历史数据里把组名当账号名的那两条）必须在行上就分开：
        // 只显示同名 handle 时，人看到的是两行一模一样的「AssureLane」。
        const ambiguous = ambiguousNames.has(name.toLocaleLowerCase()) ||
          (groupName && name.toLocaleLowerCase() === String(groupName).toLocaleLowerCase());
        const shownName = ambiguous ? column.label + " · " + name : name;
        const row = document.createElement("div");
        row.className = "slot connected" + (selected === account.id ? " selected" : "");
        row.tabIndex = 0;
        row.setAttribute("role", "button");
        row.dataset.account = account.id;
        row.setAttribute("aria-current", selected === account.id ? "true" : "false");
        row.setAttribute("aria-label", column.label + " · " + shownName + " · " + statusText(account));
        row.innerHTML =
          '<div class="slot-who"><svg class="plogo" aria-hidden="true"><use href="#' + esc(column.logo) + '"/></svg>' +
            '<div><span class="slot-name"></span><span class="slot-sub"></span></div></div>' +
          '<div class="slot-col"><span class="slot-k">登录状态</span><span class="slot-status"></span></div>' +
          '<div class="slot-col"><span class="slot-k">最近发布</span><div class="slot-v pub"></div><div class="slot-m pubm"></div></div>' +
          '<div class="slot-col col-collect"><span class="slot-k">最近采集</span><div class="slot-v col"></div><div class="slot-m colm"></div></div>' +
          '<div class="slot-act"></div>';

        row.querySelector(".slot-name").textContent = shownName;
        row.querySelector(".slot-name").title = accountTitle(account, column);
        row.querySelector(".slot-sub").textContent = column.label + " · " + statusSub(account, level);
        row.querySelector(".slot-status").innerHTML = statusHtml(account);

        const publish = publishCell(account);
        const collect = collectCell(account);
        row.querySelector(".pub").textContent = publish.value;
        row.querySelector(".pubm").textContent = publish.meta;
        row.querySelector(".col").textContent = collect.value;
        row.querySelector(".colm").textContent = collect.meta;

        const button = document.createElement("button");
        button.type = "button";
        button.className = "btn sm" + (level ? " primary" : "");
        button.textContent = level ? "重新登录" : "详情";
        button.addEventListener("click", (event) => {
          event.stopPropagation();
          select(account.id, true);
          if(level) runPrimary(account.id);
        });
        row.querySelector(".slot-act").appendChild(button);

        row.addEventListener("click", () => select(account.id, true));
        row.addEventListener("keydown", (event) => {
          if(event.key === "Enter" || event.key === " "){ event.preventDefault(); select(account.id, true); }
        });
        element.appendChild(row);
      } else {
        const row = document.createElement("div");
        row.className = "slot empty";
        row.innerHTML =
          '<div class="slot-who"><svg class="plogo" aria-hidden="true"><use href="#' + esc(column.logo) + '"/></svg>' +
            '<div><span class="slot-name"></span><span class="slot-sub">这个平台还没有接入账号</span></div></div>' +
          '<div class="slot-col"><span class="slot-k">登录状态</span><span class="gap-text">未接入</span></div>' +
          '<div class="gap"><div class="slot-col"><span class="slot-k">接入方式</span><span class="gap-text auth"></span></div>' +
            '<a class="btn sm gap-add"></a></div>';
        row.querySelector(".slot-name").textContent = column.label;
        row.querySelector(".gap .auth").textContent = column.auth;
        const link = row.querySelector(".gap-add");
        link.href = "/accounts/add?platform=" + encodeURIComponent(column.platform);
        link.textContent = "+ 添加" + column.label;
        element.appendChild(row);
      }
    });
  }

  /* 同平台多行是数据问题：唯一索引是按原始 platform 字符串建的，xhs / xiaohongshu
   * 这类别名能绕过去。页面只渲染一个槽位，但要把多余账号写出来，不能悄悄吞掉。 */
  function renderDuplicates(slots, accounts){
    const lead = $("duplicate-lead");
    const groups = slots
      .map(({ column }) => ({ column, accounts: accounts.filter((a) => VK.platformOf(a)?.platform === column.platform) }))
      .filter((group) => group.accounts.length > 1);
    if(!groups.length){
      lead.hidden = true;
      lead.textContent = "";
      return;
    }
    lead.hidden = false;
    lead.textContent = groups
      .map(({ column, accounts }) => column.label + " 有 " + accounts.length + " 个账号（" +
        accounts.map((a) => a.handle + " " + a.id).join("、") + "）")
      .join("；") + "。同一平台只渲染一个槽位；多余的请运行 vk account remove <账号 id> 清理。";
  }

  function renderTodos(accounts){
    const todos = $("todos");
    todos.innerHTML = "";
    const need = accounts
      .map((account) => ({ account, level: levelOf(account), column: VK.platformOf(account) }))
      .filter((item) => item.level);

    if(need.length){
      const strong = document.createElement("strong");
      strong.textContent = "待处理";
      todos.appendChild(strong);
      need.forEach(({ account, level, column }) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "todo-link";
        button.textContent = (column?.label ?? account.platform) + (level === "bad" ? "重登" : "续期");
        button.addEventListener("click", () => {
          select(account.id, true);
          runPrimary(account.id);
        });
        todos.appendChild(button);
      });
      return;
    }

    const hint = document.createElement("span");
    hint.className = "hint";
    hint.textContent = accounts.length ? "这个账号组没有需要处理的事项" : "还没有账号 · 从下面的缺口开始添加";
    todos.appendChild(hint);
  }

  function render(){
    const group = VK.current();
    if(!group) return;
    const accounts = VK.accounts();
    const columns = platformColumns();
    const slots = slotsOf(accounts);
    // 摘要、待处理与详情都只认槽位账号：同平台的重复行不能在页面上变成两个“账号”。
    const connected = slots.map((slot) => slot.account).filter(Boolean);
    const bad = connected.filter((a) => levelOf(a) === "bad").length;
    const warn = connected.filter((a) => levelOf(a) === "warn").length;

    // 注意别叫 select：页面里 select(id) 是「选中某个账号」的函数，同名会把它覆盖掉。
    const groupSelect = $("group-select");
    if(groupSelect){
      groupSelect.innerHTML = VK.groups().map((g) => '<option value="' + g.id + '">' + g.name + '</option>').join("");
      groupSelect.value = group.id;
    }
    $("add-btn").href = "/accounts/add";

    const parts = [connected.length + " / " + (columns.length || 5) + " 个平台已接入"];
    if(!connected.length) parts.push("还没有账号");
    else {
      if(bad) parts.push(bad + " 个登录异常");
      if(warn) parts.push(warn + " 个即将过期");
      if(!bad && !warn) parts.push("登录正常");
    }
    $("sub").textContent = parts.join(" · ");

    const checked = connected.map((a) => Number(a.last_checked_at) || 0);
    const latest = checked.length ? Math.max(...checked) : 0;
    $("check-cadence").textContent = latest ? "最近体检 " + formatTime(latest) + " · 每 6 小时" : "还没有体检记录 · 每 6 小时自动体检";

    const lead = $("empty-lead");
    if(!connected.length){
      lead.hidden = false;
      lead.textContent = "这个账号组还没有接入任何账号。从下面任意一个平台的缺口开始，添加后会出现在这里。";
    } else {
      lead.hidden = true;
      lead.textContent = "";
    }

    renderDuplicates(slots, accounts);
    renderTodos(connected);
    // 同一个显示名出现多次（或直接用了组名）时，行上要加平台前缀，否则两行看起来一模一样。
    const displayNames = connected.map((a) => accountName(a).toLocaleLowerCase());
    const ambiguousNames = new Set(displayNames.filter((name, index) => displayNames.indexOf(name) !== index));
    renderSlots(slots, ambiguousNames, group.name);

    const keep = selected && connected.some((a) => a.id === selected)
      ? selected
      : (connected.find((a) => levelOf(a) === "bad") ?? connected.find((a) => levelOf(a) === "warn") ?? connected[0])?.id ?? null;
    if(keep) select(keep, false);
    else { selected = null; $("detail").hidden = true; }
  }

  /* 移除账号 = 命令 account.remove：只让出组内平台槽位，不删历史发布。
   * 这里不走「先点详情再确认」的两段式：按钮本来就在详情里，点的人已经选好了账号。 */
  async function runRemove(accountId){
    const account = VK.account(accountId);
    if(!account) return;
    const button = $("d-remove");
    const label = "移除 " + (account.display_name || account.handle || account.id) + "？组内这个平台槽位会空出来，历史发布仍保留。";
    if(!window.confirm(label)) return;
    button.disabled = true;
    const original = button.textContent;
    button.textContent = "正在移除…";
    try{
      await VK.removeAccount(accountId);
      selected = null;
      render();
      toast("账号已移除");
    }catch(err){
      feedback($("d-feedback"), "移除失败：" + err.message, true);
      toast("移除失败：" + err.message, true);
    }finally{
      const current = $("d-remove");
      current.disabled = false;
      current.textContent = original;
    }
  }

  /* 当前组是这一页的作用域：切组 = group.use，改名 = group.rename。
   * 两者都不跳页：改完就地重渲染，手上的账号列表跟着变。 */
  function wireGroupControls(){
    const select = $("group-select");
    if(select){
      select.addEventListener("change", async () => {
        select.disabled = true;
        try{
          await VK.useGroup(select.value);
          selected = null;
          render();
        }catch(err){
          toast("切换失败：" + err.message, true);
        }finally{
          select.disabled = false;
        }
      });
    }
    const form = $("rename-form");
    const input = $("rename-input");
    const err = $("rename-error");
    const open = () => {
      input.value = VK.current()?.name ?? "";
      err.hidden = true;
      form.hidden = false;
      input.focus();
      input.select();
    };
    $("group-rename").addEventListener("click", open);
    $("rename-cancel").addEventListener("click", () => { form.hidden = true; });
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const name = input.value.trim();
      if(!name){ err.hidden = false; err.textContent = "组名不能为空"; return; }
      const save = $("rename-save");
      save.disabled = true; save.textContent = "正在保存…";
      try{
        await VK.renameGroup(VK.currentId(), name);
        form.hidden = true;
        render();
        toast("已改名为 " + name);
      }catch(error){
        err.hidden = false;
        err.textContent = String(error.message);
      }finally{
        save.disabled = false; save.textContent = "保存";
      }
    });
  }

  function boot(){
    $("d-remove").addEventListener("click", () => { if(selected) runRemove(selected); });
    wireGroupControls();
    VK.ready()
      .then(() => {
        if(!VK.current()){ location.replace("/groups.html"); return; }
        render();
      })
      .catch((err) => {
        $("sub").textContent = "读不到账号数据";
        const slots = $("slots");
        slots.innerHTML = "";
        const notice = document.createElement("p");
        notice.className = "notice bad";
        notice.textContent = "读不到账号数据：" + err.message + "（守护进程在跑吗？终端执行 vk serve）";
        slots.appendChild(notice);
      });
  }

  boot();
})();
</script>
</body>
</html>
