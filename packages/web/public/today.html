<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>今天 · versekit</title>
<link rel="stylesheet" href="/app.css">
<style>
.focus{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:28px;padding:22px}
.fh{grid-column:1/-1;display:flex;align-items:center;gap:12px;padding-bottom:14px;border-bottom:1px solid var(--line2);flex-wrap:wrap}
.fh .t{display:inline-flex;align-items:center;min-height:32px;font-size:18px;font-weight:700;letter-spacing:-.01em;color:inherit;text-decoration:none;min-width:0;overflow-wrap:anywhere}
.fh .t:hover{text-decoration:underline}
.prog{margin-left:auto;font-size:13px;color:var(--ink2)}
.others{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:14px}
.oth{display:flex;gap:12px;align-items:center;padding:12px 14px;background:var(--paper);border:1px solid var(--line);border-radius:12px;min-width:0}
.oth.bad{background:var(--bad-bg);border-color:var(--bad-line)}
.oth .t{font-weight:600}
.oth .bd{min-width:0}
.oth .bd .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.oth .a{margin-left:auto;display:flex;gap:8px;flex:none}
.oth .why{color:var(--bad);overflow-wrap:anywhere}
.calm{padding:36px 28px}
.calm h3{margin-bottom:4px}
.side h2{margin-bottom:6px}
@media (max-width:1040px){.focus{grid-template-columns:minmax(0,1fr)}.others{grid-template-columns:minmax(0,1fr)}}
@media (max-width:560px){.oth{flex-wrap:wrap}.oth .a{margin-left:0}}
</style>
</head>
<body data-page="today">
<div class="app">
  <nav class="nav" aria-label="主导航"><div class="brand"><i></i>versekit</div>
    <a class="nv" href="today.html" data-key="today" aria-current="page">今天<b data-todo hidden></b></a>
    <a class="nv" href="works.html" data-key="works">作品</a>
    <a class="nv" href="data.html" data-key="data">数据</a>
    <a class="nv" href="system.html" data-key="system">系统</a></nav>
  <main id="main"><div class="panel empty">正在读今天的待办…</div></main>
</div>
<script src="/api.js"></script>
<script src="/shell.js"></script>
<script src="/panel.js"></script>
<script>
(async function () {
  const VK = window.VK;
  const main = document.getElementById("main");
  const state = { data: null, focusId: null, cutId: null, cache: new Map(), editing: new Set(), opened: new Set(), ver: new Map() };
  const { esc, BLANK, pfBadge, pfName, when, fmt, ratioText, ratioCls, WD, pending, cutHasPending, fallback, confirmPanel, cutSteps } = window.VKPanel(state);

  async function loadWork(id) {
    if (!id) return null;
    if (!state.cache.has(id)) state.cache.set(id, (await VK.work(id)).work);
    return state.cache.get(id);
  }

  function pickCut(work, prefer = null) {
    if (!work) return null;
    if (prefer && work.cuts.some((c) => c.id === prefer && cutHasPending(c))) return prefer;
    return (work.cuts.find(cutHasPending) ?? work.cuts[0])?.id ?? null;
  }

  async function refresh({ advance = false } = {}) {
    state.data = await VK.today();
    state.cache.clear();
    state.editing.clear();
    const awaiting = state.data.awaiting ?? [];
    if (!awaiting.some((w) => w.workId === state.focusId)) state.focusId = awaiting[0]?.workId ?? null;
    const work = await loadWork(state.focusId);
    // 确认完一支就自动跳到这一支里下一支还没处理的；这支都处理完了就停在它上面（还有小红书要单独点）。
    state.cutId = pickCut(work, advance ? null : state.cutId);
    render();
  }


  function upcomingBox(scheduled) {
    const list = scheduled.slice(0, 7).map((r) => `<div class="nx"><b>${esc(when(r.scheduledAt).text)}</b>${pfBadge(r.platform)}` +
      `<span class="ti" title="${esc(r.workTitle)}">${esc(r.workTitle)}</span></div>`).join("");
    return `<div class="sidebox"><h2>接下来要发 · 你确认过的</h2>${scheduled.length ? "" : '<div class="sub">还没有确认过的。</div>'}${list}` +
      `${scheduled.length > 7 ? `<div class="sub" style="padding-top:4px">还有 ${scheduled.length - 7} 条在后面</div>` : ""}</div>`;
  }

  function render() {
    const data = state.data;
    const current = VK.current();
    if (!data) return;
    const scheduled = data.scheduled ?? [];
    const awaiting = data.awaiting ?? [];
    const problems = data.problems ?? [];
    const work = state.focusId ? state.cache.get(state.focusId) : null;
    const cut = work?.cuts.find((c) => c.id === state.cutId) ?? work?.cuts[0] ?? null;
    const left = work ? work.cuts.filter(cutHasPending) : [];
    const heading = `${new Date().getMonth() + 1} 月 ${new Date().getDate()} 日 ${WD[new Date().getDay()]}`;

    let focus = "";
    if (work && cut) {
      const multi = work.cuts.length > 1;
      const done = work.cuts.length - left.length;
      const total = work.cuts.reduce((n, c) => n + pending(c).length, 0);
      focus = `<div class="panel focus"><div class="fh"><span class="st ${left.length ? "wait" : "done"}"></span>` +
        `<a class="t" href="/work?id=${encodeURIComponent(work.id)}">${esc(work.title)}</a>` +
        `<span class="sub">${esc(when(work.createdAt).day)} 入库</span>` +
        `<span class="prog">${left.length ? (multi ? `${done} / ${work.cuts.length} 支成片已处理，还有 ${total} 条等你` : `${total} 条等你确认`) : "都处理完了"}</span></div>` +
        confirmPanel(work, cut) +
        `<div>${cutSteps(work, cut.id)}${upcomingBox(scheduled)}</div></div>`;
    } else if (awaiting.length) {
      focus = `<div class="panel calm"><h3>正在读这条作品的成片…</h3></div>`;
    } else {
      focus = `<div class="panel calm"><h3>今天没有要你处理的</h3><div class="sub">${
        scheduled.length
          ? `接下来 ${scheduled.length} 条已经确认过，会按时间发。最近一条：${esc(when(scheduled[0].scheduledAt).text)}，${esc(pfName(scheduled[0].platform))}。`
          : "没有等确认的，也没有排着要发的。新作品入库后会出现在这里。"
      }</div></div>`;
    }

    const others = awaiting.filter((w) => w.workId !== state.focusId);
    const more = others.map((w) => {
      const pend = w.cuts.flatMap((c) => c.publishes.filter((p) => p.state === "pending_confirm"));
      const n = pend.length;
      const x = pend[0];
      if (n === 1 && x.platform === "xiaohongshu") {
        const t = when(x.scheduledAt);
        return `<div class="oth"><span class="st wait"></span><img class="cv" src="${BLANK}" width="52" height="39" alt="">` +
          `<div class="bd"><div class="t">${esc(w.title)}</div><div class="sub">小红书 · 建议${esc(t.text)} · 不确认就不发</div></div>` +
          `<div class="a"><button class="btn" type="button" data-solo="manual" data-pub="${esc(x.publishId)}">我自己发</button>` +
          `<button class="btn pri" type="button" data-solo="approve" data-pub="${esc(x.publishId)}">${esc(t.t || "按建议时间")} 发</button></div></div>`;
      }
      return `<div class="oth"><span class="st wait"></span><img class="cv" src="${BLANK}" width="52" height="39" alt="">` +
        `<div class="bd"><div class="t">${esc(w.title)}</div><div class="sub">${n} 条等你确认</div></div>` +
        `<div class="a"><a class="btn pri" href="/work?id=${encodeURIComponent(w.workId)}">去确认</a></div></div>`;
    }).join("");
    const badOnes = problems.map((p) => `<div class="oth bad"><span class="st bad"></span><img class="cv" src="${BLANK}" width="52" height="39" alt="">` +
      `<div class="bd"><div class="t">${esc(p.workTitle)}</div><div class="sub why">${esc(pfName(p.platform))}：${esc(p.error?.message ?? "没有发出去，原因还没记下来")}</div></div>` +
      `<div class="a"><a class="btn" href="/work?id=${encodeURIComponent(p.workId)}${p.cutId ? "&cut=" + encodeURIComponent(p.cutId) : ""}">看经过</a>` +
      `<button class="btn pri" type="button" data-retry="${esc(p.publishId)}">再试一次</button></div></div>`).join("");
    const groupRows = (data.others ?? []).map((o) => `<div class="oth" style="margin-top:14px"><span class="st wait"></span>` +
      `<div class="bd"><div class="t">账号组「${esc(o.group.name)}」里还有 ${o.total} 件事等你</div>` +
      `<div class="sub">这一页只显示当前账号组${current ? "「" + esc(current.name) + "」" : ""}的内容</div></div>` +
      `<div class="a"><button class="btn" type="button" data-group="${esc(o.group.id)}">切过去</button></div></div>`).join("");

    const results = (data.results ?? []).slice(0, 5).map((r) => {
      const q = r.multiple;
      const width = q == null ? 0 : Math.min(100, q * 40);
      const verdict = q == null ? "还没法比" : esc(r.verdictLabel ?? "");
      const verdictTitle = q == null ? ` title="${esc(r.reason ?? "")}"` : "";
      const typ = q == null ? '<span class="sub">—</span>'
        : `<div class="typ ${ratioCls(q)}" role="img" aria-label="${ratioText(q)}，${verdict}" title="竖线是这个账号最近 20 条的中位数"><i style="width:${width}%"></i><u></u></div>`;
      return `<tr><td><a class="wcell" href="/work?id=${encodeURIComponent(r.workId)}${r.cutId ? "&cut=" + encodeURIComponent(r.cutId) : ""}">` +
        `<img class="cv" src="${BLANK}" width="48" height="36" alt=""><span><b>${esc(r.workTitle)}</b>` +
        `<span class="sub">${esc(r.cutTitle ?? "")}${r.cutTitle ? " · " : ""}${esc(when(r.publishedAt).day)} 发</span></span></a></td>` +
        `<td><span class="pfn">${pfBadge(r.platform)}${esc(pfName(r.platform))}</span></td>` +
        `<td class="n">${fmt(r.play24h)}</td><td class="n sub">${fmt(r.baselineMedian)}</td><td>${typ}</td>` +
        `<td class="n"><span class="x ${ratioCls(q)}">${ratioText(q)}</span><div class="sub"${verdictTitle}>${verdict}</div></td></tr>`;
    }).join("");

    main.innerHTML =
      `<div class="hd"><h1>今天</h1><span class="sub">${heading}${current ? " · " + esc(current.name) : ""}</span></div>` +
      (current ? "" : `<div class="panel empty">还没有账号组。<a class="link" href="/system#groups">先建一个账号组 →</a></div>`) +
      focus +
      `<div class="others" ${more || badOnes ? "" : "hidden"}>${more}${badOnes}</div>` +
      groupRows +
      `<h2 class="sec">最近结果 · 发布 24 小时的播放，和这个账号最近 20 条的中位数比</h2>` +
      (results
        ? `<div class="tblwrap"><table><thead><tr><th>作品</th><th>平台</th><th class="n">24 小时播放</th><th class="n">平时</th><th>对比</th><th class="n">结论</th></tr></thead><tbody>${results}</tbody></table></div><div class="sub" style="padding-top:8px"><a class="link" href="data.html">看全部 →</a></div>`
        : '<div class="panel empty">发布满 24 小时后，这里会出现每条和平时的对比。</div>') +
      `<div class="cmd">对应命令：<code>vk today</code>　没确认的到时间也不会发；小红书每条单独确认。</div>`;

    for (const video of main.querySelectorAll("video[data-media]")) {
      video.addEventListener("error", () => {
        video.outerHTML = fallback(video.dataset.label || "这支成片", "这个文件在这台电脑上读不到，或浏览器不能播放它");
      }, { once: true });
    }
  }

  let busy = false;
  async function act(fn, okMessage, { advance = false } = {}) {
    if (busy) return;
    busy = true;
    try {
      await fn();
      if (okMessage) window.VKShell?.toast(okMessage);
      await refresh({ advance });
    } catch (err) {
      window.VKShell?.toast(err.message || "没成功");
    } finally {
      busy = false;
    }
  }

  main.addEventListener("click", (event) => {
    const el = event.target.closest("[data-cut],[data-edit],[data-more],[data-save],[data-confirm],[data-skip],[data-solo],[data-retry],[data-ver],[data-group]");
    if (!el) return;
    const d = el.dataset;

    if (d.cut) { state.cutId = d.cut; render(); return; }

    if (d.edit) { state.editing.add(d.edit); render(); return; }
    if (d.more) { state.opened.has(d.more) ? state.opened.delete(d.more) : state.opened.add(d.more); render(); return; }

    if (d.save) {
      const pub = d.save;
      const title = main.querySelector(`[data-title="${pub}"]`)?.value ?? null;
      const at = main.querySelector(`[data-at="${pub}"]`)?.value ?? null;
      // 正文、话题只在改过时才传：没动就不写进这条平台稿，免得把入库时的文案固定住。
      const changed = (sel) => { const f = main.querySelector(sel); return f && f.value !== f.defaultValue ? f.value : null; };
      const body = changed(`[data-body="${pub}"]`);
      const tags = changed(`[data-tags="${pub}"]`);
      act(async () => {
        await VK.editPublish(pub, { title, at: at || null, body, tags });
        state.editing.delete(pub);
        state.opened.add(pub);
      }, "改好了，确认时按新的发");
      return;
    }

    if (d.ver) {
      const [cutId, versionId] = d.ver.split(":");
      state.ver.set(cutId, versionId);
      render();
      return;
    }

    if (d.confirm) { act(() => VK.approveCut(d.confirm), "已确认，会按时间发", { advance: true }); return; }
    if (d.skip) { act(() => VK.skipCut(d.skip), "好，这支先不发", { advance: true }); return; }
    if (d.retry) { act(() => VK.retryPublish(d.retry), "正在重试"); return; }
    if (d.solo && d.pub) {
      const map = { approve: VK.approvePublish, now: VK.publishNow, manual: VK.publishManual };
      const done = { approve: "小红书这条已确认", now: "好，现在就发这一条", manual: "好，这条你自己发" };
      act(() => map[d.solo](d.pub), done[d.solo], { advance: true });
      return;
    }
    if (d.group) {
      act(async () => { await VK.useGroup(d.group); location.reload(); });
    }
  });

  try {
    await VK.ready();
    await refresh();
  } catch (err) {
    main.innerHTML = `<div class="hd"><h1>今天</h1></div><div class="panel empty">读不到今天的待办：${esc(err.message)}</div>` +
      `<div class="cmd">守护进程没起？在电脑上运行 <code>vk serve --open</code>。</div>`;
  }
})();
</script>
</body>
</html>
