<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>作品 · versekit</title>
<link rel="stylesheet" href="/app.css">
</head>
<body data-page="works">
<div class="app">
  <nav class="nav" aria-label="主导航"><div class="brand"><i></i>versekit</div>
    <a class="nv" href="today.html" data-key="today">今天<b data-todo hidden></b></a>
    <a class="nv" href="works.html" data-key="works" aria-current="page">作品</a>
    <a class="nv" href="data.html" data-key="data">数据</a>
    <a class="nv" href="system.html" data-key="system">系统</a></nav>
  <main id="main">
    <div class="hd"><h1>作品</h1><span class="sub" id="count"></span></div>
    <div class="bar"><div class="seg" id="seg" role="group" aria-label="按状态筛选"></div><input type="search" id="q" placeholder="搜标题" aria-label="搜标题"></div>
    <div id="list"><div class="panel loading">正在读作品…</div></div>
    <div class="legend"><span><span class="pf dy">抖</span>实心：这个平台已发布</span><span><span class="pf dy off">抖</span>空心：还没发</span><span><span class="pf dy err">抖</span>红色：出了问题</span><span>"最好的一条"是和那个账号自己的平时比，不同平台之间不比较。</span></div>
    <div class="cmd">对应命令：<code>vk work list</code>　入库：<code>vk work add 视频.mp4</code></div>
  </main>
</div>
<script src="/api.js"></script>
<script src="/shell.js"></script>
<script src="/panel.js"></script>
<script>
(async function () {
  const VK = window.VK;
  const { esc, cover, pfOf, ORDER, pfBadge, when, ratioText, ratioCls } = window.VKPanel({ editing: new Set(), ver: new Map() });

  const PROBLEM = new Set(["failed", "blocked", "expired"]);
  const PUBLISHED = new Set(["published", "published_limited"]);
  const AWAITING = new Set(["pending_confirm", "notify_pending", "draft_pending"]);
  const SCHEDULED = new Set(["queued", "auto_running", "draft_running"]);
  const FIL = [["all", "全部"], ["awaiting_confirm", "等你确认"], ["scheduled", "排着要发"], ["done", "都发完了"], ["problem", "有问题"]];
  const state = { works: [], filter: "all", q: "" };
  const keyOf = (w) => w.status?.key ?? "none";
  const count = (w, set) => (w.platformList ?? []).filter((p) => set.has(p.state)).length;

  /** 现在的状态：和设计稿一致，带数量；数量只来自这个作品的平台稿状态。 */
  function stateText(w) {
    switch (keyOf(w)) {
      case "problem": return ["bad", `有 ${count(w, PROBLEM)} 条出了问题`];
      case "awaiting_confirm": return ["wait", `${count(w, AWAITING)} 条等你确认`];
      case "scheduled": return ["sched", `${count(w, SCHEDULED)} 条已确认，等时间`];
      case "done": return ["pub", "都发完了"];
      default: return ["", w.status?.label ?? ""];
    }
  }

  /** 平台图标三态：出了问题（红）> 已发（实心，部分已发时提示几条）> 还没发（空心）。 */
  function chips(w) {
    const by = new Map();
    for (const p of w.platformList ?? []) {
      if (!by.has(p.platform)) by.set(p.platform, []);
      by.get(p.platform).push(p);
    }
    const keys = [...by.keys()].sort((a, b) => (ORDER.indexOf(a) + 1 || 99) - (ORDER.indexOf(b) + 1 || 99));
    return keys.map((k) => {
      const xs = by.get(k);
      const bad = xs.some((x) => PROBLEM.has(x.state));
      const pubd = xs.filter((x) => PUBLISHED.has(x.state)).length;
      const tip = bad ? "出了问题" : pubd === xs.length ? "已发布" : pubd ? `已发 ${pubd} / ${xs.length}` : "还没发";
      const [ch, name, cls] = pfOf(k);
      return `<span class="pf ${cls} ${bad ? "err" : pubd ? "" : "off"}" title="${esc(name)}：${tip}" role="img" aria-label="${esc(name)}：${tip}">${esc(ch)}</span>`;
    }).join("");
  }

  function best(w) {
    const compared = w.compared ?? [];
    const published = count(w, PUBLISHED) > 0;
    if (!compared.length) return `<span class="sub">${published ? "还没法比" : "还没有结果"}</span>`;
    const top = compared.reduce((a, b) => (b.multiple > a.multiple ? b : a));
    return `<span class="pfn">${pfBadge(top.platform)}<span class="x ${ratioCls(top.multiple)}">${ratioText(top.multiple)}</span></span><div class="sub">${esc(top.verdictLabel ?? "")}</div>`;
  }

  function draw() {
    const q = state.q.toLowerCase();
    const rows = state.works.filter((w) => (state.filter === "all" || keyOf(w) === state.filter) && w.title.toLowerCase().includes(q));
    const current = VK.current();
    document.getElementById("count").textContent = `${current ? current.name + " · " : ""}${state.works.length} 个作品`;
    document.getElementById("seg").innerHTML = FIL.map(([k, name]) => {
      const c = k === "all" ? state.works.length : state.works.filter((w) => keyOf(w) === k).length;
      return `<button type="button" data-f="${k}" aria-pressed="${k === state.filter}">${name}${c && k !== "all" ? " " + c : ""}</button>`;
    }).join("");
    document.getElementById("list").innerHTML = rows.length
      ? `<div class="tblwrap"><table><thead><tr><th>作品</th><th>现在</th><th>平台</th><th>最好的一条</th><th class="n">入库</th></tr></thead><tbody>${rows.map((w) => {
          const [cls, txt] = stateText(w);
          return `<tr><td><a class="wcell" href="/work?id=${encodeURIComponent(w.id)}">${cover(w.coverVersionId, 64, 48)}` +
            `<span><b>${esc(w.title)}</b><span class="sub">${w.cuts > 1 ? w.cuts + " 支成片 · " : ""}${w.publishes} 条平台稿</span></span></a></td>` +
            `<td><span class="st ${cls}">${esc(txt)}</span></td><td><div class="pfs">${chips(w)}</div></td><td>${best(w)}</td><td class="n sub">${esc(when(w.createdAt).day)}</td></tr>`;
        }).join("")}</tbody></table></div>`
      : `<div class="panel empty">${
          !state.works.length ? "这个账号组里还没有作品。入库后会出现在这里。"
            : state.q ? `没有标题里带"${esc(state.q)}"的作品。` : "这个状态下没有作品。"
        } ${state.works.length ? '<button class="link" type="button" data-f="all">看全部</button>' : ""}</div>`;
  }

  document.addEventListener("click", (e) => {
    const b = e.target.closest("[data-f]");
    if (!b) return;
    state.filter = b.dataset.f;
    if (state.filter === "all") { state.q = ""; document.getElementById("q").value = ""; }
    draw();
  });
  document.getElementById("q").addEventListener("input", (e) => { state.q = e.target.value.trim(); draw(); });

  try {
    await VK.ready();
    state.works = (await VK.works()).works ?? [];
    draw();
  } catch (err) {
    document.getElementById("list").innerHTML = `<div class="panel empty">读不到作品：${esc(err.message)}</div>`;
    document.getElementById("seg").innerHTML = "";
  }
})();
</script>
</body>
</html>
