<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>作品 · versekit</title>
<link rel="stylesheet" href="app.css">
<style>
.bar{display:flex;gap:12px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.bar input{margin-left:auto;width:220px}
.pfs{display:flex;gap:4px;flex-wrap:wrap}
.pf.pf.off{background:none;border:1px solid var(--ctl);color:var(--ink2)}
.pf.pf.err{background:var(--bad);border-color:transparent;color:#fffffe}
.legend{margin-top:10px;font-size:12px;color:var(--ink2);display:flex;gap:16px;flex-wrap:wrap;align-items:center}
.legend span{display:inline-flex;gap:6px;align-items:center}
.cv.ph{width:64px;height:48px}
.first{padding:28px;display:grid;gap:10px;max-width:640px}
.first p{margin:0}
/* 日历：周 / 月。最小单位是一条平台稿；不用新颜色，状态沿用 .st 的四种点 */
.views{margin-left:auto}
.calnav{display:flex;gap:8px;align-items:center}
.calnav b{font-size:15px;font-weight:600;margin:0 6px;white-space:nowrap}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:12px;background:var(--paper);overflow:hidden}
.cal .dh{padding:8px 10px;border-bottom:1px solid var(--line);font-size:12px;color:var(--ink2);display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
.cal .dh b{font-size:14px;color:var(--ink);font-weight:600}
.cal .dh.now b{background:var(--ink);color:#fffffe;border-radius:5px;padding:0 6px}
.cal .dh .q{margin-left:auto;white-space:nowrap}.cal .dh .q.over{color:var(--bad);font-weight:600}
.cal .dc{min-height:340px;padding:8px 6px;display:flex;flex-direction:column;gap:8px;min-width:0}
.cal .dh+.dh,.cal .dc+.dc{border-left:1px solid var(--line)}
.cal .dc.past{background:var(--bg)}
.blk{display:block;min-width:0}
.blk .bt{font-size:12px;color:var(--ink2);padding:0 2px 2px;display:flex;gap:4px;white-space:nowrap;min-width:0}
.blk .bt span{overflow:hidden;text-overflow:ellipsis;min-width:0}.blk .bt i{font-style:normal;flex:none}
.ev,.cal .dn,.cal .more{text-decoration:none}
.ev{display:flex;gap:5px;align-items:center;min-height:32px;padding:0 2px;border-radius:6px;font-size:13px;white-space:nowrap;min-width:0;color:var(--ink)}
.ev:hover{background:var(--hover)}
.ev .t{font-variant-numeric:tabular-nums;width:36px;flex:none}
.ev .st{font-size:12px;gap:4px;flex:none}
.ev.pub,.ev.pub .st{color:var(--ink2)}
.ev.bad{background:var(--bad-bg)}
.cal.month .dc{min-height:132px;gap:2px;padding:6px}
.cal.month .dn{display:flex;align-items:center;min-height:32px;padding:0 4px;font-size:13px;color:var(--ink2);border-radius:6px;width:max-content}
.cal.month .dn:hover{background:var(--hover)}
.cal.month .dn.now{color:var(--ink);font-weight:600}.cal.month .dn.now span{background:var(--ink);color:#fffffe;border-radius:5px;padding:0 6px}
.cal.month .dc.out{background:var(--bg)}.cal.month .dc.out .dn{color:var(--ink3)}
.cal.month .dc:nth-child(7n+1){border-left:0}
.cal.month .dc:nth-child(n+15){border-top:1px solid var(--line)}
.cal.month .ev .ti{overflow:hidden;text-overflow:ellipsis;min-width:0}
.cal.month .ev{padding:0 4px;gap:6px}.cal.month .ev .cnt{margin-left:auto;flex:none;font-size:12px}
.cal.month .more{font-size:12px;color:var(--ink2);padding:0 4px}
.calnote{margin:10px 0 0;font-size:12px;color:var(--ink2);display:flex;gap:16px;flex-wrap:wrap;align-items:center}
@media (max-width:860px){.bar input{margin-left:0;width:100%}.views{margin-left:0}
  .cal:not(.month){grid-template-columns:1fr}.cal:not(.month) .dh{display:none}.cal:not(.month) .dc{min-height:0;border-left:0;border-top:1px solid var(--line)}.cal:not(.month) .dc::before{content:attr(data-day);font-size:12px;color:var(--ink2);padding:0 4px}
  .cal.month .ev .ti,.cal.month .ev .cnt{display:none}.cal.month .dc{min-height:72px;padding:2px}.cal.month .dh{padding:6px 2px;justify-content:center}}
</style></head>
<body><div class="app">
<nav class="nav" aria-label="主导航"><div class="brand"><i></i>versekit</div>
<a class="nv" href="today.html">今天<b data-todo hidden></b></a>
<a class="nv" href="works.html" aria-current="page">作品</a>
<a class="nv" href="data.html">数据</a>
<a class="nv" href="system.html">系统</a></nav>
<main>
<div class="hd"><h1>作品</h1><span class="sub" id="count"></span><span class="demo r">演示数据</span></div>
<div class="bar"><div class="seg" id="seg" role="group" aria-label="按状态筛选"></div><div class="calnav" id="calnav" hidden></div><input type="search" id="q" placeholder="搜标题" aria-label="搜标题"><div class="seg views" id="views" role="group" aria-label="怎么看"></div></div>
<div id="list"></div>
<div class="legend"></div>
</main></div>
<script src="app.js"></script>
<script>
initShell();
const SAY = '帮我接入 versekit：https://vk.example.com/claude';
const FIL = [['all', '全部'], ['wait', '等你确认'], ['sched', '排着要发'], ['pub', '都发完了'], ['bad', '有问题']];
let fil = 'all', q = '';
// 视图：列表 / 周 / 月（#view=week|month，#off=±N 往前往后翻）
let view = ['week', 'month'].includes(HASH.view) ? HASH.view : 'list', off = +HASH.off || 0;
const VIEWS = [['list', '列表'], ['week', '周'], ['month', '月']];
const QUOTA = { xhs: 1 }; // 每天最多发几条（演示值，来自发布方案里的平台规则）
const WDS = ['周一', '周二', '周三', '周四', '周五', '周六', '周日'];
const monday = (day) => dayAdd(day, -((new Date(day).getDay() + 6) % 7));
const md = (day) => `${+day.slice(5, 7)} 月 ${+day.slice(8)} 日`;
// 一条平台稿在日历上是什么状态。没有时间的（现在发、我自己发、这条不发）不上日历
function evState(x) {
  if (x.issue && !x.issue.done) return ['bad', '出了问题'];
  if (x.state === 'published') return ['pub', '已发布'];
  if (paused(x.pf)) return ['wait', '暂停中'];
  if (x.state === 'confirmed') return ['sched', '已确认'];
  return ['wait', '等你确认'];
}
const calPubs = () => allPubs().filter((r) => r.x.at && r.x.timing !== 'now' && ['pending', 'confirmed', 'published'].includes(r.x.state));
const byDay = () => { const m = {}; calPubs().forEach((r) => (m[r.x.at.slice(0, 10)] ||= []).push(r)); Object.values(m).forEach((a) => a.sort((p, q2) => p.x.at.localeCompare(q2.x.at))); return m; };
const href = (r) => `work.html#id=${r.w.id}&cut=${r.c.id}${SIMPLE ? '&g=camp' : ''}`;
const RANK = { bad: 0, wait: 1, sched: 2, pub: 3 };
function quota(rs) { return Object.entries(QUOTA).map(([k, lim]) => { const n = rs.filter((r) => r.x.pf === k).length; return n ? `<span class="q ${n > lim ? 'over' : ''}" title="${PF[k][1]}每天最多 ${lim} 条">${PF[k][1]} ${n} / ${lim}${n > lim ? ' 超了' : ''}</span>` : ''; }).join(''); }
function drawWeek() {
  const d0 = dayAdd(monday(TODAY), off * 7); const days = [...Array(7)].map((_, i) => dayAdd(d0, i)); const m = byDay();
  const any = days.some((d) => m[d]); document.getElementById('count').textContent = `${GROUP.name} · 这一周 ${days.reduce((n, d) => n + (m[d] || []).length, 0)} 条`;
  document.getElementById('calnav').innerHTML = `<button class="btn" data-go="-1" aria-label="上一周">‹</button><b>${md(days[0])} – ${md(days[6])}</b><button class="btn" data-go="1" aria-label="下一周">›</button>${off ? '<button class="link" data-go="0">回到这一周</button>' : ''}${any ? '' : '<span class="sub">这一周没有安排</span>'}`;
  document.getElementById('list').innerHTML = `<div class="cal">${days.map((d, i) => `<div class="dh ${d === TODAY ? 'now' : ''}">${WDS[i]} <b>${+d.slice(8)}</b>${d >= TODAY ? quota(m[d] || []) : ''}</div>`).join('')}${days.map((d, i) => { const rs = m[d] || []; const blocks = []; rs.forEach((r) => { let b = blocks.find((k) => k.c === r.c); if (!b) blocks.push(b = { c: r.c, w: r.w, rs: [] }); b.rs.push(r); });
    return `<div class="dc ${d < TODAY ? 'past' : ''}" data-day="${WDS[i]} ${md(d)}">${blocks.map((b) => `<div class="blk"><div class="bt" title="${esc(b.w.title)} · ${esc(b.c.name)}"><span>${esc(b.w.title)}</span>${b.w.cuts.length > 1 ? `<i>· ${esc(b.c.name.split(' · ')[0])}</i>` : ''}</div>${b.rs.map((r) => { const [cls, txt] = evState(r.x); return `<a class="ev ${cls}" href="${href(r)}" title="${PF[r.x.pf][1]} · ${r.x.at.slice(11)} · ${txt}"><span class="t">${r.x.at.slice(11)}</span>${pf(r.x.pf)}<span class="st ${cls}">${txt}</span></a>`; }).join('')}</div>`).join('')}</div>`; }).join('')}</div>${calNote()}`;
}
function drawMonth() {
  const base = new Date(TODAY); const first = new Date(Date.UTC(base.getUTCFullYear(), base.getUTCMonth() + off, 1)).toISOString().slice(0, 10); const mon = first.slice(0, 7);
  const d0 = monday(first); const weeks = Math.ceil((((new Date(first).getDay() + 6) % 7) + new Date(Date.UTC(+first.slice(0, 4), +first.slice(5, 7), 0)).getUTCDate()) / 7);
  const days = [...Array(weeks * 7)].map((_, i) => dayAdd(d0, i)); const m = byDay(); const any = days.some((d) => d.startsWith(mon) && m[d]); document.getElementById('count').textContent = `${GROUP.name} · 这个月 ${days.filter((d) => d.startsWith(mon)).reduce((n, d) => n + (m[d] || []).length, 0)} 条`;
  document.getElementById('calnav').innerHTML = `<button class="btn" data-go="-1" aria-label="上个月">‹</button><b>${+mon.slice(0, 4)} 年 ${+mon.slice(5)} 月</b><button class="btn" data-go="1" aria-label="下个月">›</button>${off ? '<button class="link" data-go="0">回到这个月</button>' : ''}${any ? '' : '<span class="sub">这个月没有安排</span>'}`;
  document.getElementById('list').innerHTML = `<div class="cal month">${WDS.map((n) => `<div class="dh">${n}</div>`).join('')}${days.map((d) => { const rs = m[d] || []; const ws = []; rs.forEach((r) => { let b = ws.find((k) => k.w === r.w); if (!b) ws.push(b = { w: r.w, rs: [] }); b.rs.push(r); });
    ws.forEach((b) => { b.top = b.rs.map((r) => evState(r.x)).sort((a, c) => RANK[a[0]] - RANK[c[0]])[0]; }); ws.sort((a, c) => RANK[a.top[0]] - RANK[c.top[0]]);
    const wk = Math.round((new Date(monday(d)) - new Date(monday(TODAY))) / 6048e5);
    return `<div class="dc ${d.startsWith(mon) ? '' : 'out'}"><a class="dn ${d === TODAY ? 'now' : ''}" href="works.html#view=week&off=${wk}" data-week="${wk}" title="看这一周"><span>${+d.slice(8) === 1 ? `${+d.slice(5, 7)} 月 1 日` : +d.slice(8)}</span></a>${ws.slice(0, 3).map((b) => `<a class="ev ${b.top[0]}" href="${href(b.rs[0])}" title="${esc(b.w.title)}：${b.rs.length} 条，${b.top[1]}"><span class="st ${b.top[0]}"></span><span class="ti">${esc(b.w.title)}</span><span class="sub cnt">${b.rs.length} 条</span></a>`).join('')}${ws.length > 3 ? `<a class="more" href="works.html#view=week&off=${wk}" data-week="${wk}">还有 ${ws.length - 3} 个</a>` : ''}</div>`; }).join('')}</div>${calNote()}`;
}
const calNote = () => `<div class="calnote"><span class="st wait">等你确认</span><span class="st sched">已确认，到时间发</span><span class="st pub">已发布</span><span class="st bad">出了问题</span><span>想确认或改时间，点进去在成片里做。现在发的、你自己发的不在日历上。</span></div>`;
const order = ['xhs', 'dy', 'sph', 'bili', 'web', 'mp', 'tk', 'yt'];
function chips(w) {
  const by = {}; w.cuts.flatMap((c) => c.pubs).forEach((x) => (by[x.pf] ||= []).push(x));
  return order.filter((k) => by[k]).map((k) => { const xs = by[k]; const bad = xs.some((x) => x.issue && !x.issue.done); const pubd = xs.filter((x) => x.state === 'published').length;
    const tip = bad ? '出了问题' : pubd === xs.length ? '已发布' : pubd ? `已发 ${pubd} / ${xs.length}` : '还没发';
    return `<span role="img" aria-label="${PF[k][1]}" class="pf ${k} ${bad ? 'err' : pubd ? '' : 'off'}" title="${PF[k][1]}：${tip}">${PF[k][0]}</span>`; }).join('');
}
function best(w) {
  const rs = w.cuts.flatMap((c) => c.pubs.filter((x) => x.state === 'published' && x.n != null).map((x) => ({ x, c })));
  if (!rs.length) return '<span class="sub">还没有结果</span>';
  const top = rs.sort((a, b) => ratio(b.x).x - ratio(a.x).x)[0]; const r = ratio(top.x);
  return `<span class="pfn">${pf(top.x.pf)}<span class="x ${r.cls}">${r.txt}</span></span><div class="sub">${r.word}</div>`;
}
function draw() {
  document.getElementById('views').innerHTML = VIEWS.map(([k, n]) => `<button data-view="${k}" aria-pressed="${k === view}">${n}</button>`).join('');
  const cal = view !== 'list' && !HASH.empty;
  document.getElementById('seg').hidden = cal; document.getElementById('q').hidden = cal; document.getElementById('calnav').hidden = !cal; document.querySelector('.legend').hidden = cal;
  if (cal) { view === 'week' ? drawWeek() : drawMonth(); return; }
  const rows = WORKS.filter((w) => (fil === 'all' || workState(w)[0] === fil) && w.title.toLowerCase().includes(q.toLowerCase()));
  document.getElementById('count').textContent = `${GROUP.name} · ${WORKS.length} 个作品`;
  document.getElementById('seg').innerHTML = FIL.map(([k, n]) => { const c = k === 'all' ? WORKS.length : WORKS.filter((w) => workState(w)[0] === k).length; return `<button data-f="${k}" aria-pressed="${k === fil}">${n}${c && k !== 'all' ? ' ' + c : ''}</button>`; }).join('');
  if (HASH.empty) { document.getElementById('count').textContent = `${GROUP.name} · 还没有作品`; document.querySelector('.bar').hidden = true; document.querySelector('.legend').hidden = true;
    document.getElementById('list').innerHTML = HASH.empty === 'new'
      ? `<div class="panel first"><h3>让 Claude 把做好的内容送进来</h3><p class="sub">versekit 不做内容，只管把做好的发出去。把下面这句话发给你做视频的那个 Claude，它会自己接好，中间让你在浏览器里点一次「允许」。</p><div class="say"><span>${SAY}</span><button class="btn" data-copy>复制</button></div><p class="sub">接好以后，在 Claude 里说「把这期入库」，做好的内容就会出现在这里，等你确认。</p></div>`
      : `<div class="panel first"><h3>还没有作品</h3><p class="sub">Claude 已经接好了（Mac mini 上的 Claude）。在 Claude 里说「把这期入库」，做好的内容就会出现在这里，等你确认。</p></div>`;
    return; }
  const up = fil === 'all' && !q && !SIMPLE && HASH.up !== 'no' ? `<tr><td><span class="wcell"><span class="cv ph" role="img" aria-label="还没有封面"></span><span><b>GDPR 罚单是怎么算出来的？</b><span class="sub">正在从「Mac mini 上的 Claude」上传 · 3 / 5 个文件</span></span></span></td><td><span class="st">传完才能确认</span></td><td></td><td><span class="sub">还没有结果</span></td><td class="n sub">今天</td></tr>` : '';
  document.getElementById('list').innerHTML = rows.length ? `<div class="tblwrap"><table><thead><tr><th>作品</th><th>现在</th><th>平台</th><th>最好的一条</th><th class="n">入库</th></tr></thead><tbody>${up}${rows.map((w) => { const [cls, txt] = workState(w);
    return `<tr><td><a class="wcell" href="work.html#id=${w.id}${SIMPLE ? '&g=camp' : ''}"><img class="cv" src="${w.cover}" width="64" height="48" alt=""><span><b>${esc(w.title)}</b><span class="sub">${w.cuts.length > 1 ? w.cuts.length + ' 支成片 · ' : ''}${w.cuts.flatMap((c) => c.pubs).length} 条平台稿</span></span></a></td><td><span class="st ${cls}">${txt}</span></td><td><div class="pfs">${chips(w)}</div></td><td>${best(w)}</td><td class="n sub">${when(w.inAt).day}</td></tr>`; }).join('')}</tbody></table></div>`
    : `<div class="panel empty">${q ? `没有标题里带"${esc(q)}"的作品。` : '这个状态下没有作品。'} <button class="link" data-f="all">看全部</button></div>`;
}
document.querySelector('.legend').innerHTML = `<span><span class="pf dy" role="img" aria-label="抖音"></span>彩色：这个平台已发布</span><span><span class="pf dy off" role="img" aria-label="抖音"></span>灰色：还没发</span><span><span class="pf dy err">抖</span>红色：出了问题</span><span>"最好的一条"是和那个账号自己的平时比，不同平台之间不比较。</span>`;
document.addEventListener('click', (e) => { if (e.target.closest('[data-copy]')) { navigator.clipboard?.writeText(SAY); toast('复制好了，发给 Claude'); return; } const setHash = () => history.replaceState(null, '', '#' + [SIMPLE && 'g=camp', HASH.ip && 'ip=' + HASH.ip, view !== 'list' && 'view=' + view, off && 'off=' + off].filter(Boolean).join('&'));
  let v = e.target.closest('[data-view]'); if (v) { view = v.dataset.view; off = 0; setHash(); draw(); return; }
  v = e.target.closest('[data-go]'); if (v) { off = +v.dataset.go ? off + +v.dataset.go : 0; setHash(); draw(); return; }
  v = e.target.closest('[data-week]'); if (v) { e.preventDefault(); view = 'week'; off = +v.dataset.week; setHash(); draw(); return; }
  const b = e.target.closest('[data-f]'); if (!b) return; fil = b.dataset.f; if (fil === 'all') { q = ''; document.getElementById('q').value = ''; } draw(); });
document.getElementById('q').addEventListener('input', (e) => { q = e.target.value.trim(); draw(); });
draw();
</script></body></html>
