<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>系统 · Hifabu</title>
<link rel="stylesheet" href="app.css">
<style>
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.kv{padding:14px 16px;display:grid;grid-template-columns:110px minmax(0,1fr);gap:6px 12px;font-size:14px;align-items:baseline;margin:0}
.kv dt{color:var(--ink2);font-size:13px}
.kv dd{margin:0}
.tabs{margin:0 0 6px}
.notes{margin:0;padding-left:18px}
.plan td:first-child{white-space:nowrap;font-weight:600}
.pfs{display:flex;gap:10px 14px;flex-wrap:wrap}
.sw{display:inline-flex;gap:6px;align-items:center;min-height:32px;cursor:pointer;color:var(--ink2)}
td b.nm{font-weight:600;display:block}
.dev td:nth-child(1),.dev td:nth-child(2),.dev td:nth-child(4){white-space:nowrap}
.dev td:nth-child(5){min-width:170px}
/* 操作列：文字链接和按钮排在一行，靠右 */
.acts{display:inline-flex;gap:14px;align-items:center;justify-content:flex-end;white-space:nowrap}
/* 行内展开：这一行需要多说一句或多做一步时，在它下面展开，不弹窗 */
tr.has-sub td{border-bottom:0}
tr.subrow td{padding-top:0}
.subin{display:flex;gap:10px 16px;align-items:center;flex-wrap:wrap;padding:12px;border:1px solid var(--line);border-radius:var(--r);background:var(--hover);font-size:13px}
.subin p{margin:0;flex:1 1 320px;max-width:60em}
.subin .acts{margin-left:auto}
.subin.bad{background:var(--bad-bg);border-color:var(--bad-line)}
.subin.bad p{color:var(--bad)}
.subin.wait{background:var(--mark-bg);border-color:var(--mark-line)}
.subin input{flex:1 1 180px;max-width:260px}
.subin .how{flex:1 1 280px;display:grid;gap:4px;min-width:0}
.subin .how b{font-size:14px;font-weight:600}
.subin .how .alt{display:flex;gap:4px 16px;flex-wrap:wrap}
.subin ol{margin:0;padding-left:18px;flex:1 1 320px;display:grid;gap:8px}
.addrow input{width:100%;max-width:220px}
.rn{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rn input{max-width:200px}
@media (max-width:860px){.two{grid-template-columns:minmax(0,1fr)}}
</style></head>
<body><div class="app">
<nav class="nav" aria-label="主导航"><div class="brand"><i></i>Hifabu</div>
<a class="nv" href="today.html">今天<b data-todo hidden></b></a>
<a class="nv" href="works.html">作品</a>
<a class="nv" href="data.html">数据</a>
<a class="nv" href="system.html" aria-current="page">系统</a></nav>
<main id="main"></main></div>
<script src="app.js"></script>
<script>
initShell();
const main = document.getElementById('main');
// 账号、设备、规则、发布方案都是演示数据。规则里的数字是默认值，还没最后确定。
// #tab=accounts|plan|devices|users：页内分段。#acc=states：状态样张。#ip=moved：发布机出口位置变了。#add=none / #add=full：接入账号那一行的另外两种样子。
const STATES = HASH.acc === 'states'; const MOVED = HASH.ip === 'moved';
let tab = ['accounts', 'plan', 'devices', 'notify', 'users'].includes(HASH.tab) ? HASH.tab : 'accounts';
// 飞书（#fs=）：none 没接 / qr 等你扫码 / sub 差一步：让卡片上的按钮能点 / ok 接好了 / bad 卡片发不出去 / off 不用飞书
const FS = { state: ['none', 'qr', 'sub', 'ok', 'bad', 'off'].includes(HASH.fs) ? HASH.fs : STATES ? 'bad' : 'ok', drop: false, on: { confirm: true, issue: true, daily: true }, last: '今天 09:02 送达' };
// via：web = 在平台的登录页登录；api = 官方接口授权；repo = 不用登录
// state：ok 正常 / expired 要重新登录 / failed 没登上 / conflict 登录到了别的号 / off 没登录 / nocred 缺应用凭证 / noauth 还没授权
// step（进行中的那一步）：pre 登录前的说明 / qr 等你扫码 / scanned 已扫码 / qrold 二维码过期 / sms1 填手机号 / sms2 填验证码 / win 在发布机上开了登录窗口 / auth 等你授权 / logout 退出确认 / cred 填应用凭证
const A = (k, name, left, cap, note, via = 'web', state = 'ok', step = null) => ({ k, name, left, cap, note, via, state, step });
const ACC = SIMPLE
  ? [A('xhs', '露营小记', 1, 1, '逐条单独确认'), A('dy', '露营小记', 2, 3, ''), A('bili', '露营小记', 1, 2, '')]
  : STATES
    ? [A('xhs', 'AssureLane 出海合规', 1, 1, '逐条单独确认', 'web', 'conflict'), A('dy', 'AssureLane', 3, 3, '', 'web', 'expired'), A('sph', 'AssureLane', 2, 2, '', 'web', 'expired', 'qr'), A('bili', 'AssureLane', 2, 2, '发完归入合集「出海合规」', 'web', 'failed', 'qrold'),
      A('web', 'assurelane.ai', null, null, '由做内容的那台电脑更新网站', 'repo'), A('tk', 'assurelane', 2, 2, '走官方接口', 'api', 'nocred'), A('yt', 'AssureLane', 3, 3, '走官方接口', 'api')]
    : [A('xhs', 'AssureLane 出海合规', 1, 1, '逐条单独确认'), A('dy', 'AssureLane', 3, 3, ''), A('sph', 'AssureLane', 2, 2, ''), A('bili', 'AssureLane', 2, 2, '发完归入合集「出海合规」'),
      A('web', 'assurelane.ai', null, null, '由做内容的那台电脑更新网站', 'repo'), A('tk', 'assurelane', 2, 2, '走官方接口', 'api'), A('yt', 'AssureLane', 3, 3, '走官方接口', 'api')];
// 这台发布机上别的组接了哪些平台：同平台再登录时，登录前先说清楚会登进哪个号
const OTHER = SIMPLE ? { name: 'AssureLane', pfs: { xhs: 'AssureLane 出海合规', dy: 'AssureLane', sph: 'AssureLane', bili: 'AssureLane' } } : { name: '露营小记', pfs: { xhs: '露营小记', dy: '露营小记', bili: '露营小记' } };
const OTHER_PFS = SIMPLE ? ['xhs', 'dy', 'sph', 'bili', 'web', 'tk', 'yt'] : ['xhs', 'dy', 'bili'];
const PLAN = SIMPLE
  ? [['视频', ['xhs', 'dy', 'bili'], '每支成片发到所有接入的平台（默认方案）']]
  : [['长片 · 中文', ['xhs', 'dy', 'sph', 'bili', 'web'], '先发'], ['长片 · English', ['tk', 'yt'], '中文版发出后第二天'], ['短片 · 中文', ['xhs', 'dy', 'sph'], '长片之后，隔一天一支'], ['短片 · English', ['tk', 'yt'], '跟着中文版，第二天']];
const NOTES = ['登录平台账号不用到发布机前面，网页上就能扫码', '改内容可以先改通用的，再单独改某个平台', '现在发不用再填时间', '侧栏能看到发布机的出口位置', '后台服务会自己检查更新'];
// 发布机。route：国内和海外两条线路的出口不一样时（常见于分流代理），两条都写出来
const MACH = [{ id: 'm1', name: '书房的 Mac', os: 'macOS 15', online: true, seen: '1 分钟前', ver: STATES ? '0.9.1' : '0.9.2', state: STATES ? 'new' : 'latest', auto: true, step: null,
  routes: MOVED ? [['', '日本 东京', '198.51.100.7', '机房线路，可能是代理']] : STATES ? [['国内平台看到', '美国 洛杉矶', '203.0.113.24', '家庭宽带'], ['海外平台看到', '美国 圣何塞', '198.51.100.61', '机房线路，可能是代理']] : [['', '美国 洛杉矶', '203.0.113.24', '家庭宽带']] }];
if (STATES) MACH.push({ id: 'm2', name: '客厅的小主机', os: 'Windows 11', online: false, seen: '3 小时前', ver: '0.8.4', state: 'old', auto: true, step: null, routes: [['', '美国 洛杉矶', '203.0.113.24', '家庭宽带']], none: true });
const MAKERS = [{ id: 'c1', name: 'Mac mini 上的 Claude', seen: '今天 13:52 用过', last: 'GDPR 罚单是怎么算出来的？', up: '正在上传 · 3 / 5 个文件', step: null }];
const USERS = [{ name: '陈默', mail: 'chenmo@example.com', me: true, state: 'ok', dev: '1 台发布机 · 1 个 Claude', use: '1.2 GB / 20 GB' }, { name: '林夏', mail: 'linxia@example.com', state: 'ok', dev: '1 台发布机', use: '0.3 GB / 20 GB', step: null }, { name: '', mail: 'zhou@example.com', state: 'invited', dev: '', use: '', step: null }];
const SAY = '帮我接入 Hifabu：https://vk.example.com/claude';
let updFixed = false, notesOpen = false, addMach = false, addMaker = false, rn = null, ipStep = null, groupAdd = false;
const M0 = () => (MACH[0] ? MACH[0].name : '发布机');
const names = (ks) => ks.map((k) => PF[k][1]).join('、');
const needs = () => ACC.filter((a) => a.via !== 'repo' && a.state !== 'ok').length;
const acct = (k) => ACC.find((a) => a.k === k);
const B = (act, k, label, cls = 'btn') => `<button class="${cls}" data-act="${act}" data-k="${k}">${label}</button>`;
const sub = (cols, body, cls = '') => (body ? `<tr class="subrow"><td colspan="${cols}"><div class="subin${cls}">${body}</div></td></tr>` : '');
const moved = () => ipMoved();

// ---------- 账号
function loginCell(a) {
  const s = { qr: '等你扫码', scanned: '已扫码，在手机上点确认', sms1: '等你填手机号', sms2: '验证码已发到 138****0000', win: '等你登录', auth: '等你授权' }[a.step];
  if (s) return `<span class="st wait">${s}</span>`;
  if (a.step === 'qrold') return '<span class="st bad">二维码过期了</span>';
  if (a.state === 'ok' && moved() && a.via === 'web') return '<span class="st wait">暂停发布</span> <span class="sub">发布机出口位置变了</span>';
  return { ok: '<span class="st done">正常</span> <span class="sub">今天 07:10 检查过</span>', expired: '<span class="st bad">要重新登录</span> <span class="sub">今天 06:39 检查过</span>', failed: '<span class="st bad">没登上</span> <span class="sub">上次没登进去</span>',
    conflict: '<span class="st bad">登录到了别的号</span>', off: '<span class="st wait">没登录</span>', nocred: '<span class="st wait">缺应用凭证</span>', noauth: '<span class="st wait">还没授权</span>' }[a.state];
}
// 操作的轻重跟状态走：正常 → 文字链接；要你处理 → 描边按钮；进行中的下一步 → 墨色实心（同一时刻全页只有一个）
function actCell(a) {
  const k = a.k;
  if (a.via === 'repo' || a.step || a.state === 'conflict') return '';
  if (!MACH.length) return '<span class="sub">先接一台发布机</span>';
  return `<span class="acts">${{ ok: a.via === 'api' ? B('login', k, '重新授权', 'link') : B('logout', k, '退出登录', 'link') + B('login', k, '重新登录', 'link'), expired: B('login', k, '重新登录'), failed: B('login', k, '再试一次'), off: B('login', k, '登录'), nocred: B('cred', k, '填应用凭证'), noauth: B('login', k, `Connect ${PF[k][1]}`) }[a.state]}</span>`;
}
function subRow(a) {
  const k = a.k, pf = PF[k][1]; const cancel = B('cancel', k, '取消', 'link');
  const alt = (...xs) => `<span class="alt">${xs.join('')}${cancel}</span>`;
  const sms = B('sms', k, '改用短信验证码', 'link'), qr = B('qr', k, '改用扫码', 'link'), win = B('win', k, '在发布机上打开登录窗口', 'link');
  switch (a.step) {
    case 'pre': return sub(6, `<p>发布机「${M0()}」上已经接了一个${pf}号（「${OTHER.name}」的 @${esc(OTHER.pfs[k])}）。扫码登录的是手机 App 当前的号；要接另一个号，先在 App 里切换账号，或者改用短信验证码。</p><span class="acts">${cancel}${B('go', k, '知道了，开始登录', 'btn pri')}</span>`);
    case 'qr': return sub(6, `<button class="qr" data-act="scan" data-k="${k}" title="原型里点一下，当作手机扫了码">二维码<br>（原型里点一下当作扫了码）</button><div class="how"><b>用${pf} App 扫这个码</b><span class="sub">二维码是发布机「${M0()}」取回来的，2 分钟内有效。登录数据只存在那台电脑上，这个服务拿不到。</span>${alt(sms, win)}</div>`);
    case 'scanned': return sub(6, `<button class="qr" data-act="scan" data-k="${k}" title="原型里点一下，当作手机上点了确认">已扫码<br>（原型里再点一下当作点了确认）</button><div class="how"><b>在手机上点「确认登录」</b><span class="sub">点完这里会自己变成正常，不用回来按什么。</span>${alt()}</div>`);
    case 'qrold': return sub(6, `<div class="qr old">二维码<br>过期了</div><div class="how"><b>二维码过期了</b><span class="sub">超过 2 分钟没有扫。</span><span class="alt">${B('qr', k, '换一个', 'btn')}${sms}${cancel}</span></div>`);
    case 'sms1': return sub(6, `<div class="how"><b>用短信验证码登录${pf}</b><span class="sub">手机号只用来登录这一次，不会存下来。</span>${alt(qr, win)}</div><input type="tel" placeholder="手机号" aria-label="手机号" autocomplete="off">${B('code', k, '发验证码', 'btn pri')}`);
    case 'sms2': return sub(6, `<div class="how"><b>填收到的验证码</b><span class="sub">已发到 138****0000，60 秒后可以重发。</span>${alt(B('code', k, '重发', 'link'))}</div><input type="text" inputmode="numeric" placeholder="6 位验证码" aria-label="验证码" autocomplete="one-time-code">${B('done', k, '登录', 'btn pri')}`);
    case 'win': return sub(6, `<div class="how"><b>到「${M0()}」前面，在打开的窗口里登录${pf}</b><span class="sub">登录窗口已经在那台电脑上打开。登录完回到这里点一下。</span>${alt(qr)}</div>${B('done', k, '我登录好了', 'btn pri')}`);
    case 'auth': return sub(6, `<div class="how"><b>在新打开的标签页里同意授权</b><span class="sub">${pf} 的授权页已经在新标签页打开。同意之后这里会自己变成正常。</span><span class="alt">${B('done', k, '原型里点这里当作授权好了', 'link')}${cancel}</span></div>`);
    case 'logout': { const n = upcoming().filter((r) => r.x.pf === k).length; return sub(6, `<p>退出后会清掉这个账号在发布机上的登录数据，要重新登录才能发。${n ? `<b>这个账号还有 ${n} 条排着要发，退出后不会发。</b>` : ''}</p><span class="acts">${cancel}${B('logout-ok', k, '退出登录')}</span>`); }
    case 'cred': return sub(6, `<p>填 ${pf} 开发者后台里这个应用的凭证。它会直接送到发布机上保存，这个服务不存；保存后不再显示 secret。</p><input type="text" placeholder="client key" aria-label="client key" autocomplete="off"><input type="password" placeholder="client secret" aria-label="client secret" autocomplete="off"><span class="acts">${cancel}${B('save', k, '保存', 'btn pri')}</span>`);
  }
  if (a.state === 'conflict') return sub(6, `<p>这个${pf}号已经接在「${OTHER.name}」的 @${esc(OTHER.pfs[k])} 上，没有算登录成功。要接另一个号，先退出登录，再登录另一个号。</p><span class="acts">${B('logout-ok', k, '退出登录，换一个号')}</span>`, ' bad');
  return '';
}
function addRow() {
  const free = HASH.add === 'full' ? [] : Object.keys(PF).filter((k) => !acct(k));
  if (HASH.add === 'none') return '<tr><td colspan="6" class="sub">还没有接发布机。平台账号要在发布机上登录，先到「设备」里接一台。</td></tr>';
  if (!free.length) return `<tr><td colspan="6" class="sub">这个组能接的平台都接上了。一个组里每个平台接一个号；要接第二个号，新建一个账号组。</td></tr>`;
  return `<tr class="addrow"><td><select aria-label="要接入的平台">${free.map((k) => `<option value="${k}">${PF[k][1]}</option>`).join('')}</select></td><td><input type="text" placeholder="账号名（平台上的名字）" aria-label="账号名"></td><td colspan="3" class="sub">接入后当场登录，归到「${GROUP.name}」。</td><td class="n">${B('add', '', '接入账号')}</td></tr>`;
}
const nameCell = (kind, id, name, extra = '') => (rn && rn.kind === kind && rn.id === id
  ? `<span class="rn"><input type="text" value="${esc(name)}" aria-label="新名字" data-rnv><button class="btn" data-rnok>好了</button><button class="link" data-rnx>取消</button></span>`
  : `<b class="nm">${esc(name)}</b>${extra}`);
function tabAccounts() {
  return `
  <h2 class="sec">账号组 · 一个组是一套平台账号，有自己的作品、待办、数据和发布方案</h2>
  <div class="tblwrap"><table><thead><tr><th>账号组</th><th>账号</th><th>等你处理</th><th class="n"></th></tr></thead><tbody>${GROUPS.map((g) => { const n = g === GROUP ? todoCount() : (g.id === 'main' ? MAIN_TODO : 1); const ks = g === GROUP ? ACC.map((a) => a.k) : OTHER_PFS; return `<tr><td>${nameCell('g', g.id, g.name)}</td><td>${ks.length} 个 <span class="sub">· ${names(ks)}</span></td><td>${n ? `<span class="st wait">${n} 件</span>` : '<span class="st">没有</span>'}</td><td class="n"><span class="acts"><button class="link" data-rn="g:${g.id}">改名</button>${g === GROUP ? '<span class="sub">当前</span>' : `<a class="btn" href="system.html${g.q}" data-sw>切过去</a>`}</span></td></tr>`; }).join('')}
  ${groupAdd ? `<tr class="addrow"><td><input type="text" placeholder="新账号组的名字" aria-label="新账号组的名字" data-gname></td><td colspan="2" class="sub">建好后切过去，再接入这一套平台账号。飞书卡片标题会带上账号组的名字。</td><td class="n"><span class="acts"><button class="link" data-gx>取消</button><button class="btn" data-gok>建好</button></span></td></tr>` : `<tr><td colspan="4"><button class="link" data-gadd>新建账号组</button></td></tr>`}</tbody></table></div>
  <h2 class="sec">账号 · ${GROUP.name} · ${MACH.length ? `在发布机「${M0()}」上登录和发布` : '还没有发布机，现在登录不了、也发不了'}</h2>
  <div class="tblwrap"><table><thead><tr><th>平台</th><th>账号</th><th>登录</th><th>今天还能发</th><th>说明</th><th class="n"></th></tr></thead><tbody>${ACC.map((a) => { const s = subRow(a); return `<tr${s ? ' class="has-sub"' : ''}><td>${pfn(a.k)}</td><td>${esc(a.name)}</td><td>${loginCell(a)}</td><td>${a.cap == null ? '<span class="sub">不限</span>' : a.state !== 'ok' || (moved() && a.via === 'web') ? '<span class="sub">现在发不了</span>' : `${a.left} 条 <span class="sub">每天最多 ${a.cap} 条</span>`}</td><td class="sub">${a.note}</td><td class="n">${actCell(a)}</td></tr>${s}`; }).join('')}${addRow()}</tbody></table></div>
  <div class="cmd">平台的登录数据只存在你自己的发布机上，这个服务拿不到。手机上的通知和确认在飞书里，在「通知」里接：<button class="link" data-tab="notify">去接飞书</button></div>`;
}

// ---------- 发布方案
function tabPlan() {
  return `
  <h2 class="sec">发布方案 · ${GROUP.name} · 哪种成片发到哪些平台、按什么节奏</h2>
  <div class="tblwrap"><table class="plan"><thead><tr><th>成片</th><th>发到</th><th>节奏</th><th class="n"></th></tr></thead><tbody>${PLAN.map(([n, ps, rh], i) => `<tr><td>${n}</td><td><div class="pfs">${ps.map(pfn).join('')}</div></td><td class="sub">${rh}</td><td class="n"><button class="btn" data-plan="${i}">改</button></td></tr>`).join('')}</tbody></table></div>
  <div class="cmd">这是你自己的习惯，可以改；新作品入库时按它生成平台稿和建议时间，每条仍然要你确认。</div>
  <h2 class="sec">平台规则 · 对所有人一样，不能关</h2>

  else if ((b = t('[data-mact]'))) { const m = MACH.find((x) => x.id === b.dataset.m); const act = b.dataset.mact;
    if (act === 'auto') { m.auto = !m.auto; toast(m.auto ? '自动更新已打开：空闲时才更新，不打断发布和登录' : '自动更新已关掉：有新版本也不会自己装'); }
    else if (act === 'update') { m.step = 'updating'; setTimeout(() => { m.step = null; m.ver = '0.9.2'; m.state = 'latest'; updFixed = updFixed || m.id === 'm1'; toast(`${m.name}已更新到 0.9.2`); draw(); }, 1800); }
    else if (act === 'drop') m.step = 'drop'; else if (act === 'x') m.step = null;
    else if (act === 'drop-ok') { MACH.splice(MACH.indexOf(m), 1); toast(`已断开${m.name}`); drawHealth({ none: !MACH.length }); } }
  else if ((b = t('[data-cact]'))) { const c = MAKERS[0]; const act = b.dataset.cact; if (act === 'drop') c.step = 'drop'; else if (act === 'x') c.step = null; else { MAKERS.length = 0; toast('已断开'); } }
  else if ((b = t('[data-uact]'))) { const u = USERS[+b.dataset.u]; const act = b.dataset.uact;
    if (act === 'invite') { const inp = b.closest('tr').querySelector('input'); const mail = inp.value.trim(); if (!mail.includes('@')) { inp.focus(); toast('先填对方的邮箱'); return; } USERS.push({ name: '', mail, state: 'invited', dev: '', use: '', step: null }); toast(`邀请已发到 ${mail}`); }
    else if (act === 'off') u.step = 'off'; else if (act === 'x') u.step = null;
    else if (act === 'off-ok') { u.step = null; u.state = 'off'; toast(`已停用${u.name}`); }
    else if (act === 'on') { u.state = 'ok'; toast(`已重新启用${u.name}`); }
    else { toast(act === 'copy' ? '邀请链接复制好了' : `已再发一次到 ${u.mail}`); return; } }
  else if ((b = t('[data-plan]'))) { toast('原型里没画改的样子；实现里已经有，就地改、能取消'); return; }
  else if ((b = t('[data-p]'))) { issues()[+b.dataset.p].x.issue.done = true; toast('正在重试'); changed(); return; }
  else if ((b = t('[data-act]'))) { const ds = b.dataset;
    if (ds.act === 'add') {
      const row = b.closest('tr'), k = row.querySelector('select').value, inp = row.querySelector('input'), name = inp.value.trim();
      if (!name) { inp.focus(); toast('先填账号名'); return; }
      const api = k === 'tk' || k === 'yt'; const a = A(k, name, 2, 2, api ? '走官方接口' : '', api ? 'api' : 'web', api ? 'noauth' : 'off'); ACC.push(a); startLogin(a);
    } else { const a = acct(ds.k); const pf = PF[a.k][1];
      if (ds.act === 'login') startLogin(a);
      else if (ds.act === 'go' || ds.act === 'qr') a.step = 'qr';
      else if (ds.act === 'scan') { if (a.step === 'qr') a.step = 'scanned'; else { a.step = null; a.state = 'ok'; toast(`${pf}登录正常`); } }
      else if (ds.act === 'sms') a.step = 'sms1';
      else if (ds.act === 'code') { const tel = b.closest('.subin').querySelector('input[type=tel]'); if (tel && !tel.value.trim()) { tel.focus(); toast('先填手机号'); return; } a.step = 'sms2'; toast('验证码已发出'); }
      else if (ds.act === 'win') { a.step = 'win'; toast(`登录窗口已在「${M0()}」上打开`); }
      else if (ds.act === 'cancel') a.step = null;
      else if (ds.act === 'done') { a.step = null; a.state = 'ok'; toast(`${pf}登录正常`); }
      else if (ds.act === 'logout') a.step = 'logout';
      else if (ds.act === 'logout-ok') { a.step = null; a.state = 'off'; toast(`已退出${pf}的登录`); }
      else if (ds.act === 'cred') a.step = 'cred';
      else if (ds.act === 'save') { a.step = null; a.state = 'noauth'; toast('应用凭证已保存到发布机'); } } }
  else return;
  draw();
});
