<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>全部账号组 · versekit</title>
<link rel="stylesheet" href="app.css">
<style>
/* 跨组矩阵：只读总览，点格子进入那个账号组 */
.matrix{width:100%;border-collapse:separate;border-spacing:6px;table-layout:fixed;background:transparent}
.matrix caption{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
.matrix col.group{width:156px}.matrix col.platform{width:auto}
.matrix th,.matrix td{border:0;padding:0;text-align:left;vertical-align:top;background:transparent}
.matrix thead th{height:24px;padding:0 12px;color:var(--faint);font-size:12px;font-weight:500}
.matrix thead th:first-child{color:var(--muted);padding-left:2px}
.group-head{padding:6px 12px 6px 2px!important;vertical-align:middle!important}
.group-name{display:block;font-size:14px;font-weight:650;line-height:1.35;overflow-wrap:anywhere}
.group-meta{display:block;margin-top:4px;color:var(--muted);font-size:12px;line-height:1.4}
.group-link{display:inline-flex;align-items:center;min-height:32px;margin-top:2px;color:var(--navy);font-size:12px;text-underline-offset:3px}

.cell{display:flex;flex-direction:column;align-items:flex-start;gap:4px;width:100%;min-height:100px;padding:10px 11px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);text-decoration:none}
a.cell:hover{border-color:var(--muted);background:var(--paper-subtle)}
.cell.level-bad{background:var(--red-bg);border-color:var(--red-line)}
.cell.level-warn{background:var(--amber-bg);border-color:var(--amber-line)}
.cell-head{display:flex;align-items:center;gap:7px;min-width:0;width:100%}
.plogo{width:18px;height:18px;flex:none;border-radius:4px}
.chandle{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;font-weight:650}
.cell.empty{cursor:default;background:transparent;border:1px dashed var(--line)}
.empty-state{font-size:12px;color:var(--faint)}
.empty-link{display:inline-flex;align-items:center;min-height:32px;color:var(--muted);font-size:12px;text-underline-offset:3px}
.empty-link:hover{color:var(--ink)}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;color:var(--muted);font-size:12px}
.legend span{display:inline-flex;align-items:center;gap:6px}

@media (max-width:1180px){
  .matrix{border-spacing:5px}.matrix col.group{width:140px}
}
@media (max-width:900px){
  .matrix{display:block}.matrix colgroup,.matrix thead{display:none}.matrix tbody{display:block}
  .matrix th,.matrix td{display:block;border:0;padding:0}
  .matrix tbody tr{display:block;margin-bottom:12px;padding:4px 0 0;border:1px solid var(--line);border-radius:8px;background:var(--paper)}
  .group-head{padding:12px 14px!important;border-bottom:1px solid var(--line-soft)!important}
  .cell{border:0;border-bottom:1px solid var(--line-soft);border-radius:0;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:11px 14px}
  .matrix tbody tr td:last-child .cell{border-bottom:0}
  .cell-head{grid-column:1/-1}
  .cell .badge,.cell .status-ok{justify-self:end}
  .cell.empty{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center}
  .cell.empty .cell-head{grid-column:1/-1}
  .empty-link{grid-column:2;grid-row:2;justify-self:end;min-height:36px}
}
</style>
</head>
<body data-page="matrix">
<a class="skip" href="#main">跳到主内容</a>

<svg class="sprite" aria-hidden="true" focusable="false">
  <symbol id="pl-xhs" viewBox="0 0 24 24"><rect width="24" height="24" rx="5" fill="#ff2442"/><text x="12" y="17" text-anchor="middle" font-size="13" font-weight="700" fill="#fff" font-family="-apple-system,PingFang SC,sans-serif">红</text></symbol>
  <symbol id="pl-douyin" viewBox="0 0 24 24"><rect width="24" height="24" rx="5" fill="#161823"/><text x="12" y="17" text-anchor="middle" font-size="13" font-weight="700" fill="#fff" font-family="-apple-system,PingFang SC,sans-serif">抖</text></symbol>
  <symbol id="pl-bili" viewBox="0 0 24 24"><rect width="24" height="24" rx="5" fill="#00a1d6"/><path d="M7.2 5.6 10 8.2M16.8 5.6 14 8.2" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/><rect x="4" y="8.2" width="16" height="10.6" rx="3" fill="#fff"/><path d="M10.2 11.4 14.4 13.5 10.2 15.6Z" fill="#00a1d6"/></symbol>
  <symbol id="pl-youtube" viewBox="0 0 24 24"><rect width="24" height="24" rx="5" fill="#f00"/><path d="M10 7.8 17 12 10 16.2Z" fill="#fff"/></symbol>
  <symbol id="pl-tiktok" viewBox="0 0 24 24"><rect width="24" height="24" rx="5" fill="#010101"/><path d="M14 4.4c.3 2.1 1.5 3.3 3.5 3.5v2.4c-1.3 0-2.5-.4-3.5-1.1v4.8c0 2.7-2 4.6-4.4 4.6-2.3 0-4.1-1.7-4.1-4s1.8-4 4.2-4c.3 0 .6 0 .9.1v2.5c-.3-.1-.6-.2-.9-.2-1 0-1.8.7-1.8 1.6 0 .9.7 1.6 1.7 1.6s1.8-.7 1.8-1.9V4.4H14Z" fill="#fff"/></symbol>
</svg>

<div class="shell">
  <aside class="sidebar">
    <a class="brand" href="account-wall.html">versekit <span>/ vk</span></a>
    <a class="publish" href="publish.html">+ 发布内容</a>
    <nav class="nav" aria-label="主导航">
      <a href="account-wall.html" aria-current="page">账号</a>
      <a href="publish.html">发布</a>
      <a href="calendar.html">计划</a>
      <a href="overview.html">总览</a>
      <a href="runs.html">任务与日志</a>
    </nav>
    <div class="local"><strong><i></i>本地运行中</strong>凭证与数据只在这台电脑</div>
  </aside>

  <main id="main"><div class="page">
    <header class="pagehead">
      <div>
        <div class="crumb"><span>跨组总览 · 只读</span></div>
        <h1>全部账号组</h1>
        <p class="sub" id="sub">正在加载…</p>
      </div>
      <a class="btn" id="back" href="account-wall.html">返回工作区</a>
    </header>

    <div class="toolbar">
      <span>行是账号组，列是平台；点任意一格进入那个账号组。</span>
      <span>登录检查 19:26 · 每 15 分钟</span>
    </div>

    <table class="matrix" aria-label="全部账号组的平台账号总览">
      <caption>每个账号组在五个平台上的账号与状态</caption>
      <colgroup><col class="group"><col class="platform"><col class="platform"><col class="platform"><col class="platform"><col class="platform"></colgroup>
      <thead><tr><th scope="col">账号组</th><th scope="col">小红书</th><th scope="col">抖音</th><th scope="col">B站</th><th scope="col">YouTube</th><th scope="col">TikTok</th></tr></thead>
      <tbody id="body"></tbody>
    </table>

    <div class="legend">
      <span><span class="dot bad"></span>登录已失效</span>
      <span><span class="dot warn"></span>将过期或待放行</span>
      <span><span class="dot ok"></span>正常</span>
      <span><span class="dot mute"></span>未接入</span>
    </div>

    <footer class="pagefoot">
      <span>这里只是总览；日常工作请进入某个账号组。</span>
      <a href="groups.html">管理账号组 →</a>
    </footer>
  </div></main>
</div>

<script src="store.js"></script>
<script src="app.js"></script>
<script>
const platforms = VK.platforms;
const groups = VK.groups();

function render(){
  const all = VK.accounts();
  const bad = all.filter(a=>a.level==='bad').length;
  const warn = all.filter(a=>a.level==='warn').length;
  document.getElementById('sub').textContent =
    Object.keys(groups).length + ' 个账号组 · ' + all.length + ' 个平台账号 · ' +
    (bad ? bad + ' 个登录异常' : '没有登录异常') + (warn ? ' · ' + warn + ' 个将过期' : '');

  const last = VK.storage.raw('vk-current-group');
  if(last && groups[last]) document.getElementById('back').href = 'account-wall.html?group=' + encodeURIComponent(last);

  const body = document.getElementById('body');
  body.innerHTML = '';
  Object.values(groups).forEach(g=>{
    const list = VK.accounts(g.id);
    const badN = list.filter(a=>a.level==='bad').length;
    const warnN = list.filter(a=>a.level==='warn').length;

    const tr = document.createElement('tr');
    const th = document.createElement('th');
    th.className = 'group-head';
    th.scope = 'row';
    th.innerHTML = '<span class="group-name"></span><span class="group-meta"></span>' +
      '<a class="group-link" href="account-wall.html?group='+encodeURIComponent(g.id)+'">进入这个账号组 →</a>';
    th.querySelector('.group-name').textContent = g.label;
    th.querySelector('.group-meta').textContent = list.length + '/5 接入 · ' +
      (badN ? badN + ' 登录异常' : warnN ? warnN + ' 将过期' : '登录正常');
    tr.appendChild(th);

    Object.entries(platforms).forEach(([key,p])=>{
      const td = document.createElement('td');
      const a = list.find(x=>x.platform===key);
      if(a){
        const cell = document.createElement('a');
        cell.className = 'cell' + (a.level?' level-'+a.level:'');
        cell.href = 'account-wall.html?group=' + encodeURIComponent(g.id);
        cell.setAttribute('aria-label', g.label + ' · ' + p.name + ' · ' + a.handle);
        cell.innerHTML = '<span class="cell-head"><svg class="plogo" aria-hidden="true"><use href="#'+p.logo+'"/></svg><span class="chandle"></span></span>' +
          (a.level ? '<span class="badge '+(a.level==='bad'?'bad':'warn')+'">'+(a.level==='bad'?'登录已失效':'登录将过期')+'</span>'
                   : '<span class="status-ok"><i></i>登录正常</span>') +
          '<span class="mini'+(a.level==='bad'?' bad':a.action==='去放行'?' warn':'')+'"><i>发</i><b>'+a.pubShort+'</b></span>' +
          '<span class="mini'+(a.level==='bad'?' bad':'')+'"><i>采</i><b>'+a.collectShort+'</b></span>';
        cell.querySelector('.chandle').textContent = a.handle;
        td.appendChild(cell);
      } else {
        const cell = document.createElement('div');
        cell.className = 'cell empty';
        cell.innerHTML = '<span class="cell-head"><svg class="plogo" aria-hidden="true"><use href="#'+p.logo+'"/></svg><span class="chandle">'+p.name+'</span></span>' +
          '<span class="empty-state">未接入</span>' +
          '<a class="empty-link" href="add.html?group='+encodeURIComponent(g.id)+'&platform='+key+'">+ 添加</a>';
        td.appendChild(cell);
      }
      tr.appendChild(td);
    });
    body.appendChild(tr);
  });
}

render();
</script>
</body>
</html>
