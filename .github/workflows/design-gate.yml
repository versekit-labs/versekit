name: design-gate

# 设计闸门：让"忘记按流程做"变成 CI 红灯，而不是用户的差评。
on:
  push:
    paths:
      - 'docs/design/**'
      - '.impeccable/surfaces/**'
      - 'scripts/design-check.mjs'
      - 'DESIGN.md'
  pull_request:
    paths:
      - 'docs/design/**'
      - '.impeccable/surfaces/**'
      - 'scripts/design-check.mjs'
      - 'DESIGN.md'

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 静态部分（任务书齐全、导航一致、无死链、检测器干净）不需要浏览器。
      - name: Impeccable detector + 静态闸门
        run: node scripts/design-check.mjs

      # 运行时部分（触控、溢出、hidden 生效）需要 Chrome。
      # 找不到浏览器时脚本会输出提示并跳过，不会误报通过。
      - name: 运行时闸门
        run: |
          if command -v google-chrome >/dev/null || command -v chromium >/dev/null; then
            node scripts/design-check.mjs
          else
            echo "::warning::本机无 Chrome，运行时检查已跳过；请在本地跑 npm run design:check 补齐"
          fi